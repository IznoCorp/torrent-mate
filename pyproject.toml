[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personalscraper"
dynamic = ["version"]
description = "Media pipeline automation — ingest, sort, scrape, verify, dispatch."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "LounisBou", email = "LounisBou@users.noreply.github.com"}
]
keywords = ["media", "plex", "kodi", "nfo", "scraper", "automation", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "qbittorrent-api>=2025.1.0",
    "transmission-rpc>=7.0.0",
    "guessit>=3.8.0",
    "rapidfuzz>=3.14.0",
    "tenacity>=9.1.0",
    "rich>=14.0.0",
    "structlog>=25.0.0",
    "json5>=0.9.14",
    "xmltodict>=0.13.0",
    "yt-dlp>=2026.1.1,<2027",
    "pymediainfo>=6.1.0",
    "enzyme>=0.5.2",
    "xxhash>=3.4.0",
    "filelock>=3.13.0",
    "rarfile>=4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "PyJWT>=2.8",
    # FCM HTTP v1: mints the service account's access token (not firebase-admin, which pulls gRPC).
    "google-auth>=2.40",
    # Fernet: the Plex tokens a sign-in keeps are encrypted in app.db.
    "cryptography>=49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-requests>=2.31.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=4.0.0",
    "sqlite-utils>=3.36",
    "pyfakefs>=5.4.0",
    "hypothesis>=6.100.0",
    "pytest-xdist>=3.8.0",
    # Inert without --testmon; only `make test-impacte` passes the flag.
    "pytest-testmon>=2.1.0",
    "responses>=0.25.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "httpx>=0.27",
    "fakeredis>=2.23",
    # Read by `scripts/check-mock-seeds.py --arm schema`, which validates every
    # mock seed against the maquette contract's own schema. It was already
    # importable here — as a transitive dependency of `mcp` and `nbformat`, on
    # this machine only — and a guard resting on that is a guard the runner
    # cannot run. B-077 is the same shape read from the other end.
    "jsonschema>=4.20",
]

# The app-e2e lane's browser driver (`tests/app_e2e`, `-m app_e2e`). Pinned here so it lands in
# `uv.lock` like everything else; the browsers themselves are fetched by `playwright install`.
e2e = [
    "playwright==1.63.0",
]

[project.scripts]
# `torrentmate` is the project's public command name; `personalscraper` is kept
# as a backward-compatible alias (same entry point). The Python package, config
# paths and PM2 app names remain `personalscraper` until the full code rename.
torrentmate = "personalscraper.cli:app"
personalscraper = "personalscraper.cli:app"

[tool.setuptools.dynamic]
version = {attr = "personalscraper.__version__"}

[tool.setuptools.packages.find]
include = ["personalscraper*"]

[tool.setuptools.package-data]
# SQL migration scripts are loaded at runtime by core/sqlite apply_migrations and
# MUST ship in the wheel (indexer, acquire and app). Without
# this, a wheel/pip install of the package boots with an empty DB and no schema.
"personalscraper.indexer.migrations" = ["*.sql"]
"personalscraper.acquire.migrations" = ["*.sql"]
"personalscraper.app.store.migrations" = ["*.sql"]
# The web UI SPA (Vite build output) is served by web/static.py. Ship whatever is
# present under web/static/: the .gitkeep placeholder in a source checkout, or the
# real built bundle (index.html + assets/**) after `cd frontend && npm run build`.
"personalscraper.web" = ["static/*", "static/**/*", "static/.gitkeep"]
# The backend translation catalogues are read at runtime through importlib.resources.
"personalscraper.i18n" = ["fr/*.json", "en/*.json", "one_sided/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
# KEEP A TEMPORARY DIRECTORY ONLY WHERE IT CAN STILL BE READ — a test that
# failed. pytest's default is `all`, which keeps every test's directory for the
# last three passes; on 2026-08-26 that filled this machine's boot volume. The
# placeholders are sparse now (`tests/_media_files.py`), so the 13 GB a pass
# left behind is gone at the source — this line is the second half: what a green
# pass leaves behind is nothing at all, whatever a future fixture writes.
tmp_path_retention_policy = "failed"
markers = [
    "e2e: End-to-end tests requiring storage disks and/or live APIs",
    "roundtrip: Roundtrip tests — torrentify disk media, re-match via API, compare",
    "e2e_torrent: Pipeline E2E with real torrent downloads (manual only, costs ratio)",
    "e2e_idempotence: E2E idempotence tests on real staging data (manual only)",
    "network: Network tests — opt-in via TRAILER_INTEGRATION_TESTS=1 env var",
    "slow: slow tests (perf regression), off by default — run with -m slow",
    "darwin_only: macOS-only smoke tests (skipped on Linux/Windows CI runners)",
    "multifs: filesystem-capability tests using faked mount/stat fixtures (no real disks required)",
    "real_mount_check: keep the real mount reading (tests that prove a folder on the system disk is not a mounted disk)",
    "integration: cross-module characterization / integration tests (not unit; may build a temp library FS)",
    "app_e2e: the built client against a seeded v1 server in a browser (needs `npm run build:app` and Playwright)",
]
addopts = "-m 'not e2e and not e2e_torrent and not e2e_idempotence and not slow and not network and not app_e2e'"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D", "BLE", "S608", "PLC0415", "B", "C901", "RUF100", "UP"]
ignore = ["D104"]  # D104=__init__ docstring
# D100 was ignored with the note « enforced manually », which is the definition
# of no arm — CLAUDE.md says docstrings are mandatory on all MODULES too. Three
# files were missing one; they have one now, and the rule is enforced.

# `scripts/`, the maquette harness and `frontend/scripts/` were linted by NOTHING —
# not `make lint`, not the pre-push hook, not CI — while CLAUDE.md says docstrings are
# mandatory on all functions and methods. They are in scope now, and the rules their
# existing code breaks are DECLARED here rather than the whole scope being ignored: a
# new file in those trees is held to everything else from its first line, and this
# list can only shrink.
[tool.ruff.lint.per-file-ignores]
# The living tools keep D103: a new script is held to it from its first line.
"scripts/*.py" = ["D205", "D301", "D107", "E501", "E701", "E702", "E741", "F401", "F405", "F841", "I001", "B023", "B904", "B905", "BLE001", "C901", "PLC0415", "S608", "RUF100"]
"webui/harness/*.py" = ["D103", "D205", "D301", "D107", "E501", "E701", "E702", "E741", "F401", "F405", "F841", "I001", "B023", "B904", "B905", "BLE001", "C901", "PLC0415", "UP031", "RUF100"]
"frontend/scripts/*.py" = ["D103", "D205", "D301", "D107", "E501", "E701", "E702", "E741", "F401", "F405", "F841", "I001"]
"webui/*.py" = ["B904", "C901", "PLC0415", "RUF100"]

# BLE, S608, PLC0415, B, C901, RUF100 and UP are held on `personalscraper/app/`, `personalscraper/http_v1/` and
# `personalscraper/core/` (the v1 trees): a finding there is fixed, or carries a local
# `# noqa: <code> — <reason>` where the code is right. Every other tree DECLARES below the rules its existing
# code still breaks, the same way as above: a new file there is held to everything else from its first line,
# and this list can only shrink. The v0 trees (`personalscraper/web/`, `tests/`, the CLI) are not rewritten for it.
"personalscraper/cli.py" = ["B008", "PLC0415"]
"personalscraper/lock.py" = ["PLC0415"]
"personalscraper/logger.py" = ["PLC0415"]
"personalscraper/naming_patterns.py" = ["PLC0415"]
"personalscraper/pause.py" = ["PLC0415"]
"personalscraper/pipeline.py" = ["BLE001", "C901", "PLC0415", "RUF100"]
"personalscraper/pipeline_history.py" = ["BLE001", "C901"]
"personalscraper/pipeline_steps.py" = ["PLC0415"]
"personalscraper/text_utils.py" = ["PLC0415"]
"personalscraper/acquire/**/*.py" = ["BLE001", "C901", "PLC0415", "S608", "UP042", "RUF100"]
"personalscraper/api/**/*.py" = ["B905", "BLE001", "C901", "PLC0415", "UP042", "UP046", "UP047", "RUF100"]
"personalscraper/cli_helpers/**/*.py" = ["B904"]
"personalscraper/commands/**/*.py" = ["B008", "BLE001", "C901", "PLC0415", "UP042", "RUF100"]
"personalscraper/conf/**/*.py" = ["B904", "B905", "C901", "PLC0415", "RUF100"]
"personalscraper/dispatch/**/*.py" = ["B008", "BLE001", "C901", "PLC0415", "UP036", "RUF100"]
"personalscraper/enforce/**/*.py" = ["C901"]
"personalscraper/i18n/**/*.py" = ["UP040"]
"personalscraper/indexer/**/*.py" = ["B007", "B008", "B904", "BLE001", "C901", "PLC0415", "S608", "UP035", "UP040", "UP042", "RUF100"]
"personalscraper/ingest/**/*.py" = ["BLE001", "C901", "PLC0415", "RUF100"]
"personalscraper/insights/**/*.py" = ["C901"]
"personalscraper/maintenance/**/*.py" = ["B008", "BLE001", "C901", "PLC0415", "RUF100"]
"personalscraper/process/**/*.py" = ["C901", "PLC0415"]
"personalscraper/push/**/*.py" = ["S608"]
"personalscraper/scraper/**/*.py" = ["BLE001", "C901", "PLC0415", "S608", "UP047", "RUF100"]
"personalscraper/sorter/**/*.py" = ["C901", "PLC0415", "RUF100"]
"personalscraper/subscribers/**/*.py" = ["BLE001", "PLC0415", "RUF100"]
"personalscraper/trailers/**/*.py" = ["B904", "C901", "PLC0415", "RUF100"]
"personalscraper/verify/**/*.py" = ["C901", "PLC0415"]
"personalscraper/web/**/*.py" = ["B008", "B904", "BLE001", "C901", "PLC0415", "S608", "UP042", "RUF100"]
"tests/**/*.py" = ["B007", "B017", "B018", "B904", "B905", "BLE001", "C901", "PLC0415", "S608", "UP017", "UP031", "UP045", "UP046", "RUF100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["personalscraper"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["enzyme.*", "guessit.*", "qbittorrent_api.*", "rapidfuzz.*", "rarfile.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["personalscraper", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    ".data",
    ".personalscraper",
]
# Pyright resolves imports against pythonPath / venv. Without extraPaths,
# the LSP (which often runs from a venv that does not have personalscraper
# installed editable) cannot find ``personalscraper.*`` and emits hundreds of
# "could not be resolved" warnings. Anchoring at the repo root makes the
# package importable regardless of the active interpreter.
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.coverage.run]
source = ["personalscraper"]
omit = [
    "personalscraper/__main__.py",
]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]
