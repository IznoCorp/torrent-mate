[extend]
useDefault = true

[allowlist]
paths = [
    '''.env\.example''',
    '''assets/torrents/''',
    '''docs/''',
    '''CONFIGURATION\.md''',
    '''INSTALLATION\.md''',
    '''MANUAL\.md''',
]
regexes = [
    '''abcdef1234567890abcdef1234567890''',
    # The tracker-capture redaction tests plant fake keys that all start with PLANTED.
    '''^PLANTED[a-z0-9]+$''',
]
