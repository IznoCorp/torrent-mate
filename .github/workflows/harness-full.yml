# Every maquette rule, on GitHub's runners rather than on IznoServer (the
# operator's ruling of 2026-09-30: the machine serves production too, and the
# heavy verification of a lot goes to CI). Runs for a pull request that touches
# the maquette — a lot's — and on demand; four shards in parallel.
name: Harness full suite

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'frontend/maquette/**'
      - '.github/workflows/harness-full.yml'

permissions:
  contents: read

concurrency:
  group: harness-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-full:
    name: harness-full (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-ci-on-draft')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - run: pip install jsonschema
      - run: pip install -e .
      - run: npm ci --prefix frontend/maquette/design
      - run: frontend/maquette/harness/run.sh --ci --shard ${{ matrix.shard }}/4
        env:
          TM_HARNESS_LOG_DIR: harness-logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-full-shard-${{ matrix.shard }}
          path: harness-logs
          retention-days: 30
