# Every maquette rule, on GitHub's runners rather than on IznoServer (the
# operator's ruling of 2026-09-30: the machine serves production too, and the
# heavy verification of a lot goes to CI). Runs for a pull request that touches
# the maquette — a lot's — and on demand; four shards in parallel.
#
# REQUIRED (the operator, 2026-09-30: « oui, rends harness-full obligatoire »),
# so the workflow reports on EVERY pull request: a `paths:` filter on the
# trigger would leave a pull request that does not touch the maquette waiting
# for a check that never comes. The `changes` job decides instead, the shards
# run only when the maquette moved, and the aggregate `harness-full` job is the
# one check the ruleset requires — green when the shards passed or had nothing
# to run.
name: Harness full suite

on:
  workflow_dispatch:
  # develop after every merge, every shard: a PR merges without being up to
  # date with develop, so develop itself is read (ci.yml says the same).
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop, prod]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harness-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-ci-on-draft')
    outputs:
      # On demand the whole suite runs: there is no file list to filter.
      maquette: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.maquette }}
    steps:
      # No checkout: on pull_request events the filter reads the PR file list
      # from the API.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            maquette:
              - 'webui/**'
              - 'contract/**'
              - '.github/workflows/harness-full.yml'
              - '.github/actions/locked-install/**'
              - 'uv.lock'
              # machine.py (R67) reads the ecosystem's processes (B-686).
              - 'ecosystem.config.js'
              # machine.py (« no engine command is forgotten ») imports the
              # maintenance REGISTRY and compares it with the commands drawn.
              - 'personalscraper/app/maintenance/registry.py'
              # pwa.py (R52) compares the icons the host serves with the app's own.
              - 'frontend/public/**'

  shards:
    name: harness-full (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.maquette == 'true' && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-ci-on-draft'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # jsonschema and the project come from the lock (the `dev` extra carries it);
      # playwright comes from the lock too, through the `e2e` extra every lane shares.
      - uses: ./.github/actions/locked-install
      - run: uv sync --locked --python 3.12 --extra dev --extra e2e
      - run: python -m playwright install --with-deps chromium webkit
      - run: npm ci --prefix webui/design
      - run: webui/harness/run.sh --ci --shard ${{ matrix.shard }}/4
        env:
          TM_HARNESS_LOG_DIR: harness-logs
          # responsive.py's nine passes side by side: its cost is an idle wait per
          # state per pass, and three at a time no longer fit run.sh's 600 s bound.
          TM_RESPONSIVE_PARALLEL: "9"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-full-shard-${{ matrix.shard }}
          path: harness-logs
          retention-days: 30

  harness-full:
    name: harness-full
    runs-on: ubuntu-latest
    needs: [changes, shards]
    if: always() && !cancelled()
    steps:
      - name: The shards passed, or the maquette did not move
        env:
          MAQUETTE: ${{ needs.changes.outputs.maquette }}
          SHARDS: ${{ needs.shards.result }}
        run: |
          if [ "$MAQUETTE" = "true" ] && [ "$SHARDS" != "success" ]; then
            echo "The maquette moved and the shards ended '$SHARDS'."
            exit 1
          fi
          echo "maquette=${MAQUETTE:-false} shards=$SHARDS"
