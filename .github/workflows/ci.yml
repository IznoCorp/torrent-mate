name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # No paths-ignore: doc-only PRs (archive, README updates, plan files) would
    # otherwise skip the workflow entirely. Required-status-check rules on main
    # then leave the PR stuck in "expected" state forever (no run = no result).
    # Running CI on every PR (~3-5 min) is cheaper than diagnosing stuck PRs.
    # `labeled`/`unlabeled`: `version-bump`'s `no-version-bump` exemption reads
    # the PR's label set from the EVENT PAYLOAD, frozen at whichever event
    # dispatched the run — adding the label after `opened` changed nothing until
    # a new event re-dispatched with it. #488 was refused by its own version-bump
    # job while correctly carrying the label, because nothing re-triggered.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Stage 0: What changed? ────────────────────────────
  # Path filtering happens at the JOB level, never at the trigger: every job
  # always starts and reports a real conclusion (steps are skipped when the PR
  # is out of the job's scope, so the job goes green in seconds). A trigger
  # `paths-ignore` would produce NO run at all and leave required checks stuck
  # in "expected" — see the comment on the trigger above.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.raffine.outputs.python }}
      deps: ${{ steps.filtre.outputs.deps }}
      frontend_app: ${{ steps.raffine.outputs.frontend_app }}
      maquette: ${{ steps.filtre.outputs.maquette }}
      docs: ${{ steps.filtre.outputs.docs }}
    steps:
      # No checkout: on pull_request events the filter reads the PR file list
      # from the API.
      - uses: dorny/paths-filter@v3
        id: filtre
        with:
          list-files: json
          filters: |
            python:
              - 'personalscraper/**'
              - 'tests/**'
              - 'scripts/**'
              - 'config.example/**'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            deps:
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend_app:
              - 'frontend/**'
              - 'personalscraper/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            maquette:
              - 'frontend/maquette/**'
              - '.github/workflows/ci.yml'
            # design-gaps parses design-doc ANCHORS (audit_design_coverage.py):
            # a docs-only PR that renames a heading can flip its verdict.
            docs:
              - 'docs/**'
      # Refinements the filter's glob language cannot express (negation only
      # works with the global 'every' quantifier, which would break the plain
      # filters above):
      # - `personalscraper/__init__.py` alone is NOT a python change: every PR
      #   bumps the version there (operator rule), and counting the bump as
      #   python code would re-run the full suite on doc/maquette-only PRs —
      #   the exact cost this filter exists to remove. A substantive edit to
      #   that file virtually always accompanies other python changes; the
      #   local phase gates run the full suite regardless.
      # - `frontend/maquette/**` is NOT a frontend-app change: the maquette
      #   has its own steps, gated by the `maquette` output.
      - id: raffine
        env:
          PYTHON_FILES: ${{ steps.filtre.outputs.python_files }}
          FRONTEND_FILES: ${{ steps.filtre.outputs.frontend_app_files }}
        run: |
          set -euo pipefail
          python=$(jq -r 'map(select(. != "personalscraper/__init__.py")) | length > 0' <<< "${PYTHON_FILES}")
          frontend_app=$(jq -r 'map(select(. != "personalscraper/__init__.py" and (startswith("frontend/maquette/") | not))) | length > 0' <<< "${FRONTEND_FILES}")
          echo "python=${python}" >> "$GITHUB_OUTPUT"
          echo "frontend_app=${frontend_app}" >> "$GITHUB_OUTPUT"
          echo "python=${python} frontend_app=${frontend_app}"

  # ── Stage 1: Fast checks (parallel) ───────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.python == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.python == 'true'
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-3.12-
      - run: pip install ruff
        if: needs.changes.outputs.python == 'true'
      - run: ruff check personalscraper/ tests/ scripts/ frontend/maquette/harness/ frontend/scripts/
        if: needs.changes.outputs.python == 'true'
      - run: ruff format --check personalscraper/ tests/
        if: needs.changes.outputs.python == 'true'
      - run: python scripts/check_logging.py personalscraper/
        if: needs.changes.outputs.python == 'true'

  # The no-French rule spans the WHOLE repository — its file-name arm reads every
  # path outside `docs/` — so it gets a job of its own, and that job carries NO
  # path filter at all. A filtered version skipped a version-bump-only PR
  # (`personalscraper/__init__.py` is stripped from both python and frontend
  # filters by design), which is a real shape this repository produces; and a
  # guard that can report green having read nothing is the exact failure the
  # script refuses to commit internally. Seven seconds, standard library only.
  no-french:
    name: no-french
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dictionary arm asks an oracle from OUTSIDE the repository: a word
      # French knows and English does not is a suspect. Without the
      # dictionaries the arm fail-softs and says it measured nothing — which is
      # honest, and useless as a gate. So CI installs them.
      - run: sudo apt-get update && sudo apt-get install -y aspell aspell-en aspell-fr
      - run: python scripts/check-no-french.py
      - run: python3 scripts/check-css-tokens.py
      # Load-bearing CSS: the declarations the compositor reads. It runs beside the
      # token guard because it answers the same question from the other side — the
      # token guard asks whether a value is on the scale, this one asks whether a
      # declaration is still there at all.
      - run: python3 scripts/check-compositor-css.py
      # The Tailwind scan, held from BOTH ends. It needs a build, and the
      # maquette's build is where the generated utilities can be read.
      - run: cd frontend/maquette/design && npm ci && npm run build
      - run: python3 scripts/check-tailwind-confinement.py
      # The residue D-L07-5 let survive the conversion may only SHRINK.
      # It is legitimate CSS in a file whose purpose is to hold
      # legitimate CSS, so no other guard can tell a new hand-written
      # rule from the ones already there — only its own ceiling can.
      - run: python3 scripts/check-legacy-css-residue.py
      - run: python3 scripts/check-markup-contracts.py
      - run: python3 scripts/check-frontend-boundaries.py
      - run: python3 frontend/maquette/oracle.py --contracts

  # `make check` runs twelve guards; CI ran ONE of them (no-french), so eleven
  # were developer-machine checks describing themselves as gates. A gate proves
  # what it reads, and a gate nobody runs reads nothing. None of these import
  # `personalscraper`, so they need Python and nothing else.
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The ceiling applied everywhere but to the project's OWN tools, which is
      # how the language guard reached 1 411 lines against a hard limit of 1 000.
      - run: python3 scripts/check-command-safety.py
      - run: python3 scripts/check-module-size.py
      - run: python3 scripts/check-module-size.py --root scripts
      - run: python3 scripts/check-module-size.py --root tests
      - run: python3 scripts/check-module-size.py --root frontend
      - run: python3 scripts/check-i18n-placeholders.py
      - run: python3 scripts/check-no-broad-registry-catch.py
      - run: python3 scripts/check-typed-api.py
      - run: python3 scripts/check-pragma-discipline.py
      - run: python3 scripts/audit-cli-coverage.py
      - run: python3 scripts/cli-coverage-report.py --check
      # Fail-soft by design when `.data/acquire.db` is absent, which it always
      # is on a runner: the fixture is checked against the OPERATOR's live
      # database. It says so rather than claiming a parity it never measured.
      - run: python3 scripts/refresh-maquette-fixture.py --check

  harness-contracts:
    name: harness-contracts
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      # The filter is per STEP, never on the job — see the note above `changes`:
      # a job-level `if` yields a SKIPPED job, and a required check that is
      # skipped can sit in « expected » forever. Every other job in this file
      # does it this way; this one did not, and was the only exception.
      - uses: actions/checkout@v4
        if: needs.changes.outputs.maquette == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.maquette == 'true'
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.maquette == 'true'
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
        if: needs.changes.outputs.maquette == 'true'
      - run: npm ci --prefix frontend/maquette/design
        if: needs.changes.outputs.maquette == 'true'
      # The CONTRACT subset only. The 50-rule suite is a wave gate, not a
      # per-PR one: 50 headless-Chrome runs cost 20-25 minutes, and these five
      # are the ones that fall when a NAME moves without all of its ends —
      # which is what a pull request most often does wrong.
      # The rules launch `channel="chrome"`. `PARITY_BROWSER_CHANNEL` used to
      # redirect that, and its only reader went with `parity-probe.py` — setting
      # it here would be green by accident of the runner shipping Chrome, which
      # is the failure `tests/conftest.py` was just fixed for.
      - run: frontend/maquette/harness/run.sh --contracts
        if: needs.changes.outputs.maquette == 'true'
      # The accessibility tier, as its own step and not folded into the subset
      # above: the contracts answer « did a NAME move without all of its ends? »
      # and an accessibility violation is not that question. Cheap enough for a
      # per-PR gate — one browser, 83 states, ~25 s.
      #
      # WHAT IT PROVES TODAY, stated plainly because the answer is « less than
      # it will »: L03 lands this tier RECORDING, so it reports a count and
      # exits 0. What it therefore guards right now is that the instrument RUNS
      # on the runner — axe-core installed by `npm ci`, the states reachable,
      # the frame at rest — which is the failure that would otherwise be found
      # on the day the floor is armed. L03's last phase makes it a refusal.
      - run: frontend/maquette/harness/run.sh --a11y
        if: needs.changes.outputs.maquette == 'true'

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.python == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.python == 'true'
        with:
          path: |
            .venv/
            .mypy_cache
          key: venv-mypy-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: venv-mypy-${{ runner.os }}-3.12-
      - run: pip install -e ".[dev]"
        if: needs.changes.outputs.python == 'true'
      - run: mypy personalscraper/
        if: needs.changes.outputs.python == 'true'

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: cache-gitleaks
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.local/bin
          LATEST=$(curl --connect-timeout 10 --max-time 30 -sSfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl --connect-timeout 10 --max-time 30 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${LATEST}/gitleaks_${LATEST}_linux_x64.tar.gz" | tar xz
          mv gitleaks ~/.local/bin/
      - name: Scan PR commits for secrets
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --verbose

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.deps == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.deps == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.deps == 'true'
        with:
          path: .venv/
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-3.12-
      - run: pip install -e . pip-licenses
        if: needs.changes.outputs.deps == 'true'
      - if: needs.changes.outputs.deps == 'true'
        run: pip-licenses --fail-on="GPL;GPL-2.0;GPL-3.0;GPL-2.0-only;GPL-3.0-only;GPL-2.0-or-later;GPL-3.0-or-later;GNU General Public License (GPL);GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 or later (GPLv3+);AGPL;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);SSPL;SSPL-1.0;Server Side Public License"

  # ── Stage 2: Tests & security (depend on Stage 1) ─────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck]
    # config-home (#326): the live config left the repo; fixtures that resolve a config
    # dir (CWD fallback) get the tracked config.example via the resolver's env-first seam.
    env:
      PERSONALSCRAPER_CONFIG: ${{ github.workspace }}/config.example
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.python == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.python == 'true'
        with:
          path: .venv/
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-3.12-
      # RAR extractor backend for the DEV #1 golden-fixture extraction test
      # (rarfile shells out to it). `unar` is in ubuntu main; without it the
      # real-extraction test skips instead of asserting the happy path (COV-4).
      - run: sudo apt-get update && sudo apt-get install -y unar
        if: needs.changes.outputs.python == 'true'
      - run: pip install -e ".[dev]"
        if: needs.changes.outputs.python == 'true'
      # The renaming tool reads JS/TS through `scripts/source-spans.mjs`, which
      # requires `frontend/node_modules/typescript`. Without it, 13 of the 16
      # tests in `tests/scripts/test_rename_identifiers.py` SKIP here — and that
      # tool is the one about to be pointed at 35 000 lines of `legacy.js`, so
      # its proof has to be exercised where the gate is, not only on a developer
      # machine that happens to have run `npm ci`. Installing the ONE package
      # into an empty prefix keeps this to seconds instead of the frontend's
      # full dependency tree.
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.python == 'true'
        with:
          node-version: "22"
      - name: Install the TypeScript compiler the renaming tool parses through
        if: needs.changes.outputs.python == 'true'
        run: |
          mkdir -p /tmp/tsonly frontend/node_modules
          cd /tmp/tsonly
          npm install --no-save --no-fund --no-audit typescript@6.0.3
          cp -R /tmp/tsonly/node_modules/typescript "$GITHUB_WORKSPACE/frontend/node_modules/"
          node -e "console.log('typescript', require('$GITHUB_WORKSPACE/frontend/node_modules/typescript/package.json').version)"
      # Run the full test suite (tests/) — the previous split into
      # tests/unit/ + tests/integration/ only covered 883 of 5521 tests
      # (~16%), yielding 44% combined coverage (well below fail_under=90).
      # pyproject.toml's `addopts` already excludes e2e/slow/network markers.
      #
      # Dummy provider credentials are required because Phase 15 of
      # feat/registry removed the autouse `_patch_provider_registry_for_cli_tests`
      # fixture; the real ProviderRegistry now boots in every CliRunner-driven
      # test, and its boot validation rejects empty TMDB_API_KEY / TVDB_API_KEY
      # with [missing_credentials]. Locally `.env` provides these via
      # `load_dotenv()` at `personalscraper.__init__`; CI has no .env file.
      - env:
          TMDB_API_KEY: dummy
          TVDB_API_KEY: dummy
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest tests/ -q --no-header -n auto --cov=personalscraper --cov-branch --cov-fail-under=0
      # Rename to non-dotfile so upload-artifact@v4 picks it up
      # (v4 silently skips dotfiles by default).
      - run: mv .coverage coverage.dat
        if: needs.changes.outputs.python == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.python == 'true'
        with:
          name: coverage
          path: coverage.dat

  security:
    name: security
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.deps == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.deps == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.deps == 'true'
        with:
          path: .venv/
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-3.12-
      # Upgrade pip itself first — the runner ships pip 26.0.1 which carries
      # CVE-2026-6357 (fixed in 26.1). Auditing with the upgraded pip removes
      # the finding entirely instead of suppressing it.
      - run: python -m pip install --upgrade "pip>=26.1"
        if: needs.changes.outputs.deps == 'true'
      - run: pip install -e . pip-audit
        if: needs.changes.outputs.deps == 'true'
      # CVE-2026-3219 affects pip; no fix released yet. Ignore until upstream patch.
      # TODO(security): remove --ignore-vuln CVE-2026-3219 once pip ships a fix.
      #                 Check https://nvd.nist.gov/vuln/detail/CVE-2026-3219 for status.
      - run: pip-audit --ignore-vuln CVE-2026-3219
        if: needs.changes.outputs.deps == 'true'

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend_app == 'true' || needs.changes.outputs.maquette == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend_app == 'true' || needs.changes.outputs.maquette == 'true'
        with:
          node-version: "22"
          cache: npm
          # Both lockfiles: a design/-only bump used to leave the cache key
          # stale (slow install, never wrong).
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/maquette/design/package-lock.json
      # lint:tokens greps with ripgrep; without it the guard used to silently
      # no-op (`rg: command not found` swallowed by `|| true`, 2026-07-15).
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
        if: needs.changes.outputs.frontend_app == 'true'
      - run: npm ci
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - run: npx tsc -b --noEmit
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - run: npm ci
        if: needs.changes.outputs.maquette == 'true'
        working-directory: frontend/maquette/design
      - run: npm run typecheck
        if: needs.changes.outputs.maquette == 'true'
        working-directory: frontend/maquette/design
      - run: npm run lint
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - run: npm run lint:ds
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - run: npm run test -- --run
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - run: npm run build
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: frontend
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.frontend_app == 'true'
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        if: needs.changes.outputs.frontend_app == 'true'
      # config-home (#326): the live config left the repo (config/ untracked, canonical at
      # ~/.torrentmate/config). CI boots the app for OpenAPI generation against the tracked
      # config.example/ via the resolver's env-first seam — never a real config.
      - run: make openapi
        if: needs.changes.outputs.frontend_app == 'true'
        env:
          PERSONALSCRAPER_CONFIG: ${{ github.workspace }}/config.example
      - run: git diff --exit-code frontend/openapi.json frontend/src/api/schema.d.ts
        if: needs.changes.outputs.frontend_app == 'true'

  # ── Stage 3: Coverage gate + upload ───────────────────
  coverage-merge:
    name: coverage-merge
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.python == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.python == 'true'
        with:
          name: coverage
      - run: pip install coverage "tomli; python_version < '3.11'"
        if: needs.changes.outputs.python == 'true'
      - name: Check coverage against pyproject threshold
        if: needs.changes.outputs.python == 'true'
        run: |
          set -euo pipefail
          # Single test job already covers tests/, so no combine needed —
          # just restore the dotfile name `coverage` expects and report.
          mv coverage.dat .coverage
          THRESHOLD=$(python3 scripts/get_coverage_threshold.py)
          coverage report --fail-under="${THRESHOLD}"
          coverage xml -o coverage.xml
      - uses: codecov/codecov-action@v4
        if: needs.changes.outputs.python == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork == false }}
      - name: Verify fail_under is monotonic against base ref
        if: needs.changes.outputs.python == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          head_threshold=$(python3 scripts/get_coverage_threshold.py)
          main_threshold=$(git show "origin/${BASE_REF}:pyproject.toml" | python3 scripts/get_coverage_threshold.py --stdin)
          echo "HEAD: ${head_threshold} | base (${BASE_REF}): ${main_threshold}"
          if awk -v h="${head_threshold}" -v m="${main_threshold}" 'BEGIN{exit !(h<m)}'; then
            if echo ",${PR_LABELS}," | grep -q ',coverage-rollback,'; then
              echo "::warning::fail_under decreased (${main_threshold} → ${head_threshold}) — rollback acknowledged via label."
              exit 0
            fi
            echo "::error::fail_under decreased (${main_threshold} → ${head_threshold}). Add 'coverage-rollback' label to override."
            exit 1
          fi

  version-bump:
    name: version-bump
    runs-on: ubuntu-latest
    # Operator rule (constitution §10-3): every PR bumps the version. A
    # genuinely version-neutral PR opts out with the 'no-version-bump' label.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-version-bump')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert version bumped against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py --base "origin/${BASE_REF}"

  design-gaps:
    name: design-gaps
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
        with:
          path: .venv/
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-3.12-
      - run: pip install -e ".[dev]"
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
      - name: Map freshness check
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
        run: python3 scripts/update_feature_map.py --check
      - name: Design coverage audit
        # Promoted to hard error in Phase 8 (cycle-4 boundary). Orphans are
        # waived via tests/feature_map/<codename>.json `skip_audit` entries
        # (each carries a `reason` and an `expires` ISO date).
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
        run: python3 scripts/audit_design_coverage.py --strict
