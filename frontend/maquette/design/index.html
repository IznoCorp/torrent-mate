<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>TorrentMate Design</title>
    <!-- pwa:start — the document half of installability. The server half
         (manifest body, sw.js, brand assets, the offline page) stays in
         serve.py: those are routes, not markup. The login gate EXTRACTS this
         block rather than restating it, so there is exactly one copy. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS reads neither the manifest's display nor its short_name:
         standalone mode and the home-screen label are declared here, or the
         icon opens a Safari tab instead of an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- iOS reads this and never the manifest's short_name: without it the
         home-screen label falls back to the page title, which once put two
         identical « TorrentMate » side by side. -->
    <meta name="apple-mobile-web-app-title" content="TorrentMate Design" />
    <script>
      // Registration is best-effort here: R52 measures the worker registered
      // AND controlling against the live host, which is the only place a
      // worker exists. On a static server (the harness, a preview) there is
      // nothing to register, and an unhandled rejection would fail rules
      // about other things entirely.
      if ("serviceWorker" in navigator)
        addEventListener("load", () =>
          navigator.serviceWorker.register("/sw.js").catch(() => {}),
        );
    </script>
    <script>
      // The saved appearance is applied before the first paint: the default
      // (no data-theme attribute) paints dark, « clair » forces light, and
      // « systeme » follows the OS preference. The drawer's control writes
      // the same key this reads. It sits INSIDE the pwa markers on purpose:
      // the login gate borrows this whole block, and an operator who chose
      // an appearance is owed it on the gate too — not only past it.
      (function () {
        try {
          var mode = localStorage.getItem("tm-apparence") || "systeme";
          var clair =
            mode === "clair" ||
            (mode === "systeme" &&
              matchMedia("(prefers-color-scheme: light)").matches);
          if (clair)
            document.documentElement.setAttribute("data-theme", "light");
        } catch (erreur) {}
      })();
    </script>
    <!-- pwa:end -->
  </head>
  <body>
    <!-- The strangler shell: the router owns the URL and the history; the
         legacy engine below keeps every surface not yet migrated. The mount
         node starts here, a plain sibling of the fragment's phone frame, but
         coquille.tsx relocates it into `.device` before the first render —
         see that file's own comment — so a migrated screen (`/profil/$titre`,
         `/ajout`) is contained by the phone frame the same way the legacy
         `#screen` is, and paints behind it when both are open at once. -->
    <div id="coquille"></div>
    <script type="module" src="/src/coquille.tsx"></script>
    <!-- maquette -->
  </body>
</html>
