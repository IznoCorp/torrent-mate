<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>TorrentMate Design</title>
    <!-- pwa:start — the document half of installability. The server half
         (manifest body, sw.js, brand assets, the offline page) stays in
         serve.py: those are routes, not markup. The login gate EXTRACTS this
         block rather than restating it, so there is exactly one copy. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS reads neither the manifest's display nor its short_name:
         standalone mode and the home-screen label are declared here, or the
         icon opens a Safari tab instead of an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- iOS reads this and never the manifest's short_name: without it the
         home-screen label falls back to the page title, which once put two
         identical « TorrentMate » side by side. -->
    <meta name="apple-mobile-web-app-title" content="TorrentMate Design" />
    <script>
      // Registration is best-effort here: R52 measures the worker registered
      // AND controlling against the live host, which is the only place a
      // worker exists. On a static server (the harness, a preview) there is
      // nothing to register, and an unhandled rejection would fail rules
      // about other things entirely.
      if ("serviceWorker" in navigator)
        addEventListener("load", () =>
          navigator.serviceWorker.register("/sw.js").catch(() => {}),
        );
    </script>
    <!-- pwa:end -->
  </head>
  <body>
    <!-- The strangler shell: the router owns the URL and the history; the
         legacy engine below keeps every surface until SP4 empties it. The
         mount node is size-zero — in SP3 the shell renders nothing visual. -->
    <div id="coquille"></div>
    <script>
      // THE PRE-BRIDGE — the boot order, settled here rather than in the
      // engine.
      //
      // The real bridge is installed by a MODULE, and a module is deferred:
      // it evaluates once the document is parsed. The legacy engine below is
      // a classic inline script that runs DURING parsing, and its boot already
      // navigates — it writes the arrival state, lays the guard entry under it
      // and pushes the arrival entry on top, and it registers its back
      // listener long before that. Every one of those calls would find no
      // bridge at all.
      //
      // Deferring the engine's boot instead was the other way, and it is worse:
      // those three writes sit between the first render and the removal of the
      // startup screen, so making them wait moves what the operator SEES. The
      // calls are therefore recorded here, in order, and replayed unchanged
      // onto the real bridge the moment it exists. Nothing is interpreted and
      // nothing answers back: the verbs return nothing the engine reads, so a
      // recorded call and a live one are indistinguishable to it.
      (function () {
        var enregistrees = [];
        var enregistrer = function (verbe) {
          return function () {
            enregistrees.push([verbe, [].slice.call(arguments)]);
          };
        };
        window.__pont = {
          noter: enregistrer("noter"),
          remplacer: enregistrer("remplacer"),
          coucher: enregistrer("coucher"),
          retour: enregistrer("retour"),
          surRetour: enregistrer("surRetour"),
          // The recorder's marker: the real bridge replaces __pont entirely,
          // so this property is absent after the real bridge installs.
          psi: true,
        };
        // Called by the shell with the real bridge, once, before it renders.
        // The recorder is dropped on the way out: what follows the replay goes
        // straight to the router, and a second replay could only duplicate
        // history entries.
        window.__rejouerLePont = function (pont) {
          var attente = enregistrees;
          enregistrees = [];
          delete window.__rejouerLePont;
          for (var i = 0; i < attente.length; i++)
            pont[attente[i][0]].apply(pont, attente[i][1]);
        };
      })();
    </script>
    <script type="module" src="/src/coquille.tsx"></script>
    <!-- maquette -->
  </body>
</html>
