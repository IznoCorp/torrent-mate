<title>TorrentMate — refonte mobile (proposition)</title>

<style>
  /* THE DYING STYLESHEET, AS A NAMED LAYER. See `src/styles/theme.css`
     for the order and why it stopped being an accident. */
  @layer block2 {

  /* BLOCK 1 — PROTOTYPE HARNESS. NEVER EXTRACTED INTO THE APP.
     Phone frame, demo bars, design-note callouts, scenario switch.
     `scripts/extract-maquette-css.py` exports ONLY the selectors declared
     in
     regions.json, and none of these appear there. */


  /* DECLARED HARNESS DEVIATION
     The real bottom bar is `position: fixed` against the viewport — correct
     in the app, where the viewport IS the phone. Inside a phone frame
     embedded in a wide screen, `fixed` would pin it to the bottom of the
     WINDOW. The prototype therefore repositions it to `absolute` within the
     frame. This is the ONLY accepted divergence in the shell, and the
     parity probe carries it as a justified allowlist entry — not as a gap
     someone discovers. Same for the FAB and the selection bar. */
  .device .bottombar,
  .device .fab,
  .device .selbar {
    position: absolute;
  }
  .device .bottombar {
    inset-inline: 0;
    bottom: 0;
  }

  /* Harness buttons — outside the shell, since the shell is a MEASURED
     region and must carry nothing that does not exist in the app.
     `window.__measure(true)` clears them before any capture. */
  /* Anchored to the FRAME, not to the window, and parked in the one corner the
     app's own chrome never claims: the header spans the full width at the top,
     the tab bar spans it at the bottom, and the floating action button sits
     bottom-RIGHT. Measured, not guessed — sitting top-right put these over the
     avatar at every width, and the desktop offset that was supposed to avoid
     that missed the frame it was computed against. */
  .hbtn {
    /* Harness chrome lives in the top bar's empty middle, to the LEFT of the
       app's own status dot and avatar — never over them: R51 measures that
       overlap in every named state. Anchored to the same safe-area offset
       the bar itself uses, so the buttons ride the bar on a notched phone. */
    position: absolute;
    right: 100px;
    top: calc(env(safe-area-inset-top) + 12px);
    z-index: 70;
    display: flex;
    gap: 4px;
  }
  .hbtn button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--color-border);
    background: color-mix(in oklab, var(--color-background) 80%, transparent);
    color: var(--color-muted-foreground);
    display: grid;
    place-items: center;
    backdrop-filter: blur(4px);
  }
  .hbtn svg {
    width: 13px;
    height: 13px;
  }
  html.measuring .hbtn,
  html.measuring .toast,
  html.measuring .note {
    display: none !important;
  }

  /* DECLARED HARNESS DEVIATION — the frame forces the phone presentation.
     The app's breakpoints measure the WINDOW, which is right in the app, where
     the window IS the phone. Here a phone is drawn inside a wide page, so on a
     desktop screen those same breakpoints switch the frame's contents to the
     desktop presentation: the bottom bar vanishes from something 390px wide.

     The frame therefore re-asserts the mobile values for every property a
     desktop breakpoint changes. This lives in the harness because the app rule
     is CORRECT — a real desktop does get the rail. It must be revisited
     whenever a breakpoint is added: a rule that only holds for the breakpoints
     that existed when it was written rots quietly. */
  @media (min-width: 640px) {
    .device .ps-dot__label {
      display: none;
    }
  }

  @media (min-width: 768px) {
    .device .bottombar {
      display: flex;
    }

    .device .topbar {
      padding-left: 14px;
      padding-right: 14px;
    }
  }

  /* Phone frame */
  .stage {
    min-height: 100svh;
    display: grid;
    /* R7 — `minmax(0, 1fr)`, never `1fr`: an `auto` track's floor is the
       item's INTRINSIC size, so the horizontally-scrolling pill train inside
       the device sized the track to its max-content and blew the frame out
       to 910px at a 390px viewport. */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 0;
    overflow-x: clip;
  }
  .device {
    position: relative;
    width: 100%;
    max-width: 100%;
    height: 100svh;
    background: var(--color-background);
    display: flex;
    flex-direction: column;
    overflow: clip;
  }
  @media (min-width: 520px) {
    .stage {
      padding: 24px 16px;
    }
    .device {
      width: 390px;
      height: min(844px, calc(100svh - 48px));
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgb(0 0 0/0.5);
    }
  }

  /* BLOCK 2 — APPLICATION CSS. THIS IS THE APP'S STYLESHEET.
     Not a source something transplants: when the maquette replaces the app
     (product-intent §15), this block ships as it stands. It used to be lifted
     into `styles/ps/app-surface.css` and rescoped under `.tm` so the two
     stylesheets could coexist during a surface-by-surface migration — a model
     the operator reversed on 2026-08-13, and whose tooling was retired on
     2026-08-20. You do not translate a CSS that BECOMES the CSS.

     BLOCK 1 above is the prototype's harness — the phone frame, the demo bars,
     the design notes — and it must NOT ship. That boundary is the one thing
     the split was ever about. */

  /* THE VOCABULARY LIVES HERE, and it did not always. Every token below sat
     in BLOCK 1 — the block headed NEVER EXTRACTED INTO THE APP — while
     BLOCK 2 spent 458 `var()` calls on them. The extracted stylesheet
     therefore used thirty-five tokens and declared one, and both guards of the
     day said nothing: the drift guard was textual, and the parity probe kept
     BLOCK 1 in the document for both of its passes, so the tokens were in the
     room exactly when it looked. Both are gone with the extraction they
     served; `scripts/check-css-tokens.py` is the hold that survives, and it
     reads what BLOCK 2 can resolve ON ITS OWN — because BLOCK 1 stops shipping
     the day this becomes the app.

     THE SCALE AND THE PALETTE HAVE BOTH LEFT THIS FILE. L07 moved them to
     `src/styles/theme.css`, where they are a Tailwind `@theme static` block —
     which is what lets `bg-card` exist at all. Their `login:*` markers went
     with them, and `serve.py` reads whichever file holds each region: the gate
     is built by text search over markers, never by block. What is still down
     here is `login:style` and `login:splashstyle`, because the sign-in screen
     and the splash keep hand-written CSS until L13 (D5). */
  /* Shell — CONVERTED (L07 phase 5), and the direction of truth for it is
     INVERTED: for pages the prototype is authoritative; for the shell,
     `layout/TopBar.tsx` and `layout/BottomTabBar.tsx` are. They were rebuilt,
     measured and proven — app frame, measured heights, no iOS sticky shimmer
     — and redrawing them would reopen solved problems. Any DELIBERATE change
     to the shell is still a named exception.

     Its seventeen rules are utilities on the elements themselves, in
     `index.html`. THEY ARE NOT TYPED VARIANTS, and that is a fact about the
     markup rather than a shortcut: the shell is not a component. It lives in
     the document because the engine captures its containers at module
     evaluation, before React has rendered anything — so a variant has nothing
     to attach to until the engine dies at L13. The utilities move with the
     markup on that day; nothing here is thrown away.

     The class names stay, emptied of style: the engine selects
     `.topbar .avatar img` and its siblings by CSS class, so a name removed
     here would break a reader while the styling moved cleanly. */

  /* Scrollport — CONVERTED (L07 phase 5). Its declarations are utilities on
     the `<main>` in `index.html`, and the `port` class stays as an IDENTITY
     anchor with no style of its own: the engine selects `.port`, so removing
     the name would break a reader while the styling moved cleanly.

     The container it establishes is read nine hundred lines below by the
     gallery's three `@container port` queries. `@container/port` compiles to
     `container-type: inline-size; container-name: port` — the longhand of what
     was written here, verified by compilation before the rule was deleted. */

  /* View tabs — CONVERTED (L07 phase 9), `viewTabs()`, `segment()`,
     `segmentTab()`, `segmentCount()` and `moreButton()` in
     `src/ui/variants.ts`. The selected tab is an `aria-selected` VARIANT
     rather than a class: the attribute is already there for assistive
     technology, and a second name for the same fact is a second thing to keep
     in step. */

  /* Filter zone — CONVERTED (L07 phase 9) into typed variants in
     `src/ui/variants.ts`: the search field and its clear button, the pill
     train with its compositor-facing `touch-action`, the view switch and its
     divider (a `before:` pseudo-element), and the count line. The pill's count
     answers the pill's `aria-pressed` through a `group` variant rather than
     carrying a second name for the same fact.

     The ICONS' sizes stayed rules, in the base layer: `<Icon>` takes no class,
     so the surface that hosts an icon is the only thing that can size it. */

  /* Body, sections and pips — CONVERTED (L07 phase 6) into typed variants in
     `src/ui/variants.ts`. A class FACTORY rather than a component: wrapping
     these in React would change the DOM, and this wave's claim is that the
     rendering did not move. */

  /* The media card — NOT CONVERTED (L07 phase 8), and named rather than
     skipped. 33 of its 46 class names are the ENGINE's; it is injected as
     markup, so there is no element to carry a utility and no component to
     carry a variant. Its rules are in `src/styles/legacy.css` with their date
     of death, and §12's engraved composition is recorded there with them. */

  /* Cross-reference — CONVERTED (L07 phase 8), `crossReference()` in
     `src/ui/variants.ts`, where the reason it is a BLOCK rather than a flex row
     is kept: laid out as flex siblings each fragment became its own column and
     the sentence read as three broken stacks. */

  /* Gallery tiles — NOT CONVERTED (L07 phase 9): written by the ENGINE. In
     `src/styles/legacy.css`, with the container-query reasoning kept beside
     them. */

  /* Découvrir's deck — NOT CONVERTED (L07 phase 10): thirteen of its eighteen
     class names are the ENGINE's, and its cards are written by `fillSug` and
     driven by a pointer stream the engine owns. In `src/styles/legacy.css`,
     with the three things that must survive it recorded beside the rules. */

  /* Key/value rows — CONVERTED (L07 phase 13), `factsPanel()`, `keyValueRow()`,
     `sheetFacts()` and `sectionHeading()` in `src/ui/variants.ts`. Its two
     variants keep their reasons: a row whose DOT qualifies the STEP rather than
     the figure, and a value that has not happened yet reading as an
     announcement rather than as a measurement. `.panel` is also emitted by the
     ENGINE, so its frame is in `src/styles/legacy.css` as well. */

  /* Arrivées — CONVERTED (L07 phase 7). The live strip and the pilot's bar are
     typed variants in `src/features/arrivals/variants.ts`, where their
     reasoning is kept in full. The run's nine steps are written by the ENGINE
     and are in `src/styles/legacy.css`; the strip's pulse and its
     reduced-motion guard are in the base layer, where a keyframe belongs. */

    /* THE BROWSER'S OWN LONG PRESS, refused where ours lives.

     Held on a picture or on a run of text, a phone offers to select, copy or
     save it. That menu is not a competitor to the long press — it REPLACES it,
     because it is the platform's and no listener outruns it. What the operator
     got instead of the panel was « Copier l'image ».

     Declared on the pressable surfaces only, never on the scrollport: it must
     stay possible to select the text of a synopsis or a release name. And
     `-webkit-user-drag` is separate — a picture inside a draggable surface
     starts a native drag that swallows the pointer stream outright. */
  .poster,
  .tile,
  .dcard,
  .sheetposter {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .poster img,
  .tile img,
  .dcard img,
  .sheetposter img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  /* ── Réglages ─────────────────────────────────────────────────────────
     A settings row is a LIST ROW, not a form field: label on the left, the
     value as it stands on the right, and the control lives in the panel that
     opens on top of it. A screen of live inputs on a phone is a screen where
     every scroll risks changing something. */
  .topic {
    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    width: 100%;
    text-align: left;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-6);
    color: var(--color-foreground);
    margin-bottom: var(--spacing-4);
  }
  .topic .rt {
    display: block;
    font-size: var(--text-5);
    font-weight: 600;
  }
  .topic .rs {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-3);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }
  .topic .rn {
    flex: 0 0 auto;
    font-size: var(--text-3);
    font-weight: 600;
    color: var(--color-muted-foreground);
    font-variant-numeric: tabular-nums;
  }

  .settingrow {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--color-border);
    background: transparent;
    padding: var(--spacing-5) var(--spacing-1);
    color: var(--color-foreground);
  }
  .settingrow:last-child {
    border-bottom: 0;
  }
  .settingrow .rl {
    display: block;
    min-width: 0;
    flex: 1;
    font-size: var(--text-4);
  }
  .settingrow .rf {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .settingrow .rv {
    flex: 0 0 auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--text-3);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  /* A setting the operator has touched but not yet written. It is marked on
     the ROW, where it is read, and not only in a counter at the bottom. */
  .settingrow.modified .rv {
    color: var(--color-primary);
  }
  .settingrow.modified::before {
    content: "";
    width: 3px;
    align-self: stretch;
    border-radius: var(--radius-full);
    background: var(--color-primary);
    margin-right: calc(var(--spacing-2) * -1);
  }

  /* The save bar exists only when there is something to save, and it says
     WHAT it will write — a save that names no file asks for trust nobody
     owes it. It sits above the tab bar, like every other fixed thing. */
  /* A FIELD, inside the panel. The panel is the one place an action lives
     (R56), so editing a setting does not get a screen of its own. */
  .field {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    margin-top: var(--spacing-5);
  }
  .field.list {
    flex-direction: column;
    align-items: stretch;
    gap: var(--spacing-3);
  }
  .fieldinput {
    flex: 1;
    min-width: 0;
    padding: var(--spacing-5) var(--spacing-6);
    border-radius: var(--radius-3);
    border: 1px solid var(--color-border);
    background: var(--color-background);
    color: var(--color-foreground);
    font: inherit;
    font-size: var(--text-6);
  }
  .fieldinput.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-6);
  }
  .fieldinput:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 1px;
  }
  .fieldunit {
    flex: 0 0 auto;
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }
  .fieldlabel {
    font-size: var(--text-4);
    color: var(--color-muted-foreground);
  }
  /* The switch is the whole field: nothing to type, nothing to validate. */
  .fieldtoggle {
    flex: 0 0 auto;
    width: 48px;
    height: 28px;
    padding: var(--spacing-1);
    border: 0;
    border-radius: var(--radius-full);
    background: var(--color-muted);
    display: flex;
    transition: background var(--duration-2) var(--ease-standard);
  }
  .fieldtoggle.active {
    background: var(--color-primary);
    justify-content: flex-end;
  }
  .fieldknob {
    width: 22px;
    height: 22px;
    border-radius: var(--radius-full);
    background: var(--color-white);
    transition: transform var(--duration-2) var(--ease-standard);
  }
  .litem {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    padding: var(--spacing-4) var(--spacing-6);
    border-radius: var(--radius-3);
    border: 1px solid var(--color-border);
    background: var(--color-background);
    font-size: var(--text-4);
  }
  .litem span {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lremove {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--color-muted-foreground);
    padding: var(--spacing-1);
    display: flex;
  }
  .lremove svg {
    width: 15px;
    height: 15px;
  }
  .ladd {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-3);
    padding: var(--spacing-5);
    border-radius: var(--radius-3);
    border: 1px dashed var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    font-weight: 600;
  }
  .ladd svg {
    width: 15px;
    height: 15px;
  }
  .field.readonly .rulenote {
    margin: 0;
  }
  .savebar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--tm-bottom-bar-h, 0px);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    padding: var(--spacing-5) var(--spacing-7);
    border-top: 1px solid var(--color-border);
    background: var(--color-background);
  }
  .savebar[hidden] {
    display: none;
  }
  .savebar .sn {
    flex: 1;
    min-width: 0;
    font-size: var(--text-3);
    line-height: 1.35;
    color: var(--color-muted-foreground);
  }
  .savebar .sn b {
    display: block;
    color: var(--color-foreground);
    font-size: var(--text-4);
  }
  .savebar button {
    flex: 0 0 auto;
    border: 0;
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-7);
    font:
      600 var(--text-4) "Geist",
      system-ui,
      sans-serif;
    background: var(--color-primary);
    color: var(--color-primary-foreground);
  }
  .savebar button:disabled {
    opacity: 0.5;
  }

  /* Pull to refresh — CONVERTED (L07 phase 5). `.ptr` and its spinner are
     utilities in `index.html`; the two ENGINE-TOGGLED states (`armed`,
     `loading`) are in `src/styles/legacy.css`, and `@keyframes spin` is in the
     base layer, where a name the document defines once belongs. */

  /* FAB — CONVERTED (L07 phase 5), utilities in `index.html`. The R8 group it
     used to carry — an author `display` rule BEATS the `[hidden]` attribute —
     is in `base.css` and deliberately UNLAYERED: inside `@layer base` it lost
     to Tailwind's `grid` utility and the button reappeared on every page that
     hides it. An override that must win against a utility cannot live below
     one. */

  /* Bottom bar — CONVERTED (L07 phase 5). The `<nav>`'s own rule is utilities
     in `index.html`, including the desktop `md:hidden`; its tabs are written by
     the ENGINE, so those rules are in `src/styles/legacy.css`. */

  /* Screens — CONVERTED (L07 phase 6), `screen()`, `screenBar()` and
     `backControl()` in `src/ui/variants.ts`. `.screen.open` is engine-toggled
     and lives in the residue; `.screen .port` is a CONTEXTUAL override — the
     scrollport cannot know it is inside a screen — and is in the base layer. */

  /* Bottom sheet */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--color-scrim);
    z-index: 46;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--duration-2) var(--ease-standard);
  }
  .scrim.open {
    opacity: 1;
    visibility: visible;
  }
  /* The tab bar sits ABOVE the layers (z-50), so a sheet must reserve its
     height, otherwise its last actions are unreachable — internal scrolling
     stops before them. Same rule as for screens, extended to sheets and
     dialogs: one defect family deserves one rule, not three. */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 47;
    background: var(--color-popover);
    border-top: 1px solid var(--color-border);
    border-radius: var(--radius-4) var(--radius-4) 0 0;
    max-height: 78%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform var(--duration-3) var(--ease-standard);
    visibility: hidden;
  }
  .sheet.open {
    transform: none;
    visibility: visible;
  }
  .sheet.dragging {
    transition: none;
  }
  .sheetgrab {
    height: 22px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    touch-action: none;
    cursor: grab;
  }
  .sheetgrab::before {
    content: "";
    width: 36px;
    height: 4px;
    border-radius: var(--radius-full);
    background: var(--color-border);
  }
  .sheetin {
    overflow-y: auto;
    padding: var(--spacing-1) var(--spacing-7) calc(var(--tm-bottom-bar-h, 0px) + var(--spacing-8));
  }
  .sheettitle {
    font-size: var(--text-6);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 var(--spacing-1);
  }
  .sheetmeta {
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
    margin-bottom: var(--spacing-7);
  }
  .sheethead {
    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    padding-bottom: var(--spacing-2);
  }

  /* A head carrying a POSTER aligns to the top: an 84px picture next to two
     short lines centred against it leaves the title floating in the middle of
     nothing. It also breathes below rather than inside: an 84px picture makes
     the same 4px read as nothing at all. */
  .sheethead.withposter {
    align-items: flex-start;
    padding-bottom: 0;
    margin-bottom: var(--spacing-6);
  }

  .sheetid {
    min-width: 0;
    flex: 1;
  }

  .sheethead .sheetmeta {
    margin-bottom: var(--spacing-3);
  }

  .sheethead .sheetsub {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }

  .avatar.big {
    width: 42px;
    height: 42px;
    font-size: var(--text-6);
  }

  /* An entry that is coming says so instead of being absent: a menu that grows
     an item later teaches its shape twice. */
  .soon {
    margin-left: auto;
    font-size: var(--text-1);
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: var(--spacing-1) var(--spacing-3);
    border-radius: var(--radius-full);
    background: var(--color-muted);
    color: var(--color-muted-foreground);
  }

  .sheetacts {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
    margin: var(--spacing-2) 0 var(--spacing-7);
  }
  .sheetacts.secondary {
    margin-top: var(--spacing-8);
    padding-top: var(--spacing-7);
    border-top: 1px solid var(--color-border);
  }
  .sact {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-4);
    font-weight: 500;

  /* login:splashstyle:start */
  /* Startup — the wait between signing in and an interface being there.

     This document is large, and a phone spends seconds fetching and parsing it
     before a single pixel of the interface exists. A wait shown blank is read
     as a failure, so the screen holds the brand still and says what is
     happening. It is the FIRST thing the document paints, which is why it sits
     at the top of the frame in source order: an element declared after
     megabytes of embedded artwork would appear only once the wait is over.

     The bar is deliberately indeterminate. Nothing here knows how far along
     the load is, and a bar that pretends to would be lying at every frame. */
  .splash {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-8);

    background: var(--color-background);

     set and nothing happens. */
  .splash[hidden] {
    display: none;
  }

    width: 132px;
    height: 3px;
    border-radius: var(--radius-full);
    background: var(--color-border);
    overflow: hidden;
  }

  /* The bar FILLS, from nothing to full, over the five seconds a cold load is
     budgeted. It is not a measurement of the load — nothing here knows how far
     along that is — it is a measurement of the WAIT, which is what the person
     watching is actually living through. A bar that fills answers « how much
     longer », where a shuttle that slides back and forth answers nothing and
     reads the same at one second and at ten.

     It never reaches the end on its own: the interface arrives first and takes
     the screen away. Should the load outlast the budget, the bar stops full
     and the message below is what keeps speaking. */
  .splashbar i {
    display: block;
    width: 0%;
    height: 100%;
    border-radius: var(--radius-full);
    background: var(--color-primary);
    animation: splashremplit var(--duration-loop-3) linear forwards;

      width: 100%;
    }
