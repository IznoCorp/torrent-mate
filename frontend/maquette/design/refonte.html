<title>TorrentMate — refonte mobile (proposition)</title>

<style>
  /* BLOCK 1 — PROTOTYPE HARNESS. NEVER EXTRACTED INTO THE APP.
     Phone frame, demo bars, design-note callouts, scenario switch.
     `scripts/extract-maquette-css.py` exports ONLY the selectors declared
     in
     regions.json, and none of these appear there. */


  /* DECLARED HARNESS DEVIATION
     The real bottom bar is `position: fixed` against the viewport — correct
     in the app, where the viewport IS the phone. Inside a phone frame
     embedded in a wide screen, `fixed` would pin it to the bottom of the
     WINDOW. The prototype therefore repositions it to `absolute` within the
     frame. This is the ONLY accepted divergence in the shell, and the
     parity probe carries it as a justified allowlist entry — not as a gap
     someone discovers. Same for the FAB and the selection bar. */
  .device .bottombar,
  .device .fab,
  .device .selbar {
    position: absolute;
  }
  .device .bottombar {
    inset-inline: 0;
    bottom: 0;
  }

  /* Harness buttons — outside the shell, since the shell is a MEASURED
     region and must carry nothing that does not exist in the app.
     `window.__measure(true)` clears them before any capture. */
  /* Anchored to the FRAME, not to the window, and parked in the one corner the
     app's own chrome never claims: the header spans the full width at the top,
     the tab bar spans it at the bottom, and the floating action button sits
     bottom-RIGHT. Measured, not guessed — sitting top-right put these over the
     avatar at every width, and the desktop offset that was supposed to avoid
     that missed the frame it was computed against. */
  .hbtn {
    /* Harness chrome lives in the top bar's empty middle, to the LEFT of the
       app's own status dot and avatar — never over them: R51 measures that
       overlap in every named state. Anchored to the same safe-area offset
       the bar itself uses, so the buttons ride the bar on a notched phone. */
    position: absolute;
    right: 100px;
    top: calc(env(safe-area-inset-top) + 12px);
    z-index: 70;
    display: flex;
    gap: 4px;
  }
  .hbtn button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--color-border);
    background: color-mix(in oklab, var(--color-background) 80%, transparent);
    color: var(--color-muted-foreground);
    display: grid;
    place-items: center;
    backdrop-filter: blur(4px);
  }
  .hbtn svg {
    width: 13px;
    height: 13px;
  }
  html.measuring .hbtn,
  html.measuring .toast,
  html.measuring .note {
    display: none !important;
  }

  /* DECLARED HARNESS DEVIATION — the frame forces the phone presentation.
     The app's breakpoints measure the WINDOW, which is right in the app, where
     the window IS the phone. Here a phone is drawn inside a wide page, so on a
     desktop screen those same breakpoints switch the frame's contents to the
     desktop presentation: the bottom bar vanishes from something 390px wide.

     The frame therefore re-asserts the mobile values for every property a
     desktop breakpoint changes. This lives in the harness because the app rule
     is CORRECT — a real desktop does get the rail. It must be revisited
     whenever a breakpoint is added: a rule that only holds for the breakpoints
     that existed when it was written rots quietly. */
  @media (min-width: 640px) {
    .device .ps-dot__label {
      display: none;
    }
  }

  @media (min-width: 768px) {
    .device .bottombar {
      display: flex;
    }

    .device .topbar {
      padding-left: 14px;
      padding-right: 14px;
    }
  }

  /* Phone frame */
  .stage {
    min-height: 100svh;
    display: grid;
    /* R7 — `minmax(0, 1fr)`, never `1fr`: an `auto` track's floor is the
       item's INTRINSIC size, so the horizontally-scrolling pill train inside
       the device sized the track to its max-content and blew the frame out
       to 910px at a 390px viewport. */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 0;
    overflow-x: clip;
  }
  .device {
    position: relative;
    width: 100%;
    max-width: 100%;
    height: 100svh;
    background: var(--color-background);
    display: flex;
    flex-direction: column;
    overflow: clip;
  }
  @media (min-width: 520px) {
    .stage {
      padding: 24px 16px;
    }
    .device {
      width: 390px;
      height: min(844px, calc(100svh - 48px));
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgb(0 0 0/0.5);
    }
  }

  /* BLOCK 2 — APPLICATION CSS. THIS IS THE APP'S STYLESHEET.
     Not a source something transplants: when the maquette replaces the app
     (product-intent §15), this block ships as it stands. It used to be lifted
     into `styles/ps/app-surface.css` and rescoped under `.tm` so the two
     stylesheets could coexist during a surface-by-surface migration — a model
     the operator reversed on 2026-08-13, and whose tooling was retired on
     2026-08-20. You do not translate a CSS that BECOMES the CSS.

     BLOCK 1 above is the prototype's harness — the phone frame, the demo bars,
     the design notes — and it must NOT ship. That boundary is the one thing
     the split was ever about. */

  /* THE VOCABULARY LIVES HERE, and it did not always. Every token below sat
     in BLOCK 1 — the block headed NEVER EXTRACTED INTO THE APP — while
     BLOCK 2 spent 458 `var()` calls on them. The extracted stylesheet
     therefore used thirty-five tokens and declared one, and both guards of the
     day said nothing: the drift guard was textual, and the parity probe kept
     BLOCK 1 in the document for both of its passes, so the tokens were in the
     room exactly when it looked. Both are gone with the extraction they
     served; `scripts/check-css-tokens.py` is the hold that survives, and it
     reads what BLOCK 2 can resolve ON ITS OWN — because BLOCK 1 stops shipping
     the day this becomes the app.

     THE SCALE AND THE PALETTE HAVE BOTH LEFT THIS FILE. L07 moved them to
     `src/styles/theme.css`, where they are a Tailwind `@theme static` block —
     which is what lets `bg-card` exist at all. Their `login:*` markers went
     with them, and `serve.py` reads whichever file holds each region: the gate
     is built by text search over markers, never by block. What is still down
     here is `login:style` and `login:splashstyle`, because the sign-in screen
     and the splash keep hand-written CSS until L13 (D5). */
  /* Shell — CONVERTED (L07 phase 5), and the direction of truth for it is
     INVERTED: for pages the prototype is authoritative; for the shell,
     `layout/TopBar.tsx` and `layout/BottomTabBar.tsx` are. They were rebuilt,
     measured and proven — app frame, measured heights, no iOS sticky shimmer
     — and redrawing them would reopen solved problems. Any DELIBERATE change
     to the shell is still a named exception.

     Its seventeen rules are utilities on the elements themselves, in
     `index.html`. THEY ARE NOT TYPED VARIANTS, and that is a fact about the
     markup rather than a shortcut: the shell is not a component. It lives in
     the document because the engine captures its containers at module
     evaluation, before React has rendered anything — so a variant has nothing
     to attach to until the engine dies at L13. The utilities move with the
     markup on that day; nothing here is thrown away.

     The class names stay, emptied of style: the engine selects
     `.topbar .avatar img` and its siblings by CSS class, so a name removed
     here would break a reader while the styling moved cleanly. */

  /* Scrollport — CONVERTED (L07 phase 5). Its declarations are utilities on
     the `<main>` in `index.html`, and the `port` class stays as an IDENTITY
     anchor with no style of its own: the engine selects `.port`, so removing
     the name would break a reader while the styling moved cleanly.

     The container it establishes is read nine hundred lines below by the
     gallery's three `@container port` queries. `@container/port` compiles to
     `container-type: inline-size; container-name: port` — the longhand of what
     was written here, verified by compilation before the rule was deleted. */

  /* Card */
  /* A mouse drag would otherwise select the text it passes over, and the
     selection then swallows the gesture. */
  .swipe,
  .sugwrap,
  .deck {
    user-select: none;
    -webkit-user-select: none;
  }

  /* And it would drag the IMAGE: dragging a picture is a browser default, and
     it swallows the pointer stream outright — the gesture receives a couple of
     moves and never an up. Invisible to a touch test, fatal to a mouse one. */
  .swipe img,
  .sugwrap img,
  .deck img,
  .tile img {
    -webkit-user-drag: none;
    user-drag: none;
  }

  .swipe {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-3);
    /* The row CLAIMS the horizontal axis. Without this the browser owns both

  /* EXACT anatomy of the shipped MediaPoster: cover image when one exists,
     otherwise TWO initials in mono over an accent/50 → card → muted
     gradient, with an icon watermark at 5% bottom-right. A single initial
     on a flat fill is an approximation, not a variant. */
  /* THE POSTER FILLS THE CARD THAT ASKS YOU TO RECOGNISE A MEDIUM.

     Derived, and the derivation is the anatomy of the card rather than a
     percentile. Grouping the 135 cards the interface draws by which blocks
     they carry gives eight shapes, and each has a content height of its own:

         title + sub                        35.7  →  24px
         title + facts                      41.5  →  28px
         title + sub + facts                60.7  →  40px
         title + sub + SYNOPSIS             72.9  →  49px
         title + sub + reason               87.0  →  58px
         title + sub + reason + facts       95.1  →  63px

     The poster is 2/3 of the usable height (the 2:3 ratio never moves), and
     usable means the card minus 9px of padding and 1px of border a side.

     It used to fill the MEDIAN card — 60.7, hence 42px — and that reference had
     run out: the poster had become what set the median, so re-running the
     computation returned its own answer.

     Then it filled the card carrying a SYNOPSIS: 49px. That was still the wrong
     question. The derivation was pinned to the TEXT beside the poster, so the
     poster could never grow past it — while the constraint it was respecting,
     card height, had been explicitly lifted. A card may be taller. 49px read as
     unchanged on a phone, and it was: seven pixels.

     The reference is the card that EXPLAINS — title, sub-line, reason — which is
     58px. It is a shape the interface really draws, it is +38% over the original
     42, and it stops short of the fullest card's 63px, which is the +50% already
     judged too much. Where a card's own text is shorter than that, the CARD
     grows: `.ctop` takes the poster as its floor. Nothing in between these
     notches is derived from anything, and a number nobody derived is a number
     nobody can defend. */

  .folder {
    width: 58px;
    align-self: start;
    justify-self: start;
    margin: var(--spacing-4) 0 var(--spacing-4) var(--spacing-4);
    aspect-ratio: 2 / 3;

    place-content: center;
    gap: var(--spacing-2);

    color: var(--color-muted-foreground);
    padding: 0;
  }
  .folder svg {

    height: 22px;
    margin: 0 auto;
  }

  }
  .poster {

    overflow: hidden;

    padding: 0;
    border: 0;

    height: 100%;

  }

     it through the poster's ratio. In flow, a 240px-wide picture made a 240px
     column and the card followed it. */
  .poster > img,
  .poster > .pfall {

    inset: 0;

  .ctitle {

    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* The reason NEVER truncates (§12): it is what the operator decides on, and
     half a sentence is not a reason. It wraps instead, and the card grows.
     A two-line clamp lived here and cut « Aucune donnée d'épisode chez TVDB ni
     chez TMDB pour… » exactly where the useful half began. */
  .creason {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-2);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }
  /* A synopsis is not a reason: a reason must never truncate, because the card
     is justifying itself and half a justification is worse than none (R48). A
     synopsis is background, and clamping it keeps the list scannable — which is
     why the two are separate facts rather than one field used both ways. */
  .cov {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    text-overflow: ellipsis;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: var(--spacing-2);
    font-size: var(--text-2);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }
  .cmeta {
    margin-top: var(--spacing-3);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-2);
  }

  /* The annotations sit under the state, not beside it. */
  .cannotations {
    margin-top: var(--spacing-2);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-2);
  }
  .frac {
    font-size: var(--text-2);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  /* EXACT anatomy of the shipped Chip component: 11px semibold, pill
     radius, a 6px dot in the tone colour, background tinted at 20%. A chip
     without its dot, or at another size, is drift — not a variant. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
    white-space: nowrap;
    border-radius: var(--radius-full);
    padding: var(--spacing-1) var(--spacing-3);
    font-size: var(--text-2);
    font-weight: 600;
    line-height: 15px;
    background: var(--color-muted);
    color: var(--color-muted-foreground);
  }
  .chip::before {
    content: "";
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: var(--radius-full);
    background: currentColor;
  }
  .chip.warning {
    background: color-mix(in oklab, var(--color-warning) 20%, transparent);
    color: var(--color-warning-text);
  }
  .chip.success {
    background: color-mix(in oklab, var(--color-success) 20%, transparent);
    color: var(--color-success-text);
  }
  .chip.danger {
    background: color-mix(in oklab, var(--color-danger) 20%, transparent);
    color: var(--color-danger-text);
  }
  .chip.info {
    background: color-mix(in oklab, var(--color-info) 20%, transparent);
    color: var(--color-info-text);
  }
  .chip.waiting {
    background: color-mix(in oklab, var(--color-waiting) 20%, transparent);
    color: var(--color-waiting);
  }
  .caption {
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
  }
  .freshtag {
    flex: 0 0 auto;
    font-size: var(--text-1);
    font-weight: 700;
    padding: var(--spacing-1) var(--spacing-4);
    border-radius: var(--radius-full);
    color: var(--color-primary-foreground);
    background: var(--color-primary);
    white-space: nowrap;
  }
  .cadence {
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    padding: var(--spacing-4) var(--spacing-7) 0;
  }
  /* A rating reads over the picture without claiming a place in the status
     palette, so it gets a neutral scrim rather than a semantic colour. */
  :root {
    --tile-overlay: var(--color-tile-overlay);
  }

  .tilebadge {
    position: absolute;
    top: 5px;
    right: 5px;
    display: grid;
    place-items: center;
    height: 17px;
    min-width: 17px;
    padding: 0 var(--spacing-2);
    border-radius: var(--radius-full);
    border: 2px solid var(--color-background);
    font-size: var(--text-1);
    font-weight: 700;
    color: var(--color-white);
  }

  /* journey strip — its own full-width line (R2) */
  .strip {
    margin-top: var(--spacing-4);
    padding-top: var(--spacing-4);
    border-top: 1px solid var(--color-border);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0;
  }
  .st {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-2);
    position: relative;
    min-width: 0;
  }
  .st .d {
    width: 9px;
    height: 9px;
    border-radius: var(--radius-full);
    background: var(--color-border);
    z-index: 1;
  }
  .st.done .d {
    background: var(--color-success);
  }
  .st.now .d {
    background: var(--color-primary);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--color-primary) 25%, transparent);
  }
  .st.blocked .d {
    background: var(--color-danger);
  }
  .st .l {
    font-size: var(--text-1);
    color: var(--color-muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .st::before {
    content: "";
    position: absolute;
    top: 4px;
    left: -50%;
    width: 100%;
    height: 1px;
    background: var(--color-border);
  }
  .st:first-child::before {
    display: none;
  }
  .st.done::before,
  .st.now::before {
    background: var(--color-success);
  }
  .cfoot {
    margin-top: var(--spacing-4);
    width: 100%;
    border: 1px solid var(--color-primary);
    background: transparent;
    color: var(--color-primary);
    font-size: var(--text-3);
    font-weight: 600;
    padding: var(--spacing-4);
    border-radius: var(--radius-2);
  }
  .cfoot.solid {
    background: var(--color-primary);
    color: var(--color-primary-foreground);
  }
  /* An action already carried out stays readable, and stays in place: it is
     the receipt for the tap, not a button that vanished. */
  .cfoot.done {
    border-color: var(--color-border);
    color: var(--color-muted-foreground);
    opacity: 0.7;
  }
  /* The action is still offered, but it will REPLACE something already owned —
     the tone says so before the dialog does. */
  .cfoot.owned {
    border-color: var(--color-warning);
    color: var(--color-warning);
  }

  /* Crossref */
  /* A wrapping sentence must not be laid out as flex siblings: each fragment
     became its own column and the line read as three broken stacks. It is one
     paragraph, with the link on its own row. */
  .crossref {
    display: block;
    width: 100%;
    line-height: 1.45;
    border: 1px dashed var(--color-border);
    background: transparent;
    color: var(--color-muted-foreground);
    font-size: var(--text-3);
    text-align: left;
    padding: var(--spacing-5) var(--spacing-5);
    border-radius: var(--radius-3);
  }
  .crossref b {
    color: var(--color-foreground);
    font-weight: 600;
  }
  .crossref span {
    display: block;
    margin-top: var(--spacing-3);
    color: var(--color-primary);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Grid tiles */
  /* ONE gallery grid, and its column count follows the width available to it
     — the scrollport — never the window's. A media query reads the viewport,
     so a 390px frame sitting on a 1280px desktop would be told it has room for
     six columns it does not have. A container query asks the right question,
     and the app gets the same answer because there its scrollport IS the
     window. */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--spacing-5);
  }

  @container port (min-width: 460px) {
    .grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  @container port (min-width: 620px) {
    .grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
  }

  @container port (min-width: 820px) {
    .grid {
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }
  }
  .tile {
    position: relative;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    display: block;
    width: 100%;
  }
  .tile .p {
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: var(--radius-2);
    font-size: var(--text-8);
    line-height: 1;
    overflow: hidden;
    background: var(--color-muted);
  }
  .tile .nm {
    display: block;
    font-size: var(--text-2);
    margin-top: var(--spacing-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .fr {
    display: block;
    font-size: var(--text-1);
    color: var(--color-muted-foreground);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile.off .p {
    opacity: 0.42;
  }
  .tile.off .nm {
    opacity: 0.55;
  }

  /* Suggestion card (Découvrir) */
  /* R5 — a class placed on a <span> DECLARES its display. Without it the
     title shared its line with the year, the type and the rating: a literal
     breach of the rule that line 1 is the title, alone. */
  .creason b,
  .dcard .why b {
    color: var(--color-foreground);
    font-weight: 600;
  }

  /* Découvrir card: a swipe either way means not interested */
  .sugwrap {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-3);
    touch-action: pan-y;
  }
  .sugwrap.gone {
    transition:
      height var(--duration-3) var(--ease-standard),
      opacity var(--duration-2) var(--ease-standard),
      margin var(--duration-3) var(--ease-standard);
    height: 0 !important;
    opacity: 0;
    margin-bottom: calc(var(--spacing-7) * -1);
  }
  /* Poster format: the poster carries the identity, the two lines under it
     carry just enough to tell two homonyms apart. Same two tap targets as the
     list — poster to the sheet, body to the bottom panel. */
  /* The id rule on the container beats a bare class, so the grid declares
     itself on both — the same specificity family as R8: an author rule wins
     over what you meant to say. */

  /* Deck format: one card at a time, the next ones stacked behind it. The card
     fills the surface, so the body must take the scrollport's height rather
     than its own content's. The scrollport becomes a column only when it holds
     a deck — every other surface keeps its ordinary block flow. */

  /* The deck's height is MEASURED from the scrollport rather than derived from
     a chain of ancestors: the scrollport holds siblings the deck knows nothing
     about, and a universal child selector reached them. Nothing here positions
     itself by a distance to an edge — the height comes from what was measured,
     which is the same rule the bars follow. */
  .body.deckbody {
    padding-bottom: var(--spacing-5);
  }

  .deck {
    position: relative;
    /* No `flex: 1` here: in a column flex container that sets a 0 basis on the
       vertical axis, which silently overrides the measured height. */
    flex: 0 0 auto;
    min-height: 340px;
    touch-action: pan-y;
  }

  .dcard {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-4);
    background: var(--color-card);
    overflow: hidden;
    box-shadow: var(--mq-shadow-pop);
    transform-origin: 50% 100%;
    /* Slightly different curves on the two properties: the card settles into
       place a touch after it has finished fading, which is what reads as
       « natural » rather than mechanical. The tiny overshoot on transform is
       what makes a card look picked up rather than snapped. */
    transition:
      transform var(--duration-4) var(--ease-emphasized),
      opacity var(--duration-3) var(--ease-standard);
    will-change: transform;
  }

  /* The cards behind are the deck: they say « there is more » without
     costing a pixel of the card being read. */
  .dcard[data-depth="1"] {
    transform: translateY(9px) scale(0.955);
    opacity: 0.75;
  }

  .dcard[data-depth="2"] {
    transform: translateY(18px) scale(0.91);
    opacity: 0.45;
  }

  /* Entry position of a card joining the back of the pile: it rises from
     under the deck instead of appearing. */
  .dcard[data-depth="3"] {
    transform: translateY(30px) scale(0.86);
    opacity: 0;
  }

  .dcard.dragging {
    transition: none;
  }

  .dcard.out {
    opacity: 0;
  }

  .dcard .p {
    flex: 1;
    min-height: 0;
    display: block;
    width: 100%;
    border: 0;
    padding: 0;
    background: var(--color-muted);
    position: relative;
    font-size: var(--text-display);
    line-height: 1;
  }

  .dcard .p img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* The title sits on the poster's foot, on a gradient that closes on a
     solid colour — same precaution as the media sheet's header. */
  .dcard .cap {
    position: absolute;
    inset: auto 0 0;
    /* The floating « + » lives at the bottom-right of the surface: the caption
       reserves its footprint rather than running underneath it. */
    padding: 40px 76px 12px 14px;
    background: linear-gradient(
      to bottom,
      transparent,
      color-mix(in oklab, var(--color-card) 72%, transparent) 46%,
      var(--color-card)
    );
    text-align: left;
  }

  .dcard .t {
    display: block;
    font-size: var(--text-7);
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .dcard .m {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }

  .dcard .why {
    display: block;
    margin-top: var(--spacing-3);
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    border-left: 2px solid var(--color-border);
    padding-left: var(--spacing-4);
    line-height: 1.4;
  }

  /* Swipe feedback: the verb appears under the thumb, on the side the card is
     going. The two directions do NOT mean the same thing — left « Passer »
     decides nothing and the card comes round again, right « Pas intéressé »
     removes it with an undo. The verbs are the ones the other formats use. */
  .dhint {
    position: absolute;
    top: 14px;
    padding: var(--spacing-2) var(--spacing-5);
    border-radius: var(--radius-full);
    border: 2px solid var(--color-danger);
    color: var(--color-danger);
    background: color-mix(in oklab, var(--color-danger) 14%, var(--color-card));
    font-size: var(--text-3);
    font-weight: 800;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: opacity var(--duration-1) var(--ease-standard);
    pointer-events: none;
  }

  /* « Passer » decides nothing, so it does not wear the colour of a refusal. */
  .dhint.l {
    left: 14px;
    transform: rotate(-9deg);
    border-color: var(--color-muted-foreground);
    color: var(--color-muted-foreground);
    background: color-mix(in oklab, var(--color-muted-foreground) 12%, var(--color-card));
  }

  .dhint.r {
    right: 14px;
    transform: rotate(9deg);
  }

  .sugback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--spacing-8);
    border-radius: var(--radius-3);
    background: var(--color-muted);
    color: var(--color-muted-foreground);
    font-size: var(--text-3);
    font-weight: 700;
  }
  .sugback span {
    display: flex;
    align-items: center;
    gap: var(--spacing-3);
  }
  .sugback svg {
    width: 16px;
    height: 16px;
  }
  .crating {
    font-size: var(--text-1);
    font-weight: 700;
    padding: var(--spacing-1) var(--spacing-3);
    border-radius: var(--radius-full);
    border: 1px solid color-mix(in oklab, var(--color-success) 40%, transparent);
    color: var(--color-success);
    margin-left: var(--spacing-3);
  }

  /* Key/value rows (Système) */
  .panel {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-1) var(--spacing-5);
  }
  .kv {
    display: flex;
    justify-content: space-between;
    gap: var(--spacing-6);
    padding: var(--spacing-4) 0;
    border-bottom: 1px solid var(--color-border);
    font-size: var(--text-3);
  }
  .kv:last-child {
    border-bottom: 0;
  }
  .kv span:first-child {
    color: var(--color-muted-foreground);
  }
  .kv span:last-child {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: var(--spacing-3);
  }
  /* A row whose dot qualifies the STEP rather than the figure. The two are
     different statements and both exist, so the descriptor names which.

     The child combinator is not decoration: `.kv span:first-child` also matches
     the dot itself, which is the first child of the caption. */
  .kv.withpip > span:first-child {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
  }
  /* A value that has not happened yet is not a value: it reads as an
     announcement, not as a measurement. */
  .kv.upcoming > span:last-child {
    font-weight: 400;
    color: var(--color-muted-foreground);
  }
  /* A block of facts inside a panel keeps its distance from what follows. */
  .sheetfacts {
    margin-bottom: var(--spacing-7);
  }
  .h2 {
    font-size: var(--text-3);
    font-weight: 700;
    margin: 0;
  }

  /* Live strip */
  .live {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    padding: var(--spacing-4) var(--spacing-5);
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    background: var(--color-card);
  }
  .live .d {
    width: 7px;
    height: 7px;
    border-radius: var(--radius-full);
    background: var(--color-info);
    flex: 0 0 auto;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live .d {
      animation: pulse var(--duration-loop-2) var(--ease-standard) infinite;
    }
  }
  @keyframes pulse {
    50% {
      opacity: 0.3;
    }
  }
  .live b {
    color: var(--color-foreground);
    font-weight: 600;
  }

  /* The pilot's bar — the pipeline's state and the one control it takes.

     It sits where the pipeline is OBSERVED (DOIT-3): the stalled step and the
     button to run it again are one glance apart, so nothing sends the operator
     to another page to act on what they are reading. */
  .pipeline {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    background: var(--color-card);
    padding: var(--spacing-6);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-5);
  }
  .pipeline .ph {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    min-width: 0;
  }
  .pipeline .pt {
    font-size: var(--text-4);
    font-weight: 600;
  }
  .pipeline .pq {
    /* min-width: 0 with the ellipsis, so a long qualifier shortens instead of
       widening the row past the frame. */
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
  }
  .pipeline .gauge {
    height: 4px;
    border-radius: var(--radius-full);
    background: var(--color-border);
    overflow: hidden;
  }
  .pipeline .gauge i {
    display: block;
    height: 100%;
    background: var(--color-info);
    border-radius: inherit;
  }
  .pipeline .pacts {
    display: grid;
    /* minmax(0, 1fr), never 1fr: an auto track's floor is its item's intrinsic
       size, so the longer label would size its column to max-content (R7). */
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--spacing-4);
  }

  /* The last run, told as its nine steps.

     A step that did nothing says so with an em dash, never with « 0 ». Zero is
     a measurement; nothing to do is a state, and nine zeroes printed for a calm
     run turn a healthy pipeline into a wall of failures. */
  .flux {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    background: var(--color-card);
    overflow: hidden;
  }
  .flux .fw {
    display: grid;
    /* minmax(0, …) on both: an untruncated engine name would otherwise size
       its track to max-content and push the row past a 390px frame (R7). */
    grid-template-columns: minmax(0, 1fr) minmax(0, auto);
    align-items: baseline;
    gap: var(--spacing-1) var(--spacing-5);
    padding: var(--spacing-4) var(--spacing-5);
    width: 100%;
    text-align: left;
    /* A row that leads somewhere is a real button and inherits nothing from
       the browser's own: no border, no background, the document's type. */
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
  }
  .flux .fx.fclick .fw {
    /* The whole row answers a thumb, so it carries the 44px floor a target
       needs rather than leaving it to whatever the text happens to measure. */
    min-height: 44px;
    cursor: pointer;
  }
  .flux .fx + .fx {
    border-top: 1px solid var(--color-border);
  }
  .flux .fn {
    font-size: var(--text-3);
    font-weight: 600;
  }
  .flux .fr {
    font-size: var(--text-3);
    text-align: right;
    color: var(--color-muted-foreground);
  }
  .flux .fx.fempty .fn {
    color: var(--color-muted-foreground);
    font-weight: 500;
  }
  .flux .fx.fblocked .fr {
    color: var(--color-danger);
    font-weight: 600;
  }
  .flux .fs {
    grid-column: 1 / -1;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    /* A reason never truncates (§12, R48): it wraps and the row grows. */
    overflow-wrap: anywhere;
  }
  .flux .fk {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-1);
    color: var(--color-muted-foreground);
  }

  /* THE BROWSER'S OWN LONG PRESS, refused where ours lives.

     Held on a picture or on a run of text, a phone offers to select, copy or
     save it. That menu is not a competitor to the long press — it REPLACES it,
     because it is the platform's and no listener outruns it. What the operator
     got instead of the panel was « Copier l'image ».

     Declared on the pressable surfaces only, never on the scrollport: it must
     stay possible to select the text of a synopsis or a release name. And
     `-webkit-user-drag` is separate — a picture inside a draggable surface
     starts a native drag that swallows the pointer stream outright. */
  .poster,
  .tile,
  .dcard,
  .sheetposter {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .poster img,
  .tile img,
  .dcard img,
  .sheetposter img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  /* ── Réglages ─────────────────────────────────────────────────────────
     A settings row is a LIST ROW, not a form field: label on the left, the
     value as it stands on the right, and the control lives in the panel that
     opens on top of it. A screen of live inputs on a phone is a screen where
     every scroll risks changing something. */
  .topic {
    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    width: 100%;
    text-align: left;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-6);
    color: var(--color-foreground);
    margin-bottom: var(--spacing-4);
  }
  .topic .rt {
    display: block;
    font-size: var(--text-5);
    font-weight: 600;
  }
  .topic .rs {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-3);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }
  .topic .rn {
    flex: 0 0 auto;
    font-size: var(--text-3);
    font-weight: 600;
    color: var(--color-muted-foreground);
    font-variant-numeric: tabular-nums;
  }

  .settingrow {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--color-border);
    background: transparent;
    padding: var(--spacing-5) var(--spacing-1);
    color: var(--color-foreground);
  }
  .settingrow:last-child {
    border-bottom: 0;
  }
  .settingrow .rl {
    display: block;
    min-width: 0;
    flex: 1;
    font-size: var(--text-4);
  }
  .settingrow .rf {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .settingrow .rv {
    flex: 0 0 auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--text-3);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  /* A setting the operator has touched but not yet written. It is marked on
     the ROW, where it is read, and not only in a counter at the bottom. */
  .settingrow.modified .rv {
    color: var(--color-primary);
  }
  .settingrow.modified::before {
    content: "";
    width: 3px;
    align-self: stretch;
    border-radius: var(--radius-full);
    background: var(--color-primary);
    margin-right: calc(var(--spacing-2) * -1);
  }

  /* The save bar exists only when there is something to save, and it says
     WHAT it will write — a save that names no file asks for trust nobody
     owes it. It sits above the tab bar, like every other fixed thing. */
  /* A FIELD, inside the panel. The panel is the one place an action lives
     (R56), so editing a setting does not get a screen of its own. */
  .field {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    margin-top: var(--spacing-5);
  }
  .field.list {
    flex-direction: column;
    align-items: stretch;
    gap: var(--spacing-3);
  }
  .fieldinput {
    flex: 1;
    min-width: 0;
    padding: var(--spacing-5) var(--spacing-6);
    border-radius: var(--radius-3);
    border: 1px solid var(--color-border);
    background: var(--color-background);
    color: var(--color-foreground);
    font: inherit;
    font-size: var(--text-6);
  }
  .fieldinput.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-6);
  }
  .fieldinput:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 1px;
  }
  .fieldunit {
    flex: 0 0 auto;
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }
  .fieldlabel {
    font-size: var(--text-4);
    color: var(--color-muted-foreground);
  }
  /* The switch is the whole field: nothing to type, nothing to validate. */
  .fieldtoggle {
    flex: 0 0 auto;
    width: 48px;
    height: 28px;
    padding: var(--spacing-1);
    border: 0;
    border-radius: var(--radius-full);
    background: var(--color-muted);
    display: flex;
    transition: background var(--duration-2) var(--ease-standard);
  }
  .fieldtoggle.active {
    background: var(--color-primary);
    justify-content: flex-end;
  }
  .fieldknob {
    width: 22px;
    height: 22px;
    border-radius: var(--radius-full);
    background: var(--color-white);
    transition: transform var(--duration-2) var(--ease-standard);
  }
  .litem {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    padding: var(--spacing-4) var(--spacing-6);
    border-radius: var(--radius-3);
    border: 1px solid var(--color-border);
    background: var(--color-background);
    font-size: var(--text-4);
  }
  .litem span {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lremove {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--color-muted-foreground);
    padding: var(--spacing-1);
    display: flex;
  }
  .lremove svg {
    width: 15px;
    height: 15px;
  }
  .ladd {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-3);
    padding: var(--spacing-5);
    border-radius: var(--radius-3);
    border: 1px dashed var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    font-weight: 600;
  }
  .ladd svg {
    width: 15px;
    height: 15px;
  }
  .field.readonly .rulenote {
    margin: 0;
  }
  .savebar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--tm-bottom-bar-h, 0px);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    padding: var(--spacing-5) var(--spacing-7);
    border-top: 1px solid var(--color-border);
    background: var(--color-background);
  }
  .savebar[hidden] {
    display: none;
  }
  .savebar .sn {
    flex: 1;
    min-width: 0;
    font-size: var(--text-3);
    line-height: 1.35;
    color: var(--color-muted-foreground);
  }
  .savebar .sn b {
    display: block;
    color: var(--color-foreground);
    font-size: var(--text-4);
  }
  .savebar button {
    flex: 0 0 auto;
    border: 0;
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-7);
    font:
      600 var(--text-4) "Geist",
      system-ui,
      sans-serif;
    background: var(--color-primary);
    color: var(--color-primary-foreground);
  }
  .savebar button:disabled {
    opacity: 0.5;
  }

  /* Pull to refresh */
  .ptr {
    display: grid;
    place-items: center;
    overflow: hidden;
    height: 0;
    transition: height var(--duration-2) var(--ease-standard);
    color: var(--color-muted-foreground);
  }
  .ptr.armed {
    color: var(--color-primary);
  }
  .ptr .spin {
    width: 16px;
    height: 16px;
    border-radius: var(--radius-full);
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
  }
  .ptr.loading .spin {
    animation: spin var(--duration-loop-1) linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* FAB */
  .fab {
    position: absolute;
    right: 16px;
    bottom: calc(var(--tm-bottom-bar-h, 0px) + 16px);
    width: 52px;
    height: 52px;
    border-radius: var(--radius-full);
    border: 0;
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    display: grid;
    place-items: center;
    box-shadow: var(--mq-shadow-fab);
    z-index: 30;
  }
  .fab svg {
    width: 23px;
    height: 23px;
  }

  /* R8 — an author `display` rule BEATS the `[hidden]` attribute. Any class
     that declares a display must therefore declare its own hidden case,
     otherwise `el.hidden = true` hides nothing. Observed here: the FAB
     stayed visible on Arrivées and Médiathèque. */
  .fab[hidden],
  .selbar[hidden],
  .live[hidden],
  .crossref[hidden],
  .chip[hidden] {
    display: none;
  }

  /* Bottom bar — transplanted from BottomTabBar.tsx */
  html.selecting .bottombar {
    display: none;
  }
  .bottombar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 50;
    display: flex;
    border-top: 1px solid var(--color-border);
    background: var(--color-sidebar);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 768px) {
    .bottombar {
      display: none;
    }
  }
  .bottombar a,
  .bottombar button {
    display: flex;
    min-height: 44px;
    min-width: 0;
    flex: 1 1 0%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-2);
    padding-block: var(--spacing-4);
    font-size: var(--text-3);
    border: 0;
    background: transparent;
    color: var(--color-muted-foreground);
    transition: color var(--duration-1) var(--ease-standard);
  }
  .bottombar button[aria-current="page"] {
    color: var(--color-primary-text);
  }
  .bottombar svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .bottombar .lb {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  /* The badge is a CORNER SUPERSCRIPT on the icon — never a third flow
     child, which would make the tab taller. */
  .bottombar .ic {
    position: relative;
    display: inline-flex;
  }
  .navbadge {
    position: absolute;
    right: -10px;
    top: -6px;
    display: inline-flex;
    height: 18px;
    min-width: 18px;
    align-items: center;
    justify-content: center;
    padding-inline: var(--spacing-2);
    border-radius: var(--radius-full);
    /* PRIMARY, not danger: that is NavCountBadge's value. Red is reserved
       for the « ? » of an unavailable counter. */
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    font-size: var(--text-2);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    box-shadow: var(--mq-shadow-badge);
    outline: 2px solid var(--color-sidebar);
  }

  /* Screens (resolution, media sheet) */
  .screen {
    position: absolute;
    inset: 0;
    background: var(--color-background);
    z-index: 45;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform var(--duration-3) var(--ease-standard);
    visibility: hidden;
  }
  .screen.open {
    transform: none;
    visibility: visible;
  }
  /* ONE back control for every page. A floating variant over the image
     created a second design (white) which, on screens without an image,
     OVERLAPPED the title instead of pushing it. A bar in the flow can cover
     nothing — and it reads the same everywhere. */
  .screenbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--spacing-3);
    padding: var(--spacing-5) var(--spacing-6);
    background: var(--color-background);
  }
  .fback {
    display: flex;
    align-items: center;
    gap: var(--spacing-2);
    border: 0;
    background: transparent;
    color: var(--color-primary);
    font-size: var(--text-4);
    font-weight: 600;
    padding: var(--spacing-2) var(--spacing-1);
  }
  .fback svg {
    width: 16px;
    height: 16px;
  }
  /* The tab bar sits above a screen (z-50), so a screen must reserve its
     height, otherwise its last action is stuck underneath. That is rule R4
     — anchor to what you belong to. */
  .screen .port {
    padding-bottom: calc(var(--tm-bottom-bar-h, 0px) + var(--spacing-8));
  }

  /* Bottom sheet */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--color-scrim);
    z-index: 46;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--duration-2) var(--ease-standard);
  }
  .scrim.open {
    opacity: 1;
    visibility: visible;
  }
  /* The tab bar sits ABOVE the layers (z-50), so a sheet must reserve its
     height, otherwise its last actions are unreachable — internal scrolling
     stops before them. Same rule as for screens, extended to sheets and
     dialogs: one defect family deserves one rule, not three. */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 47;
    background: var(--color-popover);
    border-top: 1px solid var(--color-border);
    border-radius: var(--radius-4) var(--radius-4) 0 0;
    max-height: 78%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform var(--duration-3) var(--ease-standard);
    visibility: hidden;
  }
  .sheet.open {
    transform: none;
    visibility: visible;
  }
  .sheet.dragging {
    transition: none;
  }
  .sheetgrab {
    height: 22px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    touch-action: none;
    cursor: grab;
  }
  .sheetgrab::before {
    content: "";
    width: 36px;
    height: 4px;
    border-radius: var(--radius-full);
    background: var(--color-border);
  }
  .sheetin {
    overflow-y: auto;
    padding: var(--spacing-1) var(--spacing-7) calc(var(--tm-bottom-bar-h, 0px) + var(--spacing-8));
  }
  .sheettitle {
    font-size: var(--text-6);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 var(--spacing-1);
  }
  .sheetmeta {
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
    margin-bottom: var(--spacing-7);
  }
  .sheethead {
    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    padding-bottom: var(--spacing-2);
  }

  /* A head carrying a POSTER aligns to the top: an 84px picture next to two
     short lines centred against it leaves the title floating in the middle of
     nothing. It also breathes below rather than inside: an 84px picture makes
     the same 4px read as nothing at all. */
  .sheethead.withposter {
    align-items: flex-start;
    padding-bottom: 0;
    margin-bottom: var(--spacing-6);
  }

  .sheetid {
    min-width: 0;
    flex: 1;
  }

  .sheethead .sheetmeta {
    margin-bottom: var(--spacing-3);
  }

  .sheethead .sheetsub {
    display: block;
    margin-top: var(--spacing-1);
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }

  .avatar.big {
    width: 42px;
    height: 42px;
    font-size: var(--text-6);
  }

  /* An entry that is coming says so instead of being absent: a menu that grows
     an item later teaches its shape twice. */
  .soon {
    margin-left: auto;
    font-size: var(--text-1);
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: var(--spacing-1) var(--spacing-3);
    border-radius: var(--radius-full);
    background: var(--color-muted);
    color: var(--color-muted-foreground);
  }

  .sheetacts {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
    margin: var(--spacing-2) 0 var(--spacing-7);
  }
  .sheetacts.secondary {
    margin-top: var(--spacing-8);
    padding-top: var(--spacing-7);
    border-top: 1px solid var(--color-border);
  }
  .sact {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-4);
    font-weight: 500;
    padding: var(--spacing-5) var(--spacing-6);
    border-radius: var(--radius-3);
    text-align: left;
  }
  .sact.primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-primary-foreground);
    font-weight: 600;
  }
  .sact.danger {
    color: var(--color-danger);
  }
  .sact svg {
    width: 16px;
    height: 16px;
    color: var(--color-muted-foreground);
    flex: 0 0 auto;
  }
  .sact.primary svg {
    color: var(--color-primary-foreground);
  }

  /* Transplanted from maquette-acquisition.css — used in markup without
     having been ported, therefore inert: the « no trailer » message
     rendered at 14px without its dashed frame. */
  .noinfo {
    margin: 0 0 var(--spacing-2);
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-5);
  }
  .rulenote {
    margin: 0 0 var(--spacing-7);
    font-size: var(--text-3);
    line-height: 1.45;
    color: var(--color-muted-foreground);
    border-left: 2px solid var(--color-border);
    padding: var(--spacing-1) 0 var(--spacing-1) var(--spacing-5);
  }

  /* Media sheet — ONE template for every medium
     The differences between a film and a series are the ones their nature
     imposes, and nothing else: a film has a director and a runtime, a
     series has a creator, a status and an episode catalogue. Everything
     else — hero, synopsis, cast, trailer, identifiers, library state — is
     identical and in the same order. Missing data is written « inconnu »,
     never a mute dash. */
  /* Media-sheet hero — the visual as a melting header
     The wide visual occupies the top of the sheet at full width and dissolves
     into the body colour. It is the only image treatment of this kind in the
     interface; the top bar deliberately refuses blur so that nothing has to be
     re-sampled while content moves.

     Three precautions, because a decorative header must never cost legibility:
     · an opaque gradient closes on the body colour before the text, so type is
       always read on a solid colour and never on an image;
     · opacity and saturation are capped, so a very colourful visual does not
       make the title vibrate;
     · no information lives in the image — removing it loses nothing. */
  /* The visual IS the top of the sheet: full width, sharp, melting into the
     body. This is not an ambient tint behind a title — it is the visual
     anchor, and the title sits under it. */
  .herowrap {
    position: relative;
    /* -10px cancels .body's top padding so the image touches the bar.
       Without an image the same pull would glue the title to it, hence the
       breathing room restored in .noposter below. */
    margin: calc(var(--spacing-5) * -1) calc(var(--spacing-7) * -1) 0;
    isolation: isolate;
    /* `clip`, not `hidden`: forbid overflow without creating a scroll
       container. An animation must never be able to push the page sideways. */
    overflow-x: clip;
  }
  .herobg {
    position: relative;
    height: min(46vh, 400px);
    min-height: 268px;
    background-position: center 16%;
    background-size: cover;
    background-color: var(--color-muted);
  }
  .herobg::after {
    content: "";
    position: absolute;
    inset: 0;
    /* The melt: the image gives itself fully at the top, then dissolves
       into the body colour. No edge, no seam — that is the whole effect. */
    background: linear-gradient(
      to bottom,
      transparent 0%,
      transparent 34%,
      color-mix(in oklab, var(--color-background) 45%, transparent) 66%,
      color-mix(in oklab, var(--color-background) 88%, transparent) 87%,
      var(--color-background) 100%
    );
  }

  /* Medium without a visual: the template does not change, only the content
     is missing. A muted field holds the place. */
  .herowrap.noposter {
    /* No image: the title must not be glued to the bar. */
    padding-top: var(--spacing-8);
  }

  .herowrap.noposter .herobg {
    height: 72px;
    min-height: 0;
    background-image: linear-gradient(
      160deg,
      color-mix(in oklab, var(--color-primary) 45%, var(--color-background)),
      var(--color-card) 58%,
      var(--color-muted)
    );
  }

  @media (prefers-reduced-motion: no-preference) {
    .herobg {
      animation: heroin var(--duration-4) var(--ease-standard) both;
    }
  }
  @keyframes heroin {
    from {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
    }
  }
  .hero {
    position: relative;
    /* The title overlaps the end of the melt: it belongs to the image as
       much as to the body, and that is what stitches the two together. */
    margin-top: -62px;
    padding: 0 var(--spacing-7);
  }
  .hero .ht {
    margin: 0;
    font-size: var(--text-8);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.025em;
    text-wrap: balance;
    text-shadow: 0 2px 14px
      color-mix(in oklab, var(--color-background) 70%, transparent);
  }
  .hero .hm {
    margin: var(--spacing-3) 0 0;
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
    line-height: 1.55;
  }
  .hero .hn {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
    margin-top: var(--spacing-3);
    font-size: var(--text-3);
    font-weight: 700;
    color: var(--color-primary);
  }
  .hero .hn svg {
    width: 13px;
    height: 13px;
  }
  .cast {
    display: flex;
    gap: var(--spacing-4);
    overflow-x: auto;
    scrollbar-width: none;
    /* `pan-x` ALONE forbids vertical panning: a finger resting on the
       carousel could no longer scroll the sheet, which is exasperating.
       Allow both axes and let the browser decide from the gesture
       direction. Same fix on the pill train. */
    touch-action: pan-x pan-y;
    padding-bottom: var(--spacing-1);
  }
  .cast::-webkit-scrollbar {
    display: none;
  }
  .cast figure {
    flex: 0 0 auto;
    width: 74px;
    margin: 0;
  }
  .cast .ca img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cast .ca {
    width: 74px;
    height: 74px;
    border-radius: var(--radius-full);
    background: var(--color-muted);
    display: grid;
    place-items: center;
    font-family: ui-monospace, Menlo, monospace;
    font-size: var(--text-7);
    font-weight: 600;
    color: var(--color-muted-foreground);
    overflow: hidden;
  }
  .cast figcaption {
    margin-top: var(--spacing-3);
    font-size: var(--text-2);
    line-height: 1.35;
  }
  .cast figcaption b {
    display: block;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cast figcaption span {
    display: block;
    color: var(--color-muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Media-sheet add button: solid while the action is offered, then OUTLINE
     + « Ajouté » once done — the same toggle as a search result's button,
     so one gesture always gets the same answer. Content centred: left-
     aligned like an action row, it read as a list item rather than the
     primary button. */
  .mediaadd {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-4);
    width: 100%;
    border: 1px solid var(--color-primary);
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    font-size: var(--text-5);
    font-weight: 600;
    padding: var(--spacing-6);
    border-radius: var(--radius-3);
  }
  .mediaadd svg {
    width: 16px;
    height: 16px;
  }
  .mediaadd.done {
    background: transparent;
    color: var(--color-muted-foreground);
    border-color: var(--color-border);
  }
  /* The destination is information: this control LEAVES the application. */
  .tsrc svg {
    width: 12px;
    height: 12px;
  }

  .tsrc {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
    margin-left: auto;
    font-size: var(--text-1);
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: var(--spacing-1) var(--spacing-3);
    border-radius: var(--radius-full);
    background: var(--color-muted);
    color: var(--color-muted-foreground);
  }

  .trailer {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-6);
    font-size: var(--text-4);
    font-weight: 600;
    text-align: left;
  }
  .trailer .pl {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-full);
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    display: grid;
    place-items: center;
  }
  .trailer .pl svg {
    width: 14px;
    height: 14px;
  }
  .trailer small {
    display: block;
    font-size: var(--text-2);
    font-weight: 400;
    color: var(--color-muted-foreground);
    margin-top: var(--spacing-1);
  }
  .eprow {
    display: flex;
    align-items: baseline;
    gap: var(--spacing-4);
    padding: var(--spacing-4) 0;
    border-bottom: 1px solid var(--color-border);
    font-size: var(--text-3);
  }
  .eprow:last-child {
    border-bottom: 0;
  }
  .eprow .en {
    flex: 0 0 auto;
    font-family: ui-monospace, Menlo, monospace;
    font-size: var(--text-2);
    font-weight: 600;
    color: var(--color-muted-foreground);
    min-width: 34px;
  }
  .eprow .et {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .eprow .ed {
    flex: 0 0 auto;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    font-variant-numeric: tabular-nums;
  }
  .epdot {
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: var(--radius-full);
    background: var(--color-neutral-signal);
    align-self: center;
  }
  .eprow.in_library .epdot {
    background: var(--color-success);
  }
  .eprow.in_library .en {
    color: var(--color-success);
  }
  .eprow.to_grab .epdot {
    background: var(--color-warning);
  }
  .eprow.to_grab .en {
    color: var(--color-warning);
  }
  .eprow.acquiring .epdot {
    background: var(--color-info);
  }
  .eprow.acquiring .en {
    color: var(--color-info);
  }
  .eprow.pending .epdot {
    background: var(--color-waiting);
  }
  .eprow.pending .en {
    color: var(--color-waiting);
  }
  .eprow.announced .epdot {
    background: var(--color-upcoming);
  }
  .eprow.announced .en {
    color: var(--color-upcoming);
  }
  .eprow.unverified .epdot {
    background: transparent;
    border: 1px dashed var(--color-border);
  }

  /* Season matrix (follow detail sheet)
     Geometry taken from the shipped component: 31 × 27 cell, radius 5, mono
     11 semibold, tone background at 20%. « Not verified » is a dashed
     ghost, not a colour: the absence of a verdict is not a state. */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-2) var(--spacing-6);
    margin-bottom: var(--spacing-6);
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
    white-space: nowrap;
  }
  .legend i {
    width: 9px;
    height: 9px;
    border-radius: var(--radius-1);
    display: block;
  }
  .sw-success {
    background: color-mix(in oklab, var(--color-success) 60%, transparent);
  }
  .sw-warning {
    background: color-mix(in oklab, var(--color-warning) 60%, transparent);
  }
  .sw-info {
    background: color-mix(in oklab, var(--color-info) 60%, transparent);
  }
  .sw-waiting {
    background: color-mix(in oklab, var(--color-waiting) 60%, transparent);
  }
  .sw-upcoming {
    background: color-mix(in oklab, var(--color-upcoming) 60%, transparent);
  }
  .sw-muted {
    border: 1px dashed var(--color-border);
    background: transparent;
  }
  .season {
    border-top: 1px solid var(--color-border);
    padding: var(--spacing-4) 0;
  }
  .season:first-of-type {
    border-top: 0;
  }
  .season > summary {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    padding: var(--spacing-2) 0;
    cursor: pointer;
    font-size: var(--text-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-muted-foreground);
    list-style: none;
  }
  .season > summary::-webkit-details-marker {
    display: none;
  }
  /* The expand affordance must be VISIBLE: a 9px chevron went unnoticed,
     and nothing said the row opens. */
  .season > summary::before {
    content: "›";
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border-radius: var(--radius-2);
    background: var(--color-muted);
    color: var(--color-foreground);
    font-size: var(--text-5);
    font-weight: 700;
    line-height: 1;
    transition: transform var(--duration-2) var(--ease-standard);
  }
  .season[open] > summary::before {
    transform: rotate(90deg);
  }
  .season .sfr {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-3);
    font-weight: 600;
    color: var(--color-foreground);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: normal;
  }
  .season .miss {
    font-size: var(--text-1);
    font-weight: 600;
    padding: var(--spacing-1) var(--spacing-3);
    border-radius: var(--radius-full);
    text-transform: none;
    letter-spacing: normal;
    background: color-mix(in oklab, var(--color-warning) 20%, transparent);
    color: var(--color-warning);
  }
  /* The question an incomplete sheet answers is « which ones are missing »,
     not « how many ». Answer it in words, before the list. */
  .missing {
    margin: var(--spacing-4) 0 0;
    font-size: var(--text-3);
    font-weight: 600;
    color: var(--color-warning);
    font-variant-numeric: tabular-nums;
  }

  .eps {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-2);
    margin-top: var(--spacing-4);
  }
  .ep {
    display: grid;
    place-items: center;
    width: 31px;
    height: 27px;
    border-radius: var(--radius-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-2);
    font-weight: 600;
    border: 0;
  }
  .ep.in_library {
    background: color-mix(in oklab, var(--color-success) 20%, transparent);
    color: var(--color-success);
  }
  .ep.to_grab {
    background: color-mix(in oklab, var(--color-warning) 20%, transparent);
    color: var(--color-warning);
  }
  .ep.acquiring {
    background: color-mix(in oklab, var(--color-info) 20%, transparent);
    color: var(--color-info);
  }
  .ep.pending {
    background: color-mix(in oklab, var(--color-waiting) 20%, transparent);
    color: var(--color-waiting);
  }
  .ep.announced {
    background: color-mix(in oklab, var(--color-upcoming) 20%, transparent);
    color: var(--color-upcoming);
  }
  .ep.unverified {
    border: 1px dashed var(--color-border);
    background: transparent;
    color: var(--color-muted-foreground);
  }
  /* Air-date popover on an episode cell — mirrors the shipped
     EpisodeDatePopover: « Diffusé le … » or « Sortie prévue le … », never a
     bare ISO date. Portalled to the body so sheet scrolling cannot clip it. */
  /* The episode popover, and why its outline is the BRAND colour rather than
     the border one. It floats over a matrix of dark cells on a dark surface,
     and a border in `--border` put a near-black line on a near-black
     background: its edges could not be found, so it read as text hovering in
     mid-air rather than as a thing with limits. The accent is the only colour
     in the palette that separates from everything the app draws behind it. */
  .eppop {
    position: fixed;
    z-index: 60;
    width: 220px;
    border-radius: var(--radius-2);
    border: 1px solid var(--color-primary);
    background: var(--color-popover);
    padding: var(--spacing-4) var(--spacing-6);
    font-size: var(--text-3);
    line-height: 1.45;
    color: var(--color-foreground);
    box-shadow: var(--mq-shadow-toast);
  }
  .eppop b {
    display: block;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    font-weight: 600;
    margin-bottom: var(--spacing-1);
  }
  .ep {
    cursor: pointer;
  }

  .sheetposter {
    flex: 0 0 auto;
    width: 84px;
    aspect-ratio: 2/3;
    border-radius: var(--radius-2);
    overflow: hidden;
    font-size: var(--text-8);
    background: var(--color-muted);
  }
  .sheetposter img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Add screen (« + ») */
  .addform {
    padding: var(--spacing-6) var(--spacing-7) 0;
  }
  .addrow {
    display: flex;
    gap: var(--spacing-4);
    margin-top: var(--spacing-4);
  }
  .btnprimary {
    flex: 0 0 auto;
    border: 0;
    border-radius: var(--radius-3);
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    font-size: var(--text-4);
    font-weight: 600;
    padding: 0 var(--spacing-7);
  }
  .btnprimary:disabled {
    opacity: 0.5;
  }
  .segmini {
    display: flex;
    gap: var(--spacing-1);
    padding: var(--spacing-1);
    background: var(--color-muted);
    border-radius: var(--radius-3);
  }
  .segmini button {
    border: 0;
    border-radius: var(--radius-2);
    background: transparent;
    color: var(--color-muted-foreground);
    font-size: var(--text-3);
    font-weight: 600;
    padding: var(--spacing-3) var(--spacing-6);
  }
  .segmini button[aria-pressed="true"] {
    background: var(--color-background);
    color: var(--color-foreground);
    box-shadow: var(--mq-shadow-vsw);
  }
  .rescount {
    padding: var(--spacing-6) var(--spacing-7) 0;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
  }
  /* Search results are a card LIST like any other: the gap comes from `.sec`,
     so the list cannot drift from the others by editing one number here. This
     rule carries the screen's padding and nothing else. */
  .reslist {
    padding: var(--spacing-5) var(--spacing-7) var(--spacing-8);
  }
  .sugg {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-3);
    padding: var(--spacing-6) var(--spacing-7) 0;
  }
  .sugg button {
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-muted-foreground);
    font-size: var(--text-3);
    padding: var(--spacing-2) var(--spacing-5);
    border-radius: var(--radius-full);
  }
  .byid {
    margin: var(--spacing-7) var(--spacing-7) 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-6);
  }
  .byid > summary {
    font-size: var(--text-3);
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .byid > summary::-webkit-details-marker {
    display: none;
  }
  .byid > summary::before {
    content: "▸ ";
    font-size: var(--text-1);
  }
  .byid[open] > summary::before {
    content: "▾ ";
  }
  .byidin {
    margin-top: var(--spacing-5);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-4);
  }
  .whyoff {
    font-size: var(--text-2);
    color: var(--color-danger);
  }
  .addfoot {
    position: sticky;
    /* Anchored to the BAR, not to the screen edge: pinned at 0 it slid
       under the tab bar and its actions became unreachable. */
    bottom: var(--tm-bottom-bar-h, 0px);
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    padding: var(--spacing-5) var(--spacing-7) calc(env(safe-area-inset-bottom) + var(--spacing-5));
    background: var(--color-popover);
    border-top: 1px solid var(--color-border);
    font-size: var(--text-3);
  }
  .addfoot button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--color-primary);
    font-weight: 600;
    font-size: var(--text-3);
  }

  /* ONE ACTION-BUTTON SYSTEM
     Every full-width action has its content CENTRED. The shipped component
     left-aligned sheet rows like a menu; the product decision is the
     opposite, and a product decision outranks the original component.

     One scale, everywhere: height 44 (the touch target), radius 8, weight
     600, 13.5px, 16px icon. Before this rule heights ranged from 35 to 45px
     depending on the surface and the same gesture did not look the same in
     two places — which is exactly what « uniform » means. */
  /* Refinement after trying centring everywhere: a button that carries an
     ICON is left-aligned — the icon anchors the start of the row and the
     label follows it; centred, the pair floated. A button WITHOUT an icon
     stays centred: nothing anchors its left edge, and text pushed left
     looks unbalanced. The rest stays single and checkable: height 44,
     radius 8, weight 600, 13.5px. */
  .sact,
  .cfoot,
  .mediaadd,
  .dlgbtn,
  .btnprimary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-4);
    width: 100%;
    min-height: 44px;
    padding: var(--spacing-5) var(--spacing-6);
    border-radius: var(--radius-3);
    font-size: var(--text-4);
    font-weight: 600;
    text-align: center;
  }
  .sact svg,
  .cfoot svg,
  .mediaadd svg {
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
  }
  /* A button with a direct icon child is left-aligned. `:has()` avoids one
     class per case — the rule follows STRUCTURE, not a label someone must
     remember to add. */
  .sact:has(> svg),
  .cfoot:has(> svg),
  .mediaadd:has(> svg) {
    justify-content: flex-start;
    text-align: left;
  }
  /* The « Chercher » button keeps its own width: it shares its line with
     the type segment, so it cannot be full width. */
  .addrow .btnprimary {
    width: auto;
    padding-inline: var(--spacing-7);
  }

  /* « Choose another release » screen
     What the engine found, with WHAT DRIVES THE RANKING visible: without
     it, « take this one » is a bet. Each row states its resolution, source,
     language, seeders and size. */
  .rel {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-5);
  }
  .rel.best {
    border-color: var(--color-primary);
  }
  .rel .rn {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-2);
    line-height: 1.4;
    word-break: break-all;
  }
  .rel .rt {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-2);
    align-items: center;
  }
  .rel .sc {
    margin-left: auto;
    font-size: var(--text-2);
    font-weight: 700;
    color: var(--color-primary);
    white-space: nowrap;
  }

  /* « Quality profile » screen */
  .qgroup {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-4);
  }
  /* Switch — FIXED dimensions, always the same. A « Oui/Non » chip inside a
     flex row took the label's height (align-items: stretch) and changed
     width with the word, so two identical toggles had different sizes
     depending on the section. A switch also states its value through its
     SHAPE, not only through a word. */
  .switch {
    flex: 0 0 auto;
    align-self: center;
    position: relative;
    width: 46px;
    height: 28px;
    min-height: 28px;
    padding: 0;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    background: var(--color-muted);
    transition:
      background var(--duration-2) var(--ease-standard),
      border-color var(--duration-2) var(--ease-standard);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 22px;
    height: 22px;
    border-radius: var(--radius-full);
    background: var(--color-muted-foreground);
    transition:
      transform var(--duration-2) var(--ease-standard),
      background var(--duration-2) var(--ease-standard);
  }
  .switch[aria-checked="true"] {
    background: var(--color-primary);
    border-color: var(--color-primary);
  }
  .switch[aria-checked="true"]::after {
    transform: translateX(18px);
    background: var(--color-primary-foreground);
  }
  .switch:disabled {
    opacity: 0.5;
  }
  /* A setting row does not stretch: the label can wrap without dragging the
     control with it. */
  .kv.setting {
    align-items: flex-start;
  }
  .kv.setting > span:first-child {
    padding-right: var(--spacing-2);
  }

  /* Form controls
     SHAPE states the rule: a circle means one choice, a square means
     several. Identical pills for both said nothing, and their width
     followed the word length, so two options of the same group had
     different sizes. Here the row is full width: every option is identical,
     in every group. */
  .optlist {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
  }
  .opt {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    min-height: 48px;
    padding: var(--spacing-4) var(--spacing-6);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    background: transparent;
    text-align: left;
  }
  .opt[aria-checked="true"] {
    border-color: var(--color-primary);
    background: color-mix(in oklab, var(--color-primary) 8%, transparent);
  }
  .opt .mark {
    position: relative;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border: 2px solid var(--color-border);
    background: transparent;
    transition:
      border-color var(--duration-1) var(--ease-standard),
      background var(--duration-1) var(--ease-standard);
  }
  .opt.radio .mark {
    border-radius: var(--radius-full);
  }
  .opt.check .mark {
    border-radius: var(--radius-2);
  }
  .opt[aria-checked="true"] .mark {
    border-color: var(--color-primary);
    background: var(--color-primary);
  }
  /* Checked radio: a solid dot. Checked box: a tick. Two distinct shapes,
     including once checked. */
  .opt.radio[aria-checked="true"] .mark::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: var(--radius-full);
    background: var(--color-primary-foreground);
  }
  .opt.check[aria-checked="true"] .mark::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid var(--color-primary-foreground);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .opt .lb {
    flex: 1;
    min-width: 0;
    font-size: var(--text-4);
    font-weight: 500;
  }
  .opt .lb small {
    display: block;
    /* A hint that wraps makes its row taller than its neighbours: the group
       loses its single size. One line only. */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--text-2);
    font-weight: 400;
    color: var(--color-muted-foreground);
    margin-top: var(--spacing-1);
  }
  .optkind {
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    margin: 0 0 var(--spacing-3);
  }

  .qhint {
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    line-height: 1.45;
  }

  /* Dialog */
  .dlg {
    position: absolute;
    left: 16px;
    right: 16px;
    top: 50%;
    z-index: 48;
    background: var(--color-popover);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-4);
    padding: var(--spacing-7);
    box-shadow: var(--mq-shadow-dlg);
    transform: translateY(-50%) scale(0.96);
    opacity: 0;
    visibility: hidden;
    transition:
      opacity var(--duration-2) var(--ease-standard),
      transform var(--duration-2) var(--ease-standard);
  }
  .dlg.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) scale(1);
  }
  .dlg h2 {
    margin: 0 0 var(--spacing-4);
    font-size: var(--text-5);
    font-weight: 700;
  }
  .dlg p {
    margin: 0 0 var(--spacing-5);
    font-size: var(--text-3);
    line-height: 1.45;
    color: var(--color-muted-foreground);
  }
  .dryrun {
    display: flex;
    align-items: center;
    gap: var(--spacing-3);
    font-size: var(--text-2);
    font-weight: 600;
    color: var(--color-info);
    border: 1px solid color-mix(in oklab, var(--color-info) 40%, transparent);
    border-radius: var(--radius-2);
    padding: var(--spacing-4) var(--spacing-5);
    margin-bottom: var(--spacing-5);
  }
  .dryrun svg {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
  }
  .manifest {
    list-style: none;
    margin: 0 0 var(--spacing-5);
    padding: 0;
    font-size: var(--text-3);
  }
  .manifest li {
    display: flex;
    gap: var(--spacing-4);
    padding: var(--spacing-2) 0;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-muted-foreground);
  }
  .manifest li:last-child {
    border-bottom: 0;
  }
  .manifest b {
    color: var(--color-foreground);
    font-weight: 600;
    margin-left: auto;
    white-space: nowrap;
  }
  .warnbox {
    border: 1px solid color-mix(in oklab, var(--color-warning) 45%, transparent);
    background: color-mix(in oklab, var(--color-warning) 8%, transparent);
    border-radius: var(--radius-2);
    padding: var(--spacing-4) var(--spacing-5);
    font-size: var(--text-3);
    line-height: 1.45;
    margin-bottom: var(--spacing-5);
  }
  .warnbox b {
    color: var(--color-warning);
  }
  .dlgacts {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
  }
  .dlgbtn {
    width: 100%;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-4);
    font-weight: 600;
    padding: var(--spacing-5);
    border-radius: var(--radius-3);
  }
  .dlgbtn.danger {
    background: var(--color-danger-fill);
    border-color: var(--color-danger-fill);
    color: var(--color-white);
  }
  .dlgbtn.ghost {
    color: var(--color-muted-foreground);
    border-color: transparent;
  }

  /* Toast */
  .toast {
    position: absolute;
    left: 14px;
    right: 14px;
