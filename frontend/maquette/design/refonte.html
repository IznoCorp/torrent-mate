    bottom: calc(var(--tm-bottom-bar-h, 0px) + 16px);
    z-index: 49;
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    background: var(--color-popover);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-3);
    padding: var(--spacing-5) var(--spacing-6);
    font-size: var(--text-3);
    box-shadow: var(--mq-shadow-toast);
    transform: translateY(14px);
    opacity: 0;
    visibility: hidden;
    transition:
      opacity var(--duration-2) var(--ease-standard),
      transform var(--duration-2) var(--ease-standard);
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  .toast button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--color-muted-foreground);
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .toast svg {
    width: 14px;
    height: 14px;
  }

  /* Empty / note */
  .empty {
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-3);
    padding: var(--spacing-8) var(--spacing-7);
    text-align: center;
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
    line-height: 1.5;
  }
  .empty b {
    display: block;
    color: var(--color-foreground);
    font-size: var(--text-4);
    margin-bottom: var(--spacing-2);
  }

  /* Surface states: loading, empty, error
     A loading surface SAYS SO (skeletons of the right shape, never a bare «
     Chargement… »); an empty surface says WHY and offers a way out; a
     surface in error names the cause and offers a retry. */
  .skcard {
    height: 62px;
    border-radius: var(--radius-3);
  }
  .surferr {
    border: 1px solid color-mix(in oklab, var(--color-danger) 45%, transparent);
    background: color-mix(in oklab, var(--color-danger) 8%, transparent);
    border-radius: var(--radius-3);
    padding: var(--spacing-7);
    font-size: var(--text-3);
    line-height: 1.5;
  }
  .surferr b {
    display: block;
    color: var(--color-danger-text);
    margin-bottom: var(--spacing-2);
  }
  .surferr button {
    margin-top: var(--spacing-5);
    width: 100%;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    font-weight: 600;
    padding: var(--spacing-4);
    border-radius: var(--radius-2);
  }

  /* Loading: skeletons, sentinel, end of list */
  .sk {
    border-radius: var(--radius-2);
    background: linear-gradient(
      90deg,
      var(--color-card) 25%,
      var(--color-muted) 50%,
      var(--color-card) 75%
    );
    background-size: 400% 100%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sk {
      animation: sh var(--duration-loop-2) linear infinite;
    }
  }
  @keyframes sh {
    to {
      background-position: -400% 0;
    }
  }
  .sk.tile {
    aspect-ratio: 2/3;
  }
  .sk.row {
    height: 62px;
    border-radius: var(--radius-3);
  }
  /* R8 again: `#sugitems` carried its `display` as an INLINE style, which
     beats the `[hidden]` attribute — the list stayed visible under the
     loading skeletons. Display lives here, with its hidden case. */
  /* The list format stacks; the poster format takes the shared gallery grid,
     which is a CLASS. An id rule would win over it by specificity alone — one
     of the two would then have to be written twice, and the one written twice
     is the one that drifts. */
  #sugitems:not(.grid) {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-7);
  }
  #sugitems[hidden],
  #sugload[hidden],
  #libitems[hidden] {
    display: none;
  }
  .loadfoot {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-5);
    padding: var(--spacing-2) 0 var(--spacing-1);
  }
  .endmark {
    text-align: center;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    padding: var(--spacing-7) 0 var(--spacing-2);
  }
  .endmark::before {
    content: "";
    display: block;
    width: 34px;
    height: 1px;
    background: var(--color-border);
    margin: 0 auto var(--spacing-4);
  }
  .loaderr {
    border: 1px solid color-mix(in oklab, var(--color-danger) 45%, transparent);
    background: color-mix(in oklab, var(--color-danger) 8%, transparent);
    border-radius: var(--radius-3);
    padding: var(--spacing-5);
    font-size: var(--text-3);
    line-height: 1.45;
  }
  .loaderr b {
    color: var(--color-danger-text);
  }
  .loaderr button {
    margin-top: var(--spacing-4);
    width: 100%;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    font-weight: 600;
    padding: var(--spacing-4);
    border-radius: var(--radius-2);
  }
  .quota {
    text-align: center;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    margin-top: var(--spacing-3);
  }

  /* Grid selection: invisible at rest */
  .tile .sel {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 21px;
    height: 21px;
    border-radius: var(--radius-full);
    border: 2px solid var(--color-white);
    background: var(--color-scrim-soft);
    display: grid;
    place-items: center;
    color: transparent;
  }
  .tile .sel svg {
    width: 13px;
    height: 13px;
  }
  .tile[aria-pressed="true"] .sel {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-primary-foreground);
  }
  .tile[aria-pressed="true"] .p {
    outline: 2px solid var(--color-primary);
    outline-offset: -2px;
  }
  /* During a selection this bar REPLACES the tab bar: stacking them covered
     « Supprimer » (z-index 41 under 50) and cost 57px of height on a phone
     screen. This is a mode; « Annuler » is its exit, and it is present. */
  /* Selection-mode row: same anatomy as the card, plus the checkbox. */
  .selrow {
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    width: 100%;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: var(--radius-3);
    padding: var(--spacing-4);
    text-align: left;
  }
  .selrow[aria-pressed="true"] {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 1px var(--color-primary);
  }
  .selrow .sel {
    position: static;
    flex: 0 0 auto;
  }
  .selrow .poster {
    display: block;
  }
  .selrow .rowtxt {
    min-width: 0;
    flex: 1;
  }
  .selrow .ctitle,
  .selrow .csub {
    display: block;
  }
  .selbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 51;
    display: flex;
    align-items: center;
    gap: var(--spacing-5);
    padding: var(--spacing-5) var(--spacing-7) calc(env(safe-area-inset-bottom) + var(--spacing-5));
    background: var(--color-popover);
    border-top: 1px solid var(--color-border);
  }
  .selbar .n {
    font-size: var(--text-3);
    font-weight: 600;
  }
  .selbar button {
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    font-weight: 600;
    padding: var(--spacing-4) var(--spacing-6);
    border-radius: var(--radius-3);
  }
  .selbar button.danger {
    background: var(--color-danger-fill);
    border-color: var(--color-danger-fill);
    color: var(--color-white);
    margin-left: auto;
  }
  .selbar button.danger:disabled {
    opacity: 0.45;
  }
  .linkbtn {
    border: 0;
    background: transparent;
    color: var(--color-primary-text);
    font-size: var(--text-2);
    font-weight: 600;
    padding: 0;
  }

  /* Harness panel — enumerates the measurable states. HARNESS, never
     exported. */
  .hpanel {
    position: absolute;
    inset: 0;
    z-index: 60;
    background: var(--color-background);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: var(--spacing-7);
    gap: var(--spacing-6);
  }
  .hpanel h4 {
    margin: 0;
    font-size: var(--text-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-muted-foreground);
  }
  .hpanel .row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-3);
  }
  .hpanel .row button {
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-foreground);
    font-size: var(--text-3);
    padding: var(--spacing-3) var(--spacing-5);
    border-radius: var(--radius-2);
    text-align: left;
  }
  .hpanel .row button[aria-pressed="true"] {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-primary-foreground);
    font-weight: 600;
  }
  .hpanel .states button {
    width: 100%;
    display: flex;
    gap: var(--spacing-5);
    align-items: baseline;
  }
  .hpanel .states code {
    font-size: var(--text-1);
    color: var(--color-muted-foreground);
    margin-left: auto;
  }
  .hpanel p {
    margin: 0;
    font-size: var(--text-2);
    line-height: 1.5;
    color: var(--color-muted-foreground);
  }

  /* Navigation drawer — the app's full template
     The hamburger did nothing and nothing said so. Mirrors `NavSections`:
     three titled sections, the same badges as the bottom bar, and the
     `VersionCard` in the footer — it lives in the desktop rail, and the
     mobile drawer is the ONLY place where the version reaches the phone. */
  .drawer {
    position: absolute;
    inset: 0 auto 0 0;
    width: 288px;
    max-width: 86%;
    z-index: 55;
    background: var(--color-sidebar);
    /* Named for what the document actually defines. A fallback onto a token
       nobody declares reads as a considered choice and is a landmine: the day
       someone reorders it, or drops the fallback, the property silently takes
       whatever the first name happens to resolve to. That is how the current
       entry came to be painted in its own colour. */
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform var(--duration-3) var(--ease-standard);
    visibility: hidden;
  }
  .drawer.open {
    transform: none;
    visibility: visible;
  }
  .drawer .dh {
    display: flex;
    align-items: center;
    gap: var(--spacing-4);
    padding: calc(env(safe-area-inset-top) + var(--spacing-7)) var(--spacing-7) var(--spacing-7);
    border-bottom: 1px solid var(--color-border);
    font-size: var(--text-5);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .drawer nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-2);
    padding: var(--spacing-4);
  }
  .drawer .sect {
    padding: var(--spacing-5) var(--spacing-6) var(--spacing-2);
    font-size: var(--text-1);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-muted-foreground);
  }
  .drawer .sect + .sect,
  .drawer .grp + .grp {
    border-top: 1px solid var(--color-border);
    margin-top: var(--spacing-3);
    padding-top: var(--spacing-5);
  }
  .drawer a {
    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    min-height: 44px;
    padding: var(--spacing-4) var(--spacing-6);
    border-radius: var(--radius-3);
    font-size: var(--text-4);
    color: var(--color-foreground);
  }
  .drawer a[aria-current="page"] {
    /* « You are here » is the brand colour on the label — the same mark the
       bottom bar uses, so one interface has one way of saying it. The row also
       carries a surface, because a list is scanned and its current row has to
       be found without reading five labels; that surface is a TINT of the
       mark, never the mark itself. Painting the mark as the background left
       the label exactly the colour of what it sat on: contrast 1.00, a label
       written in invisible ink. */
    background: color-mix(in oklab, var(--color-primary) 14%, transparent);
    color: var(--color-primary-text);
    font-weight: 600;
  }
  .drawer a svg {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
  }
  .drawer a .count {
    margin-left: auto;
    display: inline-flex;
    height: 18px;
    min-width: 18px;
    align-items: center;
    justify-content: center;
    padding-inline: var(--spacing-2);
    border-radius: var(--radius-full);
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    font-size: var(--text-2);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .drawer .ver {
    border-top: 1px solid var(--color-border);
    padding: var(--spacing-6) var(--spacing-7) calc(env(safe-area-inset-bottom) + var(--spacing-6));
  }
  .drawer .ver .vt {
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .drawer .ver .vv {
    font-size: var(--text-7);
    font-weight: 700;
    margin-top: var(--spacing-1);
  }
  .drawer .ver .vc {
    font-family: ui-monospace, Menlo, monospace;
    font-size: var(--text-2);
    color: var(--color-muted-foreground);
    margin-top: var(--spacing-1);
  }

  /* Design notes overlay */
  .note {
    display: none;
    border-left: 3px solid var(--color-primary);
    background: color-mix(in oklab, var(--color-primary) 9%, transparent);
    border-radius: 0 var(--radius-2) var(--radius-2) 0;
    padding: var(--spacing-4) var(--spacing-5);
    font-size: var(--text-2);
    line-height: 1.5;
    color: var(--color-foreground);
  }
  .note b {
    color: var(--color-primary);
    font-weight: 700;
  }
  .note code {
    font-size: var(--text-1);
    background: var(--color-muted);
    padding: var(--spacing-1) var(--spacing-2);
    border-radius: var(--radius-1);
  }
  :root.notes .note {
    display: block;
  }
  /* Install proposal.
     Above the tab bar, never against the bottom edge: anchored there, the
     close button lands UNDER the fixed bar and cannot be reached — reported
     from a real phone, on both platforms. */
  .installbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(var(--tm-bottom-bar-h, 0px) + 12px);
    z-index: 55;
    display: flex;
    justify-content: center;
    padding: 0 var(--spacing-7);
  }

  .installbar[hidden] {
    display: none;
  }

  .installcard {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: flex-start;
    gap: var(--spacing-6);
    padding: var(--spacing-7);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-4);
    background: var(--color-card);
    box-shadow: var(--mq-shadow-card);
  }

  .installtext {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-2);
  }

  .installtitle {
    margin: 0;
    font-size: var(--text-4);
    font-weight: 600;
  }

  .installsub {
    margin: 0;
    font-size: var(--text-2);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }

  .installsub[hidden],
  .installsteps[hidden],
  .installgo[hidden] {
    display: none;
  }

  /* iOS fires no install event at all, so the banner IS the guide: it walks
     the steps rather than offering a button that cannot exist. */
  .installsteps {
    margin: var(--spacing-1) 0 0;
    padding-left: var(--spacing-8);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-1);
    font-size: var(--text-2);
    line-height: 1.4;
    color: var(--color-muted-foreground);
  }

  .installkey {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-1);
    font-weight: 600;
    color: var(--color-foreground);
  }

  .installkey svg {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
  }

  .installgo {
    align-self: flex-start;
    margin-top: var(--spacing-4);
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-3);
    padding: var(--spacing-4) var(--spacing-6);
    border: 0;
    border-radius: var(--radius-3);
    font:
      600 var(--text-3) "Geist",
      system-ui,
      sans-serif;
    color: var(--color-primary-foreground);
    background: var(--color-primary);
  }

  .installgo svg {
    width: 15px;
    height: 15px;
  }

  .installclose {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-3);
    background: transparent;
    color: var(--color-muted-foreground);
  }

  .installclose svg {
    width: 16px;
    height: 16px;
  }

  /* login:style:start */
  /* Login — the unauthenticated entry screen.
     It covers the shell rather than sitting inside it: the top bar shows a
     session that does not exist yet, and the tab bar offers pages that would
     only answer with a redirect. Centred, one column, and it stays reachable
     with the on-screen keyboard open — which is why it scrolls rather than
     centring by absolute offsets. */
  .loginscreen {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-8);
    padding: var(--spacing-9) var(--spacing-8);
    overflow-y: auto;
    background: var(--color-background);
  }

  .loginscreen[hidden] {
    display: none;
  }

  /* The tall brand block. `.brand` is the topbar's — small and horizontal —
     and this one belongs to the full-screen surfaces that carry no interface
     yet: the entry screen and the startup screen. They share it so that
     signing in never changes identity halfway through. */
  .brandbig {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-5);
    color: var(--color-foreground);
  }

  .brandbig .mk {
    width: 40px;
    height: 40px;
    color: var(--color-primary);
  }

  .brandbig .wm {
    font-size: var(--text-7);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .brandbig em {
    font-style: normal;
    color: var(--color-primary-text);
  }

  .logincard {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-6);
    padding: var(--spacing-8) var(--spacing-8);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-4);
    background: var(--color-card);
  }

  .logintitle {
    margin: 0;
    text-align: center;
    font-size: var(--text-6);
    font-weight: 600;
  }

  .loginsub {
    margin: calc(var(--spacing-3) * -1) 0 var(--spacing-2);
    text-align: center;
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }

  .loginfield {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-2);
    font-size: var(--text-3);
    color: var(--color-muted-foreground);
  }

  /* login:splashstyle:start */

     happening. It is the FIRST thing the document paints, which is why it sits
     at the top of the frame in source order: an element declared after
     megabytes of embedded artwork would appear only once the wait is over.

     the load is, and a bar that pretends to would be lying at every frame. */
  .splash {

    inset: 0;
    z-index: 70;

    height: 3px;

  /* The bar FILLS, from nothing to full, over the five seconds a cold load is
     budgeted. It is not a measurement of the load — nothing here knows how far
     along that is — it is a measurement of the WAIT, which is what the person
     watching is actually living through. A bar that fills answers « how much
     longer », where a shuttle that slides back and forth answers nothing and

     the screen away. Should the load outlast the budget, the bar stops full
