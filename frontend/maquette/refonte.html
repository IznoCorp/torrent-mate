  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior-y: none;
  }
  body {
    background: oklch(0.12 0.004 286);
    color: var(--foreground);
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  :root[data-theme="light"] body {
    background: oklch(0.93 0.002 286);
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ── Phone frame ───────────────────────────────────────────── */
  .stage {
    min-height: 100svh;
    display: grid;
    /* R7 — `minmax(0, 1fr)`, never `1fr`: an `auto` track's floor is the
       item's INTRINSIC size, so the horizontally-scrolling pill train inside
       the device sized the track to its max-content and blew the frame out
       to 910px at a 390px viewport. */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 0;
    overflow-x: clip;
  }
  .device {
    position: relative;
    width: 100%;
    max-width: 100%;
    height: 100svh;
    background: var(--background);
    display: flex;
    flex-direction: column;
    overflow: clip;
  }
  @media (min-width: 520px) {
    .stage {
      padding: 24px 16px;
    }
    .device {
      width: 390px;
      height: min(844px, calc(100svh - 48px));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgb(0 0 0/0.5);
    }
  }

  /* ── Top bar ───────────────────────────────────────────────── */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand .mk {
    width: 19px;
    height: 19px;
    color: var(--primary);
  }
  .brand em {
    font-style: normal;
    color: var(--primary);
  }
  .topbar .sp {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .iconbtn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
  }
  .iconbtn svg {
    width: 15px;
    height: 15px;
  }
  .iconbtn[aria-pressed="true"] {
    color: var(--primary);
    border-color: var(--primary);
  }
  .livedot {
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: var(--success);
  }

  /* ── Scrollport ────────────────────────────────────────────── */
  .port {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: clip;
    overscroll-behavior-y: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(env(safe-area-inset-bottom) + 74px);
  }

  /* ── View tabs (.seg + .more) ──────────────────────────────── */
  .viewtabs {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 14px 8px;
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--background);
  }
  .seg {
    flex: 1 1 auto;
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--muted);
    border-radius: 10px;
    min-width: 0;
  }
  .seg > button {
    flex: 1;
    min-width: 0;
    border: 0;
    padding: 9px 0;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--muted-foreground);
    transition:
      background 0.18s,
      color 0.18s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seg > button[aria-selected="true"] {
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--mq-shadow-seg);
  }
  .seg .n {
    font-size: 11px;
    font-weight: 700;
    margin-left: 5px;
    padding: 1px 5px;
    border-radius: 99px;
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .more {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
  }
  .more svg {
    width: 17px;
    height: 17px;
  }

  /* ── Filter zone ───────────────────────────────────────────── */
  .filters {
    padding: 0 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--muted);
    border-radius: 8px;
    padding: 0 10px;
  }
  .search svg {
    width: 15px;
    height: 15px;
    color: var(--muted-foreground);
    flex: 0 0 auto;
  }
  .search input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--foreground);
    font: inherit;
    font-size: 13px;
    padding: 9px 0;
    outline: none;
  }
  .search input::placeholder {
    color: var(--muted-foreground);
  }
  .pillbar {
    display: flex;
    align-items: center;
    gap: 0;
    margin-top: 8px;
  }
  .pillscroll {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    touch-action: pan-x;
    padding-right: 8px;
  }
  .pillscroll::-webkit-scrollbar {
    display: none;
  }
  .pill {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .pill[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .pill .c {
    opacity: 0.7;
    margin-left: 4px;
    font-weight: 500;
  }
  .pill.warn[aria-pressed="false"] {
    border-color: var(--warning);
    color: var(--warning);
  }
  .vswwrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 8px;
    background: var(--background);
  }
  .vswwrap::before {
    content: "";
    width: 1px;
    height: 22px;
    background: var(--border);
  }
  .vsw {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--muted);
    border-radius: 8px;
  }
  .vsw button {
    width: 32px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
  }
  .vsw button[aria-pressed="true"] {
    background: var(--background);
    color: var(--primary);
    box-shadow: var(--mq-shadow-vsw);
  }
  .vsw svg {
    width: 15px;
    height: 15px;
  }
  .countline {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px 0;
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .countline button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .countline svg {
    width: 13px;
    height: 13px;
  }

  /* ── Body / sections ───────────────────────────────────────── */
  .body {
    padding: 10px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sec {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sechead {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 2px 0;
    text-align: left;
  }
  .pip {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    flex: 0 0 auto;
  }
  .pip.warning {
    background: var(--warning);
  }
  .pip.danger {
    background: var(--danger);
  }
  .pip.info {
    background: var(--info);
  }
  .pip.waiting {
    background: var(--waiting);
  }
  .pip.success {
    background: var(--success);
  }
  .pip.neutral {
    background: var(--neutral-signal);
  }
  .sechead .t {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .sechead .k {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted-foreground);
  }

  /* ── Card ──────────────────────────────────────────────────── */
  .swipe {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    /* The row CLAIMS the horizontal axis. Without this the browser owns both
       axes, decides a drag is a pan, and fires `touchcancel` — the swipe then
       only ever works under synthetic events, which never get cancelled.
       Declared HERE and not on an ancestor: `touch-action` intersects down the
       whole chain, so a `pan-x` scroller under a `pan-y` ancestor pans on
       neither axis. */
    touch-action: pan-y;
  }
  .actions {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: stretch;
  }
  .actions .side {
    display: flex;
  }
  .actions .side.left {
    margin-right: auto;
  }
  .actions .side.right {
    margin-left: auto;
  }
  .act {
    border: 0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--mq-white);
    flex: 0 0 84px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 5px;
    text-align: center;
  }
  .act svg {
    width: 17px;
    height: 17px;
  }
  .act.grab {
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .act.pause {
    background: var(--muted);
    color: var(--foreground);
  }
  .act.remove {
    background: var(--danger);
    color: var(--mq-white);
  }
  .card {
    position: relative;
    display: flex;
    width: 100%;
    flex-direction: column;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 9px;
    transition: transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .card.dragging {
    transition: none;
  }
  .ctop {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 10px;
  }
  /* Anatomie EXACTE du MediaPoster livré : image de couverture si elle
     existe, sinon DEUX initiales en mono sur un dégradé accent/50 → card →
     muted, avec un filigrane d'icône à 5 % en bas à droite. Le prototype
     affichait une seule initiale sur un aplat — une approximation. */
  .poster {
    flex: 0 0 auto;
    width: 38px;
    aspect-ratio: 2/3;
    border-radius: 4px;
    background: var(--muted);
    overflow: hidden;
    font-size: 14px;
    padding: 0;
    border: 0;
  }
  .poster img,
  .tile .p img,
  .sug .p img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pfall {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(
      to bottom right,
      color-mix(in oklab, var(--accent) 50%, transparent),
      var(--card),
      var(--muted)
    );
  }
  .pfall svg {
    position: absolute;
    bottom: -14%;
    right: -11%;
    width: 66%;
    height: 66%;
    color: var(--foreground);
    opacity: 0.05;
  }
  .pfall b {
    position: relative;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1em;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: color-mix(in oklab, var(--muted-foreground) 90%, transparent);
  }
  .cbody {
    min-width: 0;
    flex: 1;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 0;
    display: block;
  }
  .ctitle {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .csub {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .creason {
    display: block;
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cmeta {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .frac {
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  /* Anatomie EXACTE du composant Chip livré : 11 px semibold, radius pilule,
     un point de 6 px de la couleur du ton, fond teinté à 20 %. Une pastille
     sans son point ou d'une autre taille est une dérive, pas une variante. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    border-radius: 99px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    line-height: 15px;
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .chip::before {
    content: "";
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: 99px;
    background: currentColor;
  }
  .chip.warning {
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .chip.success {
    background: color-mix(in oklab, var(--success) 20%, transparent);
    color: var(--success);
  }
  .chip.danger {
    background: color-mix(in oklab, var(--danger) 20%, transparent);
    color: var(--danger);
  }
  .chip.info {
    background: color-mix(in oklab, var(--info) 20%, transparent);
    color: var(--info);
  }
  .chip.waiting {
    background: color-mix(in oklab, var(--waiting) 20%, transparent);
    color: var(--waiting);
  }
  .caption {
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .freshtag {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    color: var(--primary-foreground);
    background: var(--primary);
    white-space: nowrap;
  }
  .cadence {
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 8px 14px 0;
  }
  .tilebadge {
    position: absolute;
    top: 5px;
    right: 5px;
    display: grid;
    place-items: center;
    height: 17px;
    min-width: 17px;
    padding: 0 4px;
    border-radius: 99px;
    border: 2px solid var(--background);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--mq-white);
  }

  /* journey strip — its own full-width line (R2) */
  .strip {
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0;
  }
  .st {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    min-width: 0;
  }
  .st .d {
    width: 9px;
    height: 9px;
    border-radius: 99px;
    background: var(--border);
    z-index: 1;
  }
  .st.done .d {
    background: var(--success);
  }
  .st.now .d {
    background: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 25%, transparent);
  }
  .st.blocked .d {
    background: var(--danger);
  }
  .st .l {
    font-size: 9.5px;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .st::before {
    content: "";
    position: absolute;
    top: 4px;
    left: -50%;
    width: 100%;
    height: 1px;
    background: var(--border);
  }
  .st:first-child::before {
    display: none;
  }
  .st.done::before,
  .st.now::before {
    background: var(--success);
  }
  .cfoot {
    margin-top: 9px;
    width: 100%;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px;
    border-radius: 7px;
  }
  .cfoot.solid {
    background: var(--primary);
    color: var(--primary-foreground);
  }

  /* ── Crossref ──────────────────────────────────────────────── */
  /* A wrapping sentence must not be laid out as flex siblings: each fragment
     became its own column and the line read as three broken stacks. It is one
     paragraph, with the link on its own row. */
  .crossref {
    display: block;
    width: 100%;
    line-height: 1.45;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted-foreground);
    font-size: 12px;
    text-align: left;
    padding: 10px 11px;
    border-radius: 8px;
  }
  .crossref b {
    color: var(--foreground);
    font-weight: 600;
  }
  .crossref span {
    display: block;
    margin-top: 6px;
    color: var(--primary);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── Grid tiles ────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  @media (min-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }
  }
  .tile {
    position: relative;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    display: block;
    width: 100%;
  }
  .tile .p {
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 6px;
    font-size: 30px;
    line-height: 1;
    overflow: hidden;
    background: var(--muted);
  }
  .tile .nm {
    display: block;
    font-size: 11px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .fr {
    display: block;
    font-size: 10px;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .bdg {
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    background: var(--warning);
    color: var(--primary-foreground);
  }
  .tile.off .p {
    opacity: 0.42;
  }
  .tile.off .nm {
    opacity: 0.55;
  }

  /* ── Suggestion card (Découvrir) ───────────────────────────── */
  .sug {
    display: flex;
    gap: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 10px;
  }
  .sug .p {
    flex: 0 0 auto;
    /* A flex item stretches to the line's cross size by default, which
       overrides `aspect-ratio` on the height — the posters rendered at 0.47
       and 0.53 instead of 0.667, and taller cards stretched them further. */
    align-self: flex-start;
    width: 62px;
    aspect-ratio: 2/3;
    border-radius: 5px;
    background: var(--muted);
    overflow: hidden;
    font-size: 19px;
    padding: 0;
    border: 0;
  }
  .sug .b {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  /* R5 — une classe posée sur un <span> DÉCLARE son display. Sans ça, le
     titre repartageait sa ligne avec l'année, le type et la note : la
     violation littérale de la règle gravée §12 (ligne 1 = le titre, seul). */
  .sug .t {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sug .m {
    display: block;
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 2px;
  }
  .sug .why {
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 5px;
    border-left: 2px solid var(--border);
    padding-left: 8px;
    line-height: 1.4;
  }
  .sug .why b {
    color: var(--foreground);
    font-weight: 600;
  }
  .sugacts {
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }
  .sugacts button {
    flex: 1;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    white-space: nowrap;
  }
  .sugacts button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .sugacts button.ghost {
    color: var(--muted-foreground);
  }

  /* ── Carte Découvrir : glissée des deux côtés = pas intéressé ── */
  .sugwrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    touch-action: pan-y;
  }
  .sugwrap.gone {
    transition:
      height 0.28s ease,
      opacity 0.2s ease,
      margin 0.28s ease;
    height: 0 !important;
    opacity: 0;
    margin-bottom: -14px;
  }
  .sugback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-radius: 8px;
    background: var(--muted);
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 700;
  }
  .sugback span {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sugback svg {
    width: 16px;
    height: 16px;
  }
  .sug {
    position: relative;
    display: flex;
    gap: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 10px;
    transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .sug.dragging {
    transition: none;
  }
  .sbody {
    min-width: 0;
    flex: 1;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    display: block;
  }
  .sugnote {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    border: 1px solid color-mix(in oklab, var(--success) 40%, transparent);
    color: var(--success);
    margin-left: 6px;
  }

  /* ── Key/value rows (Système) ──────────────────────────────── */
  .panel {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 2px 11px;
  }
  .kv {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .kv:last-child {
    border-bottom: 0;
  }
  .kv span:first-child {
    color: var(--muted-foreground);
  }
  .kv span:last-child {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .h2 {
    font-size: 12.5px;
    font-weight: 700;
    margin: 0;
  }

  /* ── Live strip ────────────────────────────────────────────── */
  .live {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    background: var(--card);
  }
  .live .d {
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: var(--info);
    flex: 0 0 auto;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live .d {
      animation: pulse 1.6s ease-in-out infinite;
    }
  }
  @keyframes pulse {
    50% {
      opacity: 0.3;
    }
  }
  .live b {
    color: var(--foreground);
    font-weight: 600;
  }

  /* ── Pull to refresh ───────────────────────────────────────── */
  .ptr {
    display: grid;
    place-items: center;
    overflow: hidden;
    height: 0;
    transition: height 0.22s ease;
    color: var(--muted-foreground);
  }
  .ptr.armed {
    color: var(--primary);
  }
  .ptr .spin {
    width: 16px;
    height: 16px;
    border-radius: 99px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
  }
  .ptr.loading .spin {
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ── FAB ───────────────────────────────────────────────────── */
  .fab {
    position: absolute;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom) + 74px);
    width: 52px;
    height: 52px;
    border-radius: 99px;
    border: 0;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid;
    place-items: center;
    box-shadow: var(--mq-shadow-fab);
    z-index: 30;
  }
  .fab svg {
    width: 23px;
    height: 23px;
  }

  /* R8 — une règle `display` d'auteur BAT l'attribut `[hidden]`. Toute classe
     qui déclare un display doit donc déclarer son propre cas caché, sinon
     `el.hidden = true` ne cache rien. Constaté ici : le « + » restait visible
     sur Arrivées et Médiathèque. */
  .fab[hidden],
  .selbar[hidden],
  .live[hidden],
  .crossref[hidden],
  .chip[hidden] {
    display: none;
  }

  /* ── Bottom bar ────────────────────────────────────────────── */
  .bottombar {
    flex: 0 0 auto;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--sidebar);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 40;
  }
  .bottombar button {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--muted-foreground);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 2px 8px;
    position: relative;
  }
  .bottombar button[aria-current="page"] {
    color: var(--primary);
  }
  .bottombar svg {
    width: 19px;
    height: 19px;
  }
  .bottombar .lb {
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .navbadge {
    position: absolute;
    top: 5px;
    left: calc(50% + 6px);
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 99px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: grid;
    place-items: center;
    box-shadow: 0 0 0 2px var(--sidebar);
  }

  /* ── Screens (résolution, fiche) ───────────────────────────── */
  .screen {
    position: absolute;
    inset: 0;
    background: var(--background);
    z-index: 45;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
    visibility: hidden;
  }
  .screen.open {
    transform: none;
    visibility: visible;
  }
  .fichebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .fback {
    display: flex;
    align-items: center;
    gap: 5px;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 2px;
  }
  .fback svg {
    width: 16px;
    height: 16px;
  }
  .screen .port {
    padding-bottom: 24px;
  }

  /* ── Bottom sheet ──────────────────────────────────────────── */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--mq-scrim);
    z-index: 46;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s;
  }
  .scrim.open {
    opacity: 1;
    visibility: visible;
  }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 47;
    background: var(--popover);
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    max-height: 78%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
    visibility: hidden;
  }
  .sheet.open {
    transform: none;
    visibility: visible;
  }
  .sheet.dragging {
    transition: none;
  }
  .sheetgrab {
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: var(--border);
    margin: 10px auto 8px;
    flex: 0 0 auto;
  }
  .sheetin {
    overflow-y: auto;
    padding: 2px 14px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheettitle {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }
  .sheetmeta {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-bottom: 14px;
  }
  .sheetacts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 4px 0 14px;
  }
  .sheetacts.secondary {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .sact {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    font-size: 13.5px;
    font-weight: 500;
    padding: 11px 12px;
    border-radius: 8px;
    text-align: left;
  }
  .sact.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
    font-weight: 600;
  }
  .sact.danger {
    color: var(--danger);
  }
  .sact svg {
    width: 16px;
    height: 16px;
    color: var(--muted-foreground);
    flex: 0 0 auto;
  }
  .sact.primary svg {
    color: var(--primary-foreground);
  }

  /* ── Matrice de saisons (feuille de détail d'un suivi) ─────────
     Géométrie reprise du composant livré : cellule 31 × 27, radius 5, mono
     11 semibold, fond du ton à 20 %. Le « non vérifié » est un fantôme en
     pointillés, pas une couleur : l'absence de verdict n'est pas un état. */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--muted-foreground);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .legend i {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    display: block;
  }
  .sw-success {
    background: color-mix(in oklab, var(--success) 60%, transparent);
  }
  .sw-warning {
    background: color-mix(in oklab, var(--warning) 60%, transparent);
  }
  .sw-info {
    background: color-mix(in oklab, var(--info) 60%, transparent);
  }
  .sw-waiting {
    background: color-mix(in oklab, var(--waiting) 60%, transparent);
  }
  .sw-upcoming {
    background: color-mix(in oklab, var(--upcoming) 60%, transparent);
  }
  .sw-muted {
    border: 1px dashed var(--border);
    background: transparent;
  }
  .season {
    border-top: 1px solid var(--border);
    padding: 8px 0;
  }
  .season:first-of-type {
    border-top: 0;
  }
  .season > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-foreground);
    list-style: none;
  }
  .season > summary::-webkit-details-marker {
    display: none;
  }
  .season > summary::before {
    content: "▸";
    font-size: 9px;
    transition: transform 0.15s;
  }
  .season[open] > summary::before {
    transform: rotate(90deg);
  }
  .season .sfr {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--foreground);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: normal;
  }
  .season .miss {
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 99px;
    text-transform: none;
    letter-spacing: normal;
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .eps {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .ep {
    display: grid;
    place-items: center;
    width: 31px;
    height: 27px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    border: 0;
  }
  .ep.en_mediatheque {
    background: color-mix(in oklab, var(--success) 20%, transparent);
    color: var(--success);
  }
  .ep.a_recuperer {
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .ep.en_acquisition {
    background: color-mix(in oklab, var(--info) 20%, transparent);
    color: var(--info);
  }
  .ep.en_attente {
    background: color-mix(in oklab, var(--waiting) 20%, transparent);
    color: var(--waiting);
  }
  .ep.annonce {
    background: color-mix(in oklab, var(--upcoming) 20%, transparent);
    color: var(--upcoming);
  }
  .ep.non_verifie {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted-foreground);
  }
  .sheetposter {
    flex: 0 0 auto;
    width: 84px;
    aspect-ratio: 2/3;
    border-radius: 6px;
    overflow: hidden;
    font-size: 26px;
    background: var(--muted);
  }
  .sheetposter img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── Écran d'ajout (« + ») ─────────────────────────────────────── */
  .addform {
    padding: 12px 14px 0;
  }
  .addrow {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btnprimary {
    flex: 0 0 auto;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 13px;
    font-weight: 600;
    padding: 0 16px;
  }
  .btnprimary:disabled {
    opacity: 0.5;
  }
  .segmini {
    display: flex;
    gap: 3px;
    padding: 3px;
    background: var(--muted);
    border-radius: 8px;
  }
  .segmini button {
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
  }
  .segmini button[aria-pressed="true"] {
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--mq-shadow-vsw);
  }
  .rescount {
    padding: 12px 14px 0;
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .reslist {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 14px 18px;
  }
  .res {
    display: flex;
    gap: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 10px;
  }
  .res .rp {
    flex: 0 0 auto;
    align-self: flex-start;
    width: 54px;
    aspect-ratio: 2/3;
    border-radius: 5px;
    overflow: hidden;
    background: var(--muted);
    font-size: 16px;
  }
  .res .rb {
    min-width: 0;
    flex: 1;
  }
  .res .rt {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
  }
  .res .rm {
    display: block;
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 2px;
  }
  .res .ro {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 5px;
    line-height: 1.4;
  }
  .resbtn {
    margin-top: 9px;
    width: 100%;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px;
    border-radius: 7px;
  }
  .resbtn.done {
    border-color: var(--border);
    color: var(--muted-foreground);
    opacity: 0.7;
  }
  .resbtn.owned {
    border-color: var(--warning);
    color: var(--warning);
  }
  .sugg {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 14px 0;
  }
  .sugg button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 99px;
  }
  .byid {
    margin: 14px 14px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .byid > summary {
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .byid > summary::-webkit-details-marker {
    display: none;
  }
  .byid > summary::before {
    content: "▸ ";
    font-size: 10px;
  }
  .byid[open] > summary::before {
    content: "▾ ";
  }
  .byidin {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .whyoff {
    font-size: 11.5px;
    color: var(--danger);
  }
  .addfoot {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px calc(env(safe-area-inset-bottom) + 11px);
    background: var(--popover);
    border-top: 1px solid var(--border);
    font-size: 12.5px;
  }
  .addfoot button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-weight: 600;
    font-size: 12.5px;
  }

  /* ── Dialog ────────────────────────────────────────────────── */
  .dlg {
    position: absolute;
    left: 16px;
    right: 16px;
    top: 50%;
    z-index: 48;
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--mq-shadow-dlg);
    transform: translateY(-50%) scale(0.96);
    opacity: 0;
    visibility: hidden;
    transition:
      opacity 0.18s,
      transform 0.18s;
  }
  .dlg.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) scale(1);
  }
  .dlg h3 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 700;
  }
  .dlg p {
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted-foreground);
  }
  .dryrun {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--info);
    border: 1px solid color-mix(in oklab, var(--info) 40%, transparent);
    border-radius: 7px;
    padding: 8px 10px;
    margin-bottom: 11px;
  }
  .dryrun svg {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
  }
  .manifest {
    list-style: none;
    margin: 0 0 11px;
    padding: 0;
    font-size: 12px;
  }
  .manifest li {
    display: flex;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted-foreground);
  }
  .manifest li:last-child {
    border-bottom: 0;
  }
  .manifest b {
    color: var(--foreground);
    font-weight: 600;
    margin-left: auto;
    white-space: nowrap;
  }
  .warnbox {
    border: 1px solid color-mix(in oklab, var(--warning) 45%, transparent);
    background: color-mix(in oklab, var(--warning) 8%, transparent);
    border-radius: 7px;
    padding: 9px 10px;
    font-size: 12px;
    line-height: 1.45;
    margin-bottom: 11px;
  }
  .warnbox b {
    color: var(--warning);
  }
  .dlgacts {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .dlgbtn {
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
  }
  .dlgbtn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .dlgbtn.ghost {
    color: var(--muted-foreground);
    border-color: transparent;
  }

  /* ── Toast ─────────────────────────────────────────────────── */
  .toast {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom) + 74px);
    z-index: 49;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 12px;
    font-size: 12.5px;
    box-shadow: 0 8px 26px rgb(0 0 0/0.5);
    transform: translateY(14px);
    opacity: 0;
    visibility: hidden;
    transition:
      opacity 0.2s,
      transform 0.2s;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  .toast button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--muted-foreground);
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .toast svg {
    width: 14px;
    height: 14px;
  }

  /* ── Empty / note ──────────────────────────────────────────── */
  .empty {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 18px 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted-foreground);
    line-height: 1.5;
  }
  .empty b {
    display: block;
    color: var(--foreground);
    font-size: 13px;
    margin-bottom: 4px;
  }

  /* ── États de surface : chargement, vide, erreur ──────────────
     Une surface qui charge le DIT (squelettes de la bonne forme, jamais un
     « Chargement… » nu) ; une surface vide dit POURQUOI et propose une sortie
     (DOIT-7) ; une surface en erreur nomme la cause et propose de réessayer
     (§8, NE-DOIT-PAS-5). */
  .skcard {
    height: 62px;
    border-radius: 8px;
  }
  .skline {
    height: 13px;
    border-radius: 4px;
  }
  .surferr {
    border: 1px solid color-mix(in oklab, var(--danger) 45%, transparent);
    background: color-mix(in oklab, var(--danger) 8%, transparent);
    border-radius: 8px;
    padding: 14px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .surferr b {
    display: block;
    color: var(--danger);
    margin-bottom: 4px;
  }
  .surferr button {
    margin-top: 11px;
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px;
    border-radius: 7px;
  }

      r: "Aucun fichier vidéo dans le dossier : seulement 3 fichiers .nfo et une archive .rar non extraite.",

  ];
  const MOVING = [
    {

  const SETTLED = [
    { t: "The Bombing of Pan Am 103", s: "S01E05 · Disk2 · 14 h 12" },

  ];

  const STRIP_LABELS = ["pris", "téléch.", "ingéré", "scrapé", "rangé"];

  /* ── État ────────────────────────────────────────────────────── */
  const S = {
    page: "acq",
    acqTab: "maintenant",
    libLens: "cat",
    libCat: "all",
    libMode: "grid",
    scen: "reel",
    phase: "prete",
    tmdb: true,

    followMode: "list",
    pill: "tout",
    notes: false,
    libCount: 24,

    selected: new Set(),
    libLoading: false,

  /* ── Rendu : briques ─────────────────────────────────────────── */
  function stripHTML(states) {
    return `<div class="strip">${states
      .map((s, i) => {
        const cls =
          s === 1
            ? "done"
            : s === "now"
              ? "now"
              : s === "blocked"
                ? "blocked"
                : "";
        return `<div class="st ${cls}"><span class="d"></span><span class="l">${STRIP_LABELS[i]}</span></div>`;
      })
      .join("")}</div>`;
  }
  function chipHTML(c) {
    return c ? `<span class="chip ${c[0]}">${esc(c[1])}</span>` : "";
  }

  function cardHTML(o, opts) {
    opts = opts || {};
    const poster = o.noposter
      ? `<span class="poster" title="Média non identifié — pas de fiche disponible"><span class="pfall"><b>?</b></span></span>`
      : `<button class="poster" aria-label="Fiche de ${esc(o.t)}" data-fiche="${esc(o.t)}">${posterBox(o.t, o.k)}</button>`;
    return `<div class="card">
    <div class="ctop">${poster}
      <button class="cbody" data-sheet="${esc(o.t)}">
        <span class="ctitle">${esc(o.t)}</span>
        ${o.s ? `<span class="csub">${esc(o.s)}</span>` : ""}
        ${o.r ? `<span class="creason">${esc(o.r)}</span>` : ""}
        <span class="cmeta">${o.f ? `<span class="frac">${esc(o.f)}</span>` : ""}${chipHTML(o.chip)}</span>
      </button>
    </div>
    ${o.strip ? stripHTML(o.strip) : ""}
    ${opts.foot ? `<button class="cfoot ${opts.footSolid ? "solid" : ""}" data-act="${esc(opts.footAct || "")}">${esc(opts.foot)}</button>` : ""}
  </div>`;
  }

  function swipeHTML(inner, actions) {
    return `<div class="swipe"><div class="actions"><div class="side right">${actions}</div></div>${inner}</div>`;
  }

  /* Une section vide ne se rend pas — mais une VUE vide se dit, avec ce qui
     l'explique (§3, DOIT-7 : jamais d'écran vide, jamais de cul-de-sac). */
  function emptyHTML(titre, corps) {
    return `<div class="empty"><b>${esc(titre)}</b>${corps}</div>`;
  }

  function secHTML(pip, title, count, inner, note) {
    if (String(count) === "0" || inner === "") return "";
    return `<section class="sec">
    <div class="sechead"><span class="pip ${pip}"></span><span class="t">${esc(title)}</span><span class="k">${count}</span></div>
    ${note ? `<div class="note">${note}</div>` : ""}
    ${inner}
  </section>`;
  }

  /* Jeux de données actifs, résolus par scénario. Le reste du code ne sait
     pas quel scénario tourne — il lit ces accesseurs. */
  const D = {
    takeable: () => (S.scen === "reel" ? [] : TAKEABLE),
    blocked: () => (S.scen === "reel" ? [] : BLOCKED),
    inflight: () => (S.scen === "reel" ? [] : INFLIGHT),
    notfound: () => (S.scen === "reel" ? NOTFOUND_REEL : NOTFOUND),
    doneToday: () => (S.scen === "reel" ? [] : DONE_TODAY),
    stuck: () => (S.scen === "reel" ? STUCK_REEL : STUCK),
    moving: () => (S.scen === "reel" ? [] : MOVING),
    settled: () => (S.scen === "reel" ? [] : SETTLED),
  };

  /* ── Trois phases par surface, pilotées par le harnais ────────────────
     `prete` (défaut), `chargement`, `erreur`. Toute surface passe par les
     trois : c'est ce que « chaque écran ET chaque état » veut dire, et c'est
     ce que la sonde de parité doit pouvoir atteindre de façon déterministe. */
  function skelCards(n) {
    return `<div class="sec">${'<div class="sk skcard"></div>'.repeat(n)}</div>`;
  }
  function skelTiles(n) {
    return `<div class="grid">${'<div class="sk tile"></div>'.repeat(n)}</div>`;
  }
  function surfErr(quoi) {
    return `<div class="surferr"><b>Impossible de charger ${esc(quoi)}.</b>
      Le serveur n'a pas répondu dans le temps imparti. Rien n'est perdu — ce qui
      est affiché ailleurs reste valide.
      <button data-phase="prete">Réessayer</button></div>`;
  }

  /* ── Vues ────────────────────────────────────────────────────── */
  function viewAcquisition() {
    const tabs = [
      { id: "maintenant", l: "En cours", n: D.takeable().length + D.blocked().length },
      { id: "suivis", l: "Suivis" },
      { id: "decouvrir", l: "Découvrir" },
    ];
    let head = `<div class="viewtabs">
    <div class="seg" role="tablist">${tabs
      .map(
        (t) => `
      <button role="tab" aria-selected="${S.acqTab === t.id}" data-acqtab="${t.id}">${t.l}${t.n ? `<span class="n">${t.n}</span>` : ""}</button>`,
      )
      .join("")}
    </div>
    <button class="more" aria-label="Plus — veille et obligations" data-sheet="plus">${svg(I.more)}</button>
  </div>`;

    if (S.acqTab === "maintenant") {
      const tk = D.takeable(), bl = D.blocked(), fl = D.inflight(),
        nf = D.notfound(), dn = D.doneToday();
      const rien = tk.length + bl.length + fl.length + nf.length + dn.length === 0;
      if (S.phase !== "prete")
        return (
          head +
          `<div class="body">${S.phase === "erreur" ? surfErr("ce qui vous attend") : skelCards(4)}</div>`
        );
      return (
        head +
        `<div class="body">
      <div class="note"><b>Vue « En cours » — livrée, inchangée.</b> Elle sert de référence de langage aux trois autres pages : cinq sections d'urgence, une pastille de couleur par section, un compteur qui EST son propre lien.</div>
      ${
        rien
          ? emptyHTML(
              "Rien ne vous attend.",
              "Aucun média à récupérer, aucun blocage, rien en vol. Vos <b>12</b> suivis sont surveillés — la prochaine recherche automatique est à 15 h 20.",
            )
          : ""
      }
      ${secHTML("warning", "À récupérer", String(tk.length), tk.map((o) => cardHTML(o, { foot: "Récupérer maintenant", footSolid: true })).join(""))}
      ${secHTML("danger", "À traiter", String(bl.length), bl.map((o) => cardHTML(o, { foot: "Résoudre →" })).join(""))}
      ${
        D.stuck().length > 0
          ? `<button class="crossref" data-go="arr">${bl.length > 0 ? "Ces items viennent d'une acquisition. " : ""}<b>${D.stuck().length}</b> média${D.stuck().length > 1 ? "s" : ""} à traiter ${D.stuck().length > 1 ? "sont entrés" : "est entré"} sans suivi. <span>Arrivées →</span></button>`
          : ""
      }
      ${secHTML("info", "En vol", String(fl.length), fl.map((o) => cardHTML(o)).join(""))}
      ${secHTML(
        "waiting",
        "Cherché, rien trouvé",
        String(nf.length),
        nf.map((o) => cardHTML(o)).join(""),
        "<b>§14.1 — un état de repos légitime.</b> « Cherché sans succès » n'est pas « pas encore regardé ». La carte donne la date de la prochaine recherche, jamais un silence. C'est l'état réel de vos quatre films suivis.",
      )}
      ${secHTML("success", "Rangé aujourd'hui", String(dn.length), dn.map((o) => cardHTML(o)).join(""))}
    </div>`
      );
    }

    if (S.acqTab === "suivis") {
      const pills = [
        { id: "tout", l: "Tout", n: FOLLOWS.length },
        { id: "series", l: "Séries", n: FOLLOWS.filter((o) => o.k !== "movie").length },
        { id: "films", l: "Films", n: FOLLOWS.filter((o) => o.k === "movie").length },
        { id: "pause", l: "En pause", n: FOLLOWS.filter((o) => o.st === "disabled").length },
      ];
      const match = (o) =>
        S.pill === "tout" ||
        (S.pill === "series" && o.k !== "movie") ||
        (S.pill === "films" && o.k === "movie") ||
        (S.pill === "pause" && o.st === "disabled");
      const terme = S.filtre.trim().toLocaleLowerCase();
      const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase();
      const matchNom = (o) => terme === "" || norm(o.t).includes(norm(terme));
      const visible = FOLLOWS.filter((o) => match(o) && matchNom(o)).sort(
        (a, b) =>
          (a.fresh ? 0 : 1) - (b.fresh ? 0 : 1) ||
          URGENCY[a.st] - URGENCY[b.st] ||
          a.t.localeCompare(b.t, "fr"),
      );

      /* Ligne méta : fraction (mono) · pastille de statut · légende chiffrée.
         En mode « groupé » le statut QUITTE la ligne — il vit dans l'en-tête
         de section (§12 : rien ne se répète). */
      const metaOf = (o, showStatus) => {
        const bits = [];
        const fr = stFraction(o);
        if (fr != null) bits.push(`<span class="frac">${fr}</span>`);
        if (showStatus) bits.push(`<span class="chip ${ST_TONE[o.st]}">${esc(stLabel(o))}</span>`);
        if (o.st === "en_attente")
          bits.push(`<span class="caption">${o.k === "movie" ? "1 en attente" : "en attente"}</span>`);
        if (o.fresh) bits.push(`<span class="freshtag">Nouveau</span>`);
        return bits.join("");
      };

      const rowOf = (o, showStatus) =>
        swipeHTML(
          `<div class="card${o.fresh ? " fresh" : ""}">
            <div class="ctop">
              <button class="poster" data-fiche="${esc(o.t)}" aria-label="Fiche de ${esc(o.t)}">${posterBox(o.t, o.k)}</button>
              <button class="cbody" data-sheet="${esc(o.t)}">
                <span class="ctitle">${esc(o.t)}</span>
                <span class="cmeta">${metaOf(o, showStatus)}</span>
              </button>
            </div>
          </div>`,
          o.k === "movie"
            ? `<button class="act pause">${svg(I.x)}Ne plus chercher</button><button class="act remove">${svg(I.trash)}Retirer</button>`
            : `<button class="act pause">${svg(I.x)}Pause</button><button class="act remove">${svg(I.trash)}Retirer</button>`,
        );

      const tileOf = (o) => {
        const b = gridBadge(o);
        const fr = stFraction(o) ?? (o.st === "disabled" ? "en pause" : String(o.y));
        return `<button class="tile${o.st === "disabled" ? " off" : ""}" data-sheet="${esc(o.t)}">
          <span class="p">${posterBox(o.t, o.k)}</span>
          ${b ? `<span class="tilebadge" style="background:var(--${b.tone === "muted" ? "neutral-signal" : b.tone === "en_attente" ? "waiting" : b.tone === "en_acquisition" ? "info" : "warning"})">${b.txt}</span>` : ""}
          <span class="nm">${esc(o.t)}</span>
          <span class="fr">${esc(fr)}</span>
        </button>`;
      };

      let content;
      if (S.phase === "chargement") {
        content = skelCards(5);
      } else if (S.phase === "erreur") {
        content = surfErr("vos suivis");
      } else if (visible.length === 0) {
        content = emptyHTML(
          terme !== ""
            ? `Aucun suivi ne contient « ${esc(S.filtre)} ».`
            : S.pill === "pause"
              ? "Aucun suivi en pause."
              : "Aucun suivi.",
          terme !== ""
            ? `Sur vos <b>${FOLLOWS.length}</b> suivis, aucun ne porte ce nom. Le filtre ignore la casse et les accents.`
            : S.pill === "pause"
              ? "Mettre un suivi en pause l'arrête sans le supprimer : il reste ici, et se réactive d'un geste."
