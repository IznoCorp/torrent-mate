  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior-y: none;
  }
  body {
    background: oklch(0.12 0.004 286);
    color: var(--foreground);
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  :root[data-theme="light"] body {
    background: oklch(0.93 0.002 286);
  }
  /* L'app hérite ça du preflight Tailwind ; la maquette doit le déclarer,
     sinon le lien de la marque s'affiche en bleu souligné. */
  a {
    color: inherit;
    text-decoration: none;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ── DÉVIATION DE HARNAIS, DÉCLARÉE ────────────────────────────────────
     La vraie barre du bas est `position: fixed` sur le viewport — ce qui est
     juste dans l'app, où le viewport EST le téléphone. Dans un cadre de
     téléphone inséré au milieu d'un écran large, `fixed` la collerait au bas
     de la FENÊTRE. La maquette la repositionne donc en `absolute` dans le
     cadre. C'est la SEULE divergence assumée du châssis, et la sonde de
     parité la porte comme une entrée d'allowlist justifiée — pas comme un
     écart qu'on découvre. Idem pour le « + » et la barre de sélection. */
  .device .bottombar,
  .device .fab,
  .device .selbar {
    position: absolute;
  }
  .device .bottombar {
    inset-inline: 0;
    bottom: 0;
  }

  /* Boutons du harnais — hors châssis, puisque le châssis est désormais une
     région MESURÉE et ne doit rien porter qui ne soit pas dans l'app.
     `window.__measure(true)` les efface avant toute capture. */
  .hbtn {
    position: fixed;
    top: 6px;
    right: 6px;
    z-index: 70;
    display: flex;
    gap: 4px;
  }
  .hbtn button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: color-mix(in oklab, var(--background) 80%, transparent);
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
    backdrop-filter: blur(4px);
  }
  .hbtn svg {
    width: 13px;
    height: 13px;
  }
  html.measuring .hbtn,
  html.measuring .toast,
  html.measuring .note {
    display: none !important;
  }
  @media (min-width: 520px) {
    .hbtn {
      top: 26px;
      right: calc(50% - 250px);
    }
  }

  /* ── Phone frame ───────────────────────────────────────────── */
  .stage {
    min-height: 100svh;
    display: grid;
    /* R7 — `minmax(0, 1fr)`, never `1fr`: an `auto` track's floor is the
       item's INTRINSIC size, so the horizontally-scrolling pill train inside
       the device sized the track to its max-content and blew the frame out
       to 910px at a 390px viewport. */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 0;
    overflow-x: clip;
  }
  .device {
    position: relative;
    width: 100%;
    max-width: 100%;
    height: 100svh;
    background: var(--background);
    display: flex;
    flex-direction: column;
    overflow: clip;
  }
  @media (min-width: 520px) {
    .stage {
      padding: 24px 16px;
    }
    .device {
      width: 390px;
      height: min(844px, calc(100svh - 48px));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgb(0 0 0/0.5);
    }
  }

  /* ═══════════════════════════════════════════════════════════════════════
     BLOC 2 — CSS DE L'APPLICATION.  C'EST CE QUI EST TRANSPLANTÉ.
     Chaque règle ci-dessous est destinée à `styles/ps/app-surface.css`, sous
     la portée `.tm`, par extraction MÉCANIQUE — jamais par recopie.
     ═══════════════════════════════════════════════════════════════════════ */

  /* ── Châssis — TRANSPLANTÉ DEPUIS L'APP, pas dessiné ici ──────────────
     Sens de la vérité INVERSÉ pour cette région : pour les pages, la maquette
     fait foi ; pour le châssis, c'est `layout/TopBar.tsx` et
     `layout/BottomTabBar.tsx` qui font foi. Ils ont été refondus, mesurés et
     prouvés pendant acq-mobile (cadre d'app, hauteurs mesurées, fin du
     tremblement iOS) — les redessiner rouvrirait des problèmes résolus.
     Les valeurs ci-dessous sont les leurs, converties depuis Tailwind.
     Toute évolution VOLONTAIRE du châssis doit être une exception nommée. */

  .topbar {
    position: relative;
    z-index: 40;
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  @media (min-width: 768px) {
    .topbar {
      padding-left: 24px;
      padding-right: 24px;
    }
  }
  .topbar .burger {
    margin-left: -4px;
    display: inline-flex;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
  }
  .topbar .burger svg {
    width: 20px;
    height: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .mk {
    width: 28px;
    height: 28px;
    color: var(--primary);
  }
  .brand .wm {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  .brand em {
    font-style: normal;
    color: var(--primary);
  }
  .topbar .sp {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* StatusDot, verbatim depuis components/ds/StatusDot.css */
  .ps-dot {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .ps-dot__d {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: var(--success);
  }
  /* Le libellé est masqué sous 640 px : à 390 px il ne s'affiche donc PAS —
     « Reconnexion… » déborderait l'en-tête. */
  .ps-dot__label {
    display: none;
  }
  @media (min-width: 640px) {
    .ps-dot__label {
      display: inline;
    }
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 9999px;
    border: 0;
    background: var(--muted);
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 500;
    display: grid;
    place-items: center;
  }

  /* ── Scrollport ────────────────────────────────────────────── */
  .port {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: clip;
    overscroll-behavior-y: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(env(safe-area-inset-bottom) + 74px);
  }

  /* ── View tabs (.seg + .more) ──────────────────────────────── */
  .viewtabs {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 14px 8px;
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--background);
  }
  .seg {
    flex: 1 1 auto;
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--muted);
    border-radius: 10px;
    min-width: 0;
  }
  .seg > button {
    flex: 1;
    min-width: 0;
    border: 0;
    padding: 9px 0;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--muted-foreground);
    transition:
      background 0.18s,
      color 0.18s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seg > button[aria-selected="true"] {
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--mq-shadow-seg);
  }
  .seg .n {
    font-size: 11px;
    font-weight: 700;
    margin-left: 5px;
    padding: 1px 5px;
    border-radius: 99px;
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .more {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
  }
  .more svg {
    width: 17px;
    height: 17px;
  }

  /* ── Filter zone ───────────────────────────────────────────── */
  .filters {
    padding: 0 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--muted);
    border-radius: 8px;
    padding: 0 10px;
  }
  .search svg {
    width: 15px;
    height: 15px;
    color: var(--muted-foreground);
    flex: 0 0 auto;
  }
  .search input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--foreground);
    font: inherit;
    font-size: 13px;
    padding: 9px 0;
    outline: none;
  }
  .search input::placeholder {
    color: var(--muted-foreground);
  }
  .pillbar {
    display: flex;
    align-items: center;
    gap: 0;
    margin-top: 8px;
  }
  .pillscroll {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    touch-action: pan-x pan-y;
    padding-right: 8px;
  }
  .pillscroll::-webkit-scrollbar {
    display: none;
  }
  .pill {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .pill[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .pill .c {
    opacity: 0.7;
    margin-left: 4px;
    font-weight: 500;
  }
  .pill.warn[aria-pressed="false"] {
    border-color: var(--warning);
    color: var(--warning);
  }
  .vswwrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 8px;
    background: var(--background);
  }
  .vswwrap::before {
    content: "";
    width: 1px;
    height: 22px;
    background: var(--border);
  }
  .vsw {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--muted);
    border-radius: 8px;
  }
  .vsw button {
    width: 32px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    display: grid;
    place-items: center;
  }
  .vsw button[aria-pressed="true"] {
    background: var(--background);
    color: var(--primary);
    box-shadow: var(--mq-shadow-vsw);
  }
  .vsw svg {
    width: 15px;
    height: 15px;
  }
  .countline {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px 0;
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .countline button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .countline svg {
    width: 13px;
    height: 13px;
  }

  /* ── Body / sections ───────────────────────────────────────── */
  .body {
    padding: 10px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sec {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sechead {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 2px 0;
    text-align: left;
  }
  .pip {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    flex: 0 0 auto;
  }
  .pip.warning {
    background: var(--warning);
  }
  .pip.danger {
    background: var(--danger);
  }
  .pip.info {
    background: var(--info);
  }
  .pip.waiting {
    background: var(--waiting);
  }
  .pip.success {
    background: var(--success);
  }
  .pip.neutral {
    background: var(--neutral-signal);
  }
  .sechead .t {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .sechead .k {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted-foreground);
  }

  /* ── Card ──────────────────────────────────────────────────── */
  .swipe {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    /* The row CLAIMS the horizontal axis. Without this the browser owns both
       axes, decides a drag is a pan, and fires `touchcancel` — the swipe then
       only ever works under synthetic events, which never get cancelled.
       Declared HERE and not on an ancestor: `touch-action` intersects down the
       whole chain, so a `pan-x` scroller under a `pan-y` ancestor pans on
       neither axis. */
    touch-action: pan-y;
  }
  .actions {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: stretch;
  }
  .actions .side {
    display: flex;
  }
  .actions .side.left {
    margin-right: auto;
  }
  .actions .side.right {
    margin-left: auto;
  }
  .act {
    border: 0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--mq-white);
    flex: 0 0 84px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 5px;
    text-align: center;
  }
  .act svg {
    width: 17px;
    height: 17px;
  }
  .act.grab {
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .act.pause {
    background: var(--muted);
    color: var(--foreground);
  }
  .act.remove {
    background: var(--danger);
    color: var(--mq-white);
  }
  .card {
    position: relative;
    display: flex;
    width: 100%;
    flex-direction: column;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 9px;
    transition: transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .card.dragging {
    transition: none;
  }
  .ctop {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 10px;
  }
  /* Anatomie EXACTE du MediaPoster livré : image de couverture si elle
     existe, sinon DEUX initiales en mono sur un dégradé accent/50 → card →
     muted, avec un filigrane d'icône à 5 % en bas à droite. Le prototype
     affichait une seule initiale sur un aplat — une approximation. */
  .poster {
    flex: 0 0 auto;
    width: 38px;
    aspect-ratio: 2/3;
    border-radius: 4px;
    background: var(--muted);
    overflow: hidden;
    font-size: 14px;
    padding: 0;
    border: 0;
  }
  .poster img,
  .tile .p img,
  .sug .p img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pfall {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(
      to bottom right,
      color-mix(in oklab, var(--accent) 50%, transparent),
      var(--card),
      var(--muted)
    );
  }
  .pfall svg {
    position: absolute;
    bottom: -14%;
    right: -11%;
    width: 66%;
    height: 66%;
    color: var(--foreground);
    opacity: 0.05;
  }
  .pfall b {
    position: relative;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1em;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: color-mix(in oklab, var(--muted-foreground) 90%, transparent);
  }
  .cbody {
    min-width: 0;
    flex: 1;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 0;
    display: block;
  }
  .ctitle {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .csub {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .creason {
    display: block;
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cmeta {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .frac {
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  /* Anatomie EXACTE du composant Chip livré : 11 px semibold, radius pilule,
     un point de 6 px de la couleur du ton, fond teinté à 20 %. Une pastille
     sans son point ou d'une autre taille est une dérive, pas une variante. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    border-radius: 99px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    line-height: 15px;
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .chip::before {
    content: "";
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: 99px;
    background: currentColor;
  }
  .chip.warning {
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .chip.success {
    background: color-mix(in oklab, var(--success) 20%, transparent);
    color: var(--success);
  }
  .chip.danger {
    background: color-mix(in oklab, var(--danger) 20%, transparent);
    color: var(--danger);
  }
  .chip.info {
    background: color-mix(in oklab, var(--info) 20%, transparent);
    color: var(--info);
  }
  .chip.waiting {
    background: color-mix(in oklab, var(--waiting) 20%, transparent);
    color: var(--waiting);
  }
  .caption {
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .freshtag {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    color: var(--primary-foreground);
    background: var(--primary);
    white-space: nowrap;
  }
  .cadence {
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 8px 14px 0;
  }
  .tilebadge {
    position: absolute;
    top: 5px;
    right: 5px;
    display: grid;
    place-items: center;
    height: 17px;
    min-width: 17px;
    padding: 0 4px;
    border-radius: 99px;
    border: 2px solid var(--background);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--mq-white);
  }

  /* journey strip — its own full-width line (R2) */
  .strip {
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0;
  }
  .st {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    min-width: 0;
  }
  .st .d {
    width: 9px;
    height: 9px;
    border-radius: 99px;
    background: var(--border);
    z-index: 1;
  }
  .st.done .d {
    background: var(--success);
  }
  .st.now .d {
    background: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 25%, transparent);
  }
  .st.blocked .d {
    background: var(--danger);
  }
  .st .l {
    font-size: 9.5px;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .st::before {
    content: "";
    position: absolute;
    top: 4px;
    left: -50%;
    width: 100%;
    height: 1px;
    background: var(--border);
  }
  .st:first-child::before {
    display: none;
  }
  .st.done::before,
  .st.now::before {
    background: var(--success);
  }
  .cfoot {
    margin-top: 9px;
    width: 100%;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px;
    border-radius: 7px;
  }
  .cfoot.solid {
    background: var(--primary);
    color: var(--primary-foreground);
  }

  /* ── Crossref ──────────────────────────────────────────────── */
  /* A wrapping sentence must not be laid out as flex siblings: each fragment
     became its own column and the line read as three broken stacks. It is one
     paragraph, with the link on its own row. */
  .crossref {
    display: block;
    width: 100%;
    line-height: 1.45;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted-foreground);
    font-size: 12px;
    text-align: left;
    padding: 10px 11px;
    border-radius: 8px;
  }
  .crossref b {
    color: var(--foreground);
    font-weight: 600;
  }
  .crossref span {
    display: block;
    margin-top: 6px;
    color: var(--primary);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── Grid tiles ────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  @media (min-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }
  }
  .tile {
    position: relative;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    display: block;
    width: 100%;
  }
  .tile .p {
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 6px;
    font-size: 30px;
    line-height: 1;
    overflow: hidden;
    background: var(--muted);
  }
  .tile .nm {
    display: block;
    font-size: 11px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .fr {
    display: block;
    font-size: 10px;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .bdg {
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    background: var(--warning);
    color: var(--primary-foreground);
  }
  .tile.off .p {
    opacity: 0.42;
  }
  .tile.off .nm {
    opacity: 0.55;
  }

  /* ── Suggestion card (Découvrir) ───────────────────────────── */
  .sug {
    display: flex;
    gap: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 10px;
  }
  .sug .p {
    flex: 0 0 auto;
    /* A flex item stretches to the line's cross size by default, which
       overrides `aspect-ratio` on the height — the posters rendered at 0.47
       and 0.53 instead of 0.667, and taller cards stretched them further. */
    align-self: flex-start;
    width: 62px;
    aspect-ratio: 2/3;
    border-radius: 5px;
    background: var(--muted);
    overflow: hidden;
    font-size: 19px;
    padding: 0;
    border: 0;
  }
  .sug .b {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  /* R5 — une classe posée sur un <span> DÉCLARE son display. Sans ça, le
     titre repartageait sa ligne avec l'année, le type et la note : la
     violation littérale de la règle gravée §12 (ligne 1 = le titre, seul). */
  .sug .t {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sug .m {
    display: block;
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 2px;
  }
  .sug .why {
    font-size: 11.5px;
    color: var(--muted-foreground);
    margin-top: 5px;
    border-left: 2px solid var(--border);
    padding-left: 8px;
    line-height: 1.4;
  }
  .sug .why b {
    color: var(--foreground);
    font-weight: 600;
  }
  .sugacts {
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }
  .sugacts button {
    flex: 1;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    white-space: nowrap;
  }
  .sugacts button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .sugacts button.ghost {
    color: var(--muted-foreground);
  }

  /* ── Carte Découvrir : glissée des deux côtés = pas intéressé ── */
  .sugwrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    touch-action: pan-y;
  }
  .sugwrap.gone {
    transition:
      height 0.28s ease,
      opacity 0.2s ease,
      margin 0.28s ease;
    height: 0 !important;
    opacity: 0;
    margin-bottom: -14px;
  }
  .sugback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-radius: 8px;
    background: var(--muted);
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 700;
  }
  .sugback span {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sugback svg {
    width: 16px;
    height: 16px;
  }
  .sug {
    position: relative;
    display: flex;
    gap: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 10px;
    transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .sug.dragging {
    transition: none;
  }
  .sbody {
    min-width: 0;
    flex: 1;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    display: block;
  }
  .sugnote {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    border: 1px solid color-mix(in oklab, var(--success) 40%, transparent);
    color: var(--success);
    margin-left: 6px;
  }

  /* ── Key/value rows (Système) ──────────────────────────────── */
  .panel {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 2px 11px;
  }
  .kv {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .kv:last-child {
    border-bottom: 0;
  }
  .kv span:first-child {
    color: var(--muted-foreground);
  }
  .kv span:last-child {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .h2 {
    font-size: 12.5px;
    font-weight: 700;
    margin: 0;
  }

  /* ── Live strip ────────────────────────────────────────────── */
  .live {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 11.5px;
    color: var(--muted-foreground);
    background: var(--card);
  }
  .live .d {
    width: 7px;
    height: 7px;
    border-radius: 99px;
    background: var(--info);
    flex: 0 0 auto;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live .d {
      animation: pulse 1.6s ease-in-out infinite;
    }
  }
  @keyframes pulse {
    50% {
      opacity: 0.3;
    }
  }
  .live b {
    color: var(--foreground);
    font-weight: 600;
  }

  /* ── Pull to refresh ───────────────────────────────────────── */
  .ptr {
    display: grid;
    place-items: center;
    overflow: hidden;
    height: 0;
    transition: height 0.22s ease;
    color: var(--muted-foreground);
  }
  .ptr.armed {
    color: var(--primary);
  }
  .ptr .spin {
    width: 16px;
    height: 16px;
    border-radius: 99px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
  }
  .ptr.loading .spin {
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ── FAB ───────────────────────────────────────────────────── */
  .fab {
    position: absolute;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom) + 74px);
    width: 52px;
    height: 52px;
    border-radius: 99px;
    border: 0;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid;
    place-items: center;
    box-shadow: var(--mq-shadow-fab);
    z-index: 30;
  }
  .fab svg {
    width: 23px;
    height: 23px;
  }

  /* R8 — une règle `display` d'auteur BAT l'attribut `[hidden]`. Toute classe
     qui déclare un display doit donc déclarer son propre cas caché, sinon
     `el.hidden = true` ne cache rien. Constaté ici : le « + » restait visible
     sur Arrivées et Médiathèque. */
  .fab[hidden],
  .selbar[hidden],
  .live[hidden],
  .crossref[hidden],
  .chip[hidden] {
    display: none;
  }

  /* ── Bottom bar — transplantée depuis BottomTabBar.tsx ──────────────── */
  html.selecting .bottombar {
    display: none;
  }
  .bottombar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 50;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--sidebar);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 768px) {
    .bottombar {
      display: none;
    }
  }
  .bottombar a,
  .bottombar button {
    display: flex;
    min-height: 44px;
    min-width: 0;
    flex: 1 1 0%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding-block: 8px;
    font-size: 12px;
    border: 0;
    background: transparent;
    color: var(--muted-foreground);
    transition: color 0.15s;
  }
  .bottombar button[aria-current="page"] {
    color: var(--primary);
  }
  .bottombar svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .bottombar .lb {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  /* Le badge est un EXPOSANT D'ANGLE sur l'icône — jamais un troisième enfant
     de flux, qui rendrait l'onglet plus haut (SHELL-2). */
  .bottombar .ic {
    position: relative;
    display: inline-flex;
  }
  .navbadge {
    position: absolute;
    right: -10px;
    top: -6px;
    display: inline-flex;
    height: 18px;
    min-width: 18px;
    align-items: center;
    justify-content: center;
    padding-inline: 4px;
    border-radius: 9999px;
    /* PRIMARY, pas danger : c'est la valeur de NavCountBadge. Le rouge est
       réservé au « ? » d'un compteur indisponible. */
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    outline: 2px solid var(--sidebar);
  }
  .navbadge.unknown {
    background: var(--danger);
    color: #fff;
  }

  /* ── Screens (résolution, fiche) ───────────────────────────── */
  .screen {
    position: absolute;
    inset: 0;
    background: var(--background);
    z-index: 45;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
    visibility: hidden;
  }
  .screen.open {
    transform: none;
    visibility: visible;
  }
  .fichebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .fback {
    display: flex;
    align-items: center;
    gap: 5px;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 2px;
  }
  .fback svg {
    width: 16px;
    height: 16px;
  }
  /* La barre d'onglets reste au-dessus d'un écran (elle est à z-50) : un
     écran doit donc réserver sa hauteur, sinon sa dernière action est collée
     dessous. C'est la règle R4 — on s'ancre à ce à quoi on appartient. */
  .screen .port {
    padding-bottom: calc(env(safe-area-inset-bottom) + 76px);
  }

  /* ── Bottom sheet ──────────────────────────────────────────── */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--mq-scrim);
    z-index: 46;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s;
  }
  .scrim.open {
    opacity: 1;
    visibility: visible;
  }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 47;
    background: var(--popover);
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    max-height: 78%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
    visibility: hidden;
  }
  .sheet.open {
    transform: none;
    visibility: visible;
  }
  .sheet.dragging {
    transition: none;
  }
  .sheetgrab {
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: var(--border);
    margin: 10px auto 8px;
    flex: 0 0 auto;
  }
  .sheetin {
    overflow-y: auto;
    padding: 2px 14px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheettitle {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }
  .sheetmeta {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-bottom: 14px;
  }
  .sheetacts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 4px 0 14px;
  }
  .sheetacts.secondary {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .sact {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    font-size: 13.5px;
    font-weight: 500;
    padding: 11px 12px;
    border-radius: 8px;
    text-align: left;
  }
  .sact.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
    font-weight: 600;
  }
  .sact.danger {
    color: var(--danger);
  }
  .sact svg {
    width: 16px;
    height: 16px;
    color: var(--muted-foreground);
    flex: 0 0 auto;
  }
  .sact.primary svg {
    color: var(--primary-foreground);
  }

  /* Transplantées depuis maquette-acquisition.css — utilisées sans avoir été
     portées, donc sans effet : le message « aucune bande-annonce » s'affichait
     en 14 px sans son encadré. */
  .nofiche {
    margin: 0 0 4px;
    font-size: 12px;
    color: var(--muted-foreground);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 11px;
  }
  .rulenote {
    margin: 0 0 14px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted-foreground);
    border-left: 2px solid var(--border);
    padding: 2px 0 2px 11px;
  }

  /* ── Fiche média — un SEUL gabarit pour tous ───────────────────────────
     Les différences entre un film et une série sont celles que leur nature
     impose, et rien d'autre : un film a un réalisateur et une durée, une série
     a un créateur, un statut et un catalogue d'épisodes. Tout le reste —
     hero, synopsis, distribution, bande-annonce, identifiants, médiathèque —
     est identique, dans le même ordre. Une donnée absente s'écrit
     « inconnu », jamais un tiret muet (§14.3). */
  .hero {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .hero .ht {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .hero .hm {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--muted-foreground);
    line-height: 1.55;
  }
  .hero .hn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 7px;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
  }
  .hero .hn svg {
    width: 13px;
    height: 13px;
  }
  .cast {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    /* `pan-x` SEUL interdit le pan vertical : un doigt posé sur le carrousel
       ne pouvait plus faire défiler la fiche, ce qui est exaspérant. On
       autorise les deux axes et on laisse le navigateur trancher par la
       direction du geste. Même correctif sur le train de pastilles. */
    touch-action: pan-x pan-y;
    padding-bottom: 2px;
  }
  .cast::-webkit-scrollbar {
    display: none;
  }
  .cast figure {
    flex: 0 0 auto;
    width: 74px;
    margin: 0;
  }
  .cast .ca img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cast .ca {
    width: 74px;
    height: 74px;
    border-radius: 9999px;
    background: var(--muted);
    display: grid;
    place-items: center;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 19px;
    font-weight: 600;
    color: var(--muted-foreground);
    overflow: hidden;
  }
  .cast figcaption {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.35;
  }
  .cast figcaption b {
    display: block;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cast figcaption span {
    display: block;
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trailer {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
  }
  .trailer .pl {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 9999px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid;
    place-items: center;
  }
  .trailer .pl svg {
    width: 14px;
    height: 14px;
  }
  .trailer small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted-foreground);
    margin-top: 1px;
  }
  .eprow {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .eprow:last-child {
    border-bottom: 0;
  }
  .eprow .en {
    flex: 0 0 auto;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted-foreground);
    min-width: 34px;
  }
  .eprow .et {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .eprow .ed {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
  }
  .eprow.avenir .et,
  .eprow.avenir .en {
    color: var(--upcoming);
  }

  /* ── Matrice de saisons (feuille de détail d'un suivi) ─────────
     Géométrie reprise du composant livré : cellule 31 × 27, radius 5, mono
     11 semibold, fond du ton à 20 %. Le « non vérifié » est un fantôme en
     pointillés, pas une couleur : l'absence de verdict n'est pas un état. */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--muted-foreground);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .legend i {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    display: block;
  }
  .sw-success {
    background: color-mix(in oklab, var(--success) 60%, transparent);
  }
  .sw-warning {
    background: color-mix(in oklab, var(--warning) 60%, transparent);
  }
  .sw-info {
    background: color-mix(in oklab, var(--info) 60%, transparent);
  }
  .sw-waiting {
    background: color-mix(in oklab, var(--waiting) 60%, transparent);
  }
  .sw-upcoming {
    background: color-mix(in oklab, var(--upcoming) 60%, transparent);
  }
  .sw-muted {
    border: 1px dashed var(--border);
    background: transparent;
  }
  .season {
    border-top: 1px solid var(--border);
    padding: 8px 0;
  }
  .season:first-of-type {
    border-top: 0;
  }
  .season > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-foreground);
    list-style: none;
  }
  .season > summary::-webkit-details-marker {
    display: none;
  }
  .season > summary::before {
    content: "▸";
    font-size: 9px;
    transition: transform 0.15s;
  }
  .season[open] > summary::before {
    transform: rotate(90deg);
  }
  .season .sfr {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--foreground);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: normal;
  }
  .season .miss {
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 99px;
    text-transform: none;
    letter-spacing: normal;
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .eps {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .ep {
    display: grid;
    place-items: center;
    width: 31px;
    height: 27px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    border: 0;
  }
  .ep.en_mediatheque {
    background: color-mix(in oklab, var(--success) 20%, transparent);
    color: var(--success);
  }
  .ep.a_recuperer {
    background: color-mix(in oklab, var(--warning) 20%, transparent);
    color: var(--warning);
  }
  .ep.en_acquisition {
    background: color-mix(in oklab, var(--info) 20%, transparent);
    color: var(--info);
  }
  .ep.en_attente {
    background: color-mix(in oklab, var(--waiting) 20%, transparent);
    color: var(--waiting);
  }
  .ep.annonce {
    background: color-mix(in oklab, var(--upcoming) 20%, transparent);
    color: var(--upcoming);
  }
  .ep.non_verifie {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted-foreground);
  }
  .sheetposter {
    flex: 0 0 auto;
    width: 84px;
    aspect-ratio: 2/3;
    border-radius: 6px;
    overflow: hidden;
    font-size: 26px;
    background: var(--muted);
  }
  .sheetposter img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── Écran d'ajout (« + ») ─────────────────────────────────────── */
