        );
      } else if (S.followMode === "grid") {
        content = `<div class="grid">${visible.map(tileOf).join("")}</div>`;
      } else if (S.followMode === "group") {
        content = GROUPS.map((g) => {
          const items = visible.filter((o) => g.of.includes(o.st));
          if (items.length === 0) return "";
          // Un groupe hétérogène GARDE la pastille sur ses cartes : son en-tête
          // ne peut pas dire laquelle de ses trois valeurs chaque carte porte.
          const showStatus = g.of.length > 1;
          return `<section class="sec">
            <div class="sechead"><span class="pip ${g.pip}"></span><span class="t">${g.l}</span><span class="k">${items.length}</span></div>
            ${items.map((o) => rowOf(o, showStatus)).join("")}
          </section>`;
        }).join("");
      } else {
        content = `<div class="sec">${visible.map((o) => rowOf(o, true)).join("")}</div>`;
      }

      return (
        head +
        `<div class="filters">
      <div class="search">${svg(I.search)}<input type="search" id="follq" value="${esc(S.filtre)}" placeholder="Filtrer par nom" aria-label="Filtrer les suivis">${S.filtre ? `<button class="searchclear" data-clearq="foll" aria-label="Effacer">${svg(I.x)}</button>` : ""}</div>
      <div class="pillbar">
        <div class="pillscroll">${pills.map((x) => `<button class="pill" aria-pressed="${S.pill === x.id}" data-pill="${x.id}">${x.l}<span class="c">${x.n}</span></button>`).join("")}</div>
        <div class="vswwrap"><div class="vsw">
          <button aria-pressed="${S.followMode === "list"}" data-fmode="list" aria-label="Liste">${svg(I.list)}</button>
          <button aria-pressed="${S.followMode === "group"}" data-fmode="group" aria-label="Groupé">${svg(I.group)}</button>
          <button aria-pressed="${S.followMode === "grid"}" data-fmode="grid" aria-label="Grille">${svg(I.grid)}</button>
        </div></div>
      </div>
    </div>
    <p class="cadence">Recherche automatique : 20 3,15 * * *</p>
    <div class="body">
      <div class="note"><b>Vue livrée, reprise à la lettre.</b> Trois modes (liste · groupé · grille), pastille à point sur fond teinté à 20 %, ligne méta = fraction puis statut puis légende chiffrée, aucun sous-titre : l'année vit dans la fiche. Les 12 suivis affichés sont les vôtres, avec leur état réel.</div>
      <div class="note"><b>Un défaut que cette reprise fait apparaître.</b> La cadence s'affiche telle que le planificateur la renvoie — <code>20 3,15 * * *</code>. Une expression cron sur une carte de téléphone, c'est du jargon brut : NE-DOIT-PAS-4. À traduire en « deux fois par jour, à 3 h 20 et 15 h 20 ».</div>
      ${content}
    </div>`
      );
    }

    return (
      head +
      `<div class="body">
    <div class="note"><b>Vue neuve.</b> La reco vit ici parce qu'elle débouche sur « Suivre » — l'action du (+) juste à côté. Le badge de la barre ne la compte jamais : elle n'attend rien de vous.</div>
    ${
      S.tmdb
        ? `<div class="live"><span class="d"></span><span>Réserve remplie il y a 2 h · <b>503</b> suggestions · <b>1 832</b> ids TMDB possédés exclus</span></div>`
        : `<div class="surferr" style="border-color:color-mix(in oklab,var(--warning) 45%,transparent);background:color-mix(in oklab,var(--warning) 8%,transparent)">
             <b style="color:var(--warning)">Compte TMDB non connecté.</b>
             Sans lui, deux choses manquent : vos <b>notes</b> — donc on ne peut pas savoir ce que vous avez déjà vu sans le posséder — et les recommandations personnalisées que TMDB calcule pour vous.
             <br><br>La vue ne se vide pas pour autant : ci-dessous, les <b>similaires</b> de ce que vous possédez, filtrés de votre médiathèque et de vos suivis. C'est moins fin, et c'est dit.
             <button data-tmdb="1">Connecter mon compte TMDB</button>
           </div>`
    }
    <div class="note"><b>Les appels TMDB sont sortis du pouce.</b> Une passe de fond — comme la veille — pagine TMDB à un rythme civil, filtre contre votre médiathèque, vos notes, vos suivis et vos écartés, puis range les survivants dans une réserve locale. Mesuré sur vos vraies données : <b>32 appels → 503 suggestions</b>. L'écran lit la réserve, donc défiler ne coûte plus rien — c'est ce qui rend les lots de 30 possibles sans jamais faire de rafale (NE-DOIT-PAS-8).</div>
    <div class="note"><b>Gestes.</b> Le poster ouvre la fiche. Le reste de la carte ouvre le panneau du bas (« Suivre » / « Ajouter », « Voir la fiche »). Un glissé <em>dans un sens ou dans l'autre</em> écarte la suggestion — avec un « Annuler » dans la notification, parce qu'un geste rapide se trompe.</div>
    ${S.phase === "chargement" ? skelCards(4) : S.phase === "erreur" ? surfErr("les suggestions") : ""}
    <div id="sugitems"${S.phase !== "prete" ? " hidden" : ""}></div>
    <div id="sugload" class="loadfoot"${S.phase !== "prete" ? " hidden" : ""}></div>
    <div class="note"><b>Si le compte TMDB n'est pas connecté</b>, la vue ne se vide pas : elle sert les similaires de votre médiathèque et dit ce qui manque et pourquoi. §8 — aucun rien silencieux.</div>
  </div>`
    );
  }

  function viewLibrary() {
    const lenses = [
      { id: "cat", l: "Médias" },
      { id: "inc", l: "Incomplets", warn: true, c: 47 },
      { id: "rec", l: "Récents" },
    ];
    const head = `<div class="viewtabs">
    <div class="seg" role="tablist">${lenses
      .map(
        (x) => `
      <button role="tab" aria-selected="${S.libLens === x.id}" data-lens="${x.id}">${x.l}</button>`,
      )
      .join("")}
    </div>
  </div>
  <div class="filters">
    <div class="search">${svg(I.search)}<input type="search" id="libq" value="${esc(S.q)}" placeholder="Chercher dans ma médiathèque" aria-label="Chercher">${S.q ? `<button class="searchclear" data-clearq="lib" aria-label="Effacer">${svg(I.x)}</button>` : ""}</div>
    ${
      S.libLens === "cat"
        ? `<div class="pillbar">
      <div class="pillscroll">${CATS.map((c) => `<button class="pill" aria-pressed="${S.libCat === c.id}" data-cat="${c.id}">${c.l}<span class="c">${c.c}</span></button>`).join("")}</div>
      <div class="vswwrap"><div class="vsw">
        <button aria-pressed="${S.libMode === "list"}" data-lmode="list" aria-label="Liste">${svg(I.list)}</button>
        <button aria-pressed="${S.libMode === "grid"}" data-lmode="grid" aria-label="Grille">${svg(I.grid)}</button>
      </div></div>
    </div>`
        : ""
    }
  </div>`;

    if (S.libLens === "inc") {
      return (
        head +
        `<div class="body">
      <div class="note"><b>Une seule dérivation par question (§13).</b> La fraction affichée ici lit le même calcul que la fiche et que les en-têtes de saison. Une saison dont le nombre d'épisodes est inconnu affiche <code>?</code> — jamais un <code>12/12</code> inventé.</div>
      ${secHTML(
        "warning",
        "Séries incomplètes",
        "47",
        INCOMPLETE.map((o) =>
          cardHTML(
            {
              t: o.t,
              s: `${o.y} · il manque ${o.a - o.o} épisode${o.a - o.o > 1 ? "s" : ""}`,
              f: `${o.o}/${o.a}`,
              chip: ["warning", "Incomplet"],
            },
            { foot: "Compléter → Acquisition" },
          ),
        ).join(""),
      )}
    </div>`
      );
    }

    if (S.libLens === "rec") {
      return (
        head +
        `<div class="body">
      <div class="note"><b>Libellé honnête.</b> La base ne connaît pas la date d'arrivée sur le disque, seulement celle où <em>l'index a vu le média pour la première fois</em>. C'est donc ce que la page dit — §13 : aucun état affiché n'est une approximation muette.</div>
      <div class="countline"><span>Vu par l'index pour la première fois</span></div>
      <div id="libitems" class="grid"></div>
      <div id="libload" class="loadfoot"></div>
    </div>`
      );
    }

    const rows = RECENT.concat(
      INCOMPLETE.map((o) => ({ t: o.t, f: `${o.o}/${o.a} épisodes` })),
    );
    const grid = rows
      .map(
        (o) =>
          `<button class="tile" data-fiche="${esc(o.t)}"><span class="p">${posterBox(o.t, o.k)}</span><span class="nm">${esc(o.t)}</span><span class="fr">${esc(o.f)}</span></button>`,
      )
      .join("");
    const list = rows
      .map((o) =>
        swipeHTML(
          cardHTML({ t: o.t, s: o.f }),
          `<button class="act remove" data-del="${esc(o.t)}">${svg(I.trash)}Supprimer</button>`,
        ),
      )
      .join("");

    return (
      head +
      `<div class="countline"><span id="libcount"></span>
    <button class="linkbtn" data-selmode="1">Sélectionner</button>
    <button style="margin-left:12px">${svg(I.sort)}Ajout récent</button></div>
  <div class="body">
    <div class="note"><b>Page entièrement neuve.</b> Aucune route ne listait ce que vous possédez : la fiche <code>/media/:provider/:id</code> n'était atteignable qu'en connaissant déjà l'identifiant. En mode liste, un glissé vers la gauche révèle « Supprimer ».</div>
    <div id="libitems" class="${S.libMode === "grid" ? "grid" : "sec"}"></div>
    <div id="libload" class="loadfoot"></div>
    <div class="note"><b>Chargement : défilement infini, parce qu'ici c'est gratuit.</b> La médiathèque se lit dans <code>library.db</code>, en local : une page de 24 de plus ne coûte ni quota ni réseau externe. La ligne de compte au-dessus dit toujours combien sont affichés sur le total — §8, on ne cache jamais ce qui manque.</div>
  </div>`
    );
  }

  function viewArrivals() {
    const st = D.stuck(), mv = D.moving(), se = D.settled();
    const rien = st.length + mv.length + se.length === 0;
    if (S.phase !== "prete")
      return `<div class="body">${S.phase === "erreur" ? surfErr("ce qui arrive") : skelCards(3)}</div>`;
    return `<div class="body">
    <div class="note"><b>Cette page remplace <code>/medias</code> et <code>/pipeline</code>.</b> Vous alliez dans Pipeline pour une seule raison : vérifier que vos ajouts manuels qBittorrent étaient bien passés. Ils sont ici, avec tout le reste de ce qui entre — la provenance est une ligne, pas une page.</div>
    ${
      S.scen === "reel"
        ? `<div class="note"><b>Contenu réel de la zone de staging</b>, lu le 2026-08-10 : deux dossiers, tous deux bloqués pour des raisons différentes. C'est l'état que vous auriez vu en ouvrant l'app ce jour-là.</div>`
        : ""
    }
    ${mv.length > 0 ? `<div class="live"><span class="d"></span><span>Scraping en cours : <b>Furious</b> S01E01 — affiches récupérées</span></div>` : ""}
    ${
      rien
        ? emptyHTML(
            "Rien n'entre en ce moment.",
            "La zone de staging est vide : aucun média en cours de traitement, rien de bloqué. Le dernier passage du pipeline date de 14 h 12.",
          )
        : ""
    }
    ${secHTML(
      "danger",
      "Ça coince",
      String(st.length),
      st.map((o) => cardHTML(o, { foot: "Résoudre →", footAct: "resolve" })).join(""),
      "<b>La raison ne tronque jamais (§12).</b> C'est ce sur quoi vous décidez : elle passe à la ligne et l'action descend en pleine largeur sous la frise.",
    )}
    ${
      S.scen !== "reel"
        ? `<button class="crossref" data-go="acq">2 de ces éléments viennent d'une acquisition suivie. <span>Acquisition →</span></button>`
        : ""
    }
    ${secHTML("info", "Ça avance", String(mv.length), mv.map((o) => cardHTML(o)).join(""))}
    ${secHTML("success", "Rangé aujourd'hui", String(se.length), se.map((o) => cardHTML(o)).join(""))}
  </div>`;
  }

  function viewSystem() {
    return `<div class="body">
    <div class="note"><b>Réception seule.</b> Système reçoit la santé et les runs venus de Contrôle et Pipeline, mais sa refonte mobile est différée, comme convenu. Pendant un temps, cette page ne parlera pas tout à fait la même langue que les trois autres — c'est le coût assumé.</div>

    <h2 class="h2">Santé</h2>
    <div class="panel">
      <div class="kv"><span>Disques</span><span><span class="pip success"></span>3 sur 4 · 8,4 To libres</span></div>
      <div class="kv"><span>Index médiathèque</span><span><span class="pip success"></span>à jour · 1 861 items</span></div>
      <div class="kv"><span>Redis</span><span><span class="pip success"></span>connecté</span></div>
      <div class="kv"><span>TMDB / TVDB</span><span><span class="pip success"></span>disponibles</span></div>
      <div class="kv"><span>qBittorrent</span><span><span class="pip warning"></span>12 torrents différés</span></div>
      <div class="kv"><span>Planificateurs</span><span><span class="pip success"></span>4 actifs</span></div>
    </div>

    <h2 class="h2">Pipeline</h2>
    <div class="panel"><div class="kv"><span>État</span><span><span class="pip neutral"></span>au repos depuis 2 h 14</span></div></div>
    <button class="cfoot solid" style="margin-top:0" data-toast="Pipeline lancé — suivez-le dans Arrivées.">Lancer le pipeline</button>

    <h2 class="h2">Derniers runs</h2>
    <div class="panel">
      <div class="kv"><span>14 h 12 · planifié</span><span>7 rangés</span></div>
      <div class="kv"><span>11 h 40 · planifié</span><span>2 rangés</span></div>
      <div class="kv"><span>09 h 27 · manuel</span><span>4 rangés · 1 bloqué</span></div>
      <div class="kv"><span>06 h 48 · planifié</span><span>rien de nouveau</span></div>
    </div>
    <div class="note"><b>Le détail d'un run vit ici</b>, adressable par <code>?run=&lt;uid&gt;</code>, et s'ouvre en écran — jamais en panneau sous la liste qu'on était en train de lire.</div>
  </div>`;
  }

  /* ── Navigation ──────────────────────────────────────────────── */
  const PAGES_OF = () => [
    {
      id: "acq",
      l: "Acquisition",
      ic: I.radar,
      /* §13 — le badge de nav et le badge d'onglet lisent LA MÊME dérivation :
         ce qui attend l'opérateur = à récupérer + à traiter. Jamais une
         constante, jamais un compteur voisin. */
      badge: D.takeable().length + D.blocked().length,
      render: viewAcquisition,
      fab: true,
    },
    { id: "lib", l: "Médiathèque", ic: I.library, render: viewLibrary },
    { id: "arr", l: "Arrivées", ic: I.inbox, badge: D.stuck().length, render: viewArrivals },
    { id: "sys", l: "Système", ic: I.wrench, render: viewSystem },
  ];

  const $ = (s) => document.querySelector(s);
  const view = $("#view"),
    nav = $("#nav"),
    port = $("#port"),
    fab = $("#fab");

  function renderNav() {
    nav.innerHTML = PAGES_OF().map(
      (
        p,
      ) => `<button data-page="${p.id}" ${S.page === p.id ? 'aria-current="page"' : ""}>
    ${svg(p.ic)}<span class="lb">${p.l}</span>
    ${p.badge ? `<span class="navbadge">${p.badge}</span>` : ""}
  </button>`,
    ).join("");
  }
  function render() {
    const p = PAGES_OF().find((x) => x.id === S.page);
    view.innerHTML = p.render();
    fab.hidden = !p.fab;
    renderNav();
    mountLoaders();
    mountSearch();
  }

  /* ═══ Chargement ══════════════════════════════════════════════════════
     Deux régimes, et la différence n'est pas ergonomique — elle est
     déontologique.

     · MÉDIATHÈQUE  → défilement infini. La source est `library.db`, en
       local : une page de plus ne coûte ni quota provider ni réseau
       externe. Le défilement est le geste naturel du téléphone, alors on
       le sert. Le compte affiché/total reste visible en permanence pour
       qu'on sache toujours où l'on en est dans 1 861 items.

     · DÉCOUVRIR    → lots explicites. Chaque lot coûte des appels TMDB.
       Un défilement infini transformerait un pouce distrait en rafale vers
       une dépendance — NE-DOIT-PAS-8. La suite se demande.

     Dans les deux cas, un échec de chargement se DIT et propose de
     réessayer (§8, DOIT-2) : une liste qui s'arrête en silence se lit
     comme « il n'y a plus rien », ce qui est un mensonge.
     ═════════════════════════════════════════════════════════════════════ */

  const LIB_PAGE = 24;
  const SUG_BATCH = 30;
  let sugObserver = null;
  let libObserver = null;

  /* La tuile ne change pas au repos : la pastille de sélection n'existe
     QUE en mode sélection, et l'appui long reste une action sans pixel. */
  function libTileHTML(o, i) {
    const sel = S.selMode;
    const on = S.selected.has(i);
    return `<button class="tile" data-tile="${i}" ${sel ? `aria-selected="${on}"` : `data-fiche="${esc(o.t)}"`}>
      <span class="p">${posterBox(o.t, o.k)}</span>
      ${sel ? `<span class="sel">${svg(I.check, 3)}</span>` : ""}
      <span class="nm">${esc(o.t)}</span>
      <span class="fr">${esc(o.f)}</span>
    </button>`;
  }
  function libRowHTML(o) {
    return swipeHTML(
      cardHTML({ t: o.t, s: o.f }),
      `<button class="act remove" data-del="${esc(o.t)}">${svg(I.trash)}Supprimer</button>`,
    );
  }

  /* ── Supprimer depuis la vue poster ────────────────────────────────────
     Le problème posé : offrir la suppression dans une grille d'affiches sans
     abîmer la grille. Deux chemins, aucun ne coûte un pixel au repos :

     · APPUI LONG sur une affiche → la même feuille d'actions que partout
       ailleurs (Voir la fiche · Supprimer). Rapide, mais invisible.
     · « Sélectionner » dans la ligne de compte — qui existe déjà — bascule
       la grille en mode sélection : pastilles sur les affiches, barre d'action
       en bas, et la suppression devient MULTIPLE. C'est ce qui rend l'appui
       long découvrable, et c'est le seul chemin qui permet de faire du ménage.

     Le tap simple continue d'ouvrir la fiche : le chemin le plus fréquent
     n'est jamais sacrifié à une action rare (NE-DOIT-PAS-9). */

  function paintSelBar() {
    const old = document.querySelector(".selbar");
    if (old) old.remove();
    if (!S.selMode) return;
    const n = S.selected.size;
    const bar = document.createElement("div");
    bar.className = "selbar";
    bar.innerHTML = `<span class="n">${n === 0 ? "Touchez les affiches à supprimer" : `${n} sélectionné${n > 1 ? "s" : ""}`}</span>
      <button data-selmode="0">Annuler</button>
      <button class="danger" data-delsel="1" ${n === 0 ? "disabled" : ""}>Supprimer</button>`;
    document.querySelector("#device").appendChild(bar);
  }

  let pressTimer = null;
  port.addEventListener(
    "touchstart",
    (e) => {
      const t = e.target.closest("[data-tile]");
      if (!t || S.selMode) return;
      pressTimer = window.setTimeout(() => {
        pressTimer = null;
        openLibSheet(Number(t.dataset.tile));
      }, 480);
    },
    { passive: true },
  );
  const cancelPress = () => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  };
  port.addEventListener("touchend", cancelPress);
  port.addEventListener("touchmove", cancelPress, { passive: true });
  port.addEventListener("touchcancel", cancelPress);

  function openLibSheet(i) {
    const o = LIB[i];
    openSheet(`
      <h3 class="sheettitle">${esc(o.t)}</h3>
      <p class="sheetmeta">${esc(o.f)} · en médiathèque</p>
      <div class="sheetacts">
        <button class="sact primary" data-fiche="${esc(o.t)}">${svg(I.eye)}Voir la fiche</button>
        <button class="sact">${svg(I.refresh)}Re-scraper les métadonnées</button>
      </div>
      <div class="sheetacts secondary">
        <button class="sact danger" data-del="${esc(o.t)}">${svg(I.trash)}Supprimer de la médiathèque</button>
      </div>`);
  }

  function paintLibCount() {
    const el = document.querySelector("#libcount");
    if (!el) return;
    const tot = libFiltered().length;
    const shown = Math.min(S.libCount, tot);
    el.innerHTML =
      S.q.trim() === ""
        ? `<b>${shown}</b> affichés sur <b>1 861</b> · 8,4 To`
        : `<b>${tot}</b> résultat${tot > 1 ? "s" : ""} pour « ${esc(S.q)} » sur <b>1 861</b>`;
  }

  function libFiltered() {
    const t = S.q.trim();
    if (t === "") return LIB;
    const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase();
    return LIB.filter((o) => norm(o.t).includes(norm(t)));
  }

  function fillLib() {
    const box = document.querySelector("#libitems");
    if (!box) return;
    const grid = box.classList.contains("grid");
    const src = libFiltered();
    if (S.phase === "chargement") {
      box.innerHTML = "";
      box.insertAdjacentHTML("afterend", "");
      box.outerHTML = `<div id="libitems" class="${grid ? "grid" : "sec"}">${grid ? '<div class="sk tile"></div>'.repeat(9) : '<div class="sk skcard"></div>'.repeat(5)}</div>`;
      paintLibCount();
      return;
    }
    if (S.phase === "erreur") {
      box.innerHTML = surfErr("votre médiathèque");
      paintLibCount();
      return;
    }
    if (src.length === 0) {
      box.innerHTML = "";
      box.insertAdjacentHTML(
        "beforeend",
        `<div class="empty"><b>Rien ne correspond à « ${esc(S.q)} ».</b>Sur vos <b>1 861</b> médias, aucun titre ne contient ce texte. La recherche ignore la casse et les accents.<br><br>Ce titre n'est peut-être pas chez vous : <b>ajoutez-le</b> depuis Acquisition.</div>`,
      );
      paintLibCount();
      return;
    }
    box.innerHTML = src.slice(0, S.libCount)
      .map((o, i) => (grid ? libTileHTML(o, i) : libRowHTML(o, i)))
      .join("");
    paintSelBar();
    paintLibCount();
  }

  function libFoot() {
    const foot = document.querySelector("#libload");
    if (!foot) return;
    const grid = document.querySelector("#libitems").classList.contains("grid");
    if (S.libCount >= libFiltered().length) {
      // La maquette ne porte que 260 titres réels ; le dire, plutôt que de
      // laisser une fin de liste contredire le « sur 1 861 » du compteur.
      foot.innerHTML = `<p class="endmark">Fin de l'échantillon — cette maquette charge ${LIB.length} titres réels sur les 1 861 de votre médiathèque. En vrai, le défilement continuerait jusqu'au bout.</p>`;
      return;
    }
    if (S.libErr) {
      foot.innerHTML = `<div class="loaderr"><b>Impossible de charger la suite.</b> La connexion a été perdue pendant la requête. Les ${S.libCount} médias déjà affichés restent valides.<button id="libretry">Réessayer</button></div>`;
      document.querySelector("#libretry").onclick = () => {
        S.libErr = false;
        libFoot();
        loadMoreLib();
      };
      return;
    }
    foot.innerHTML = grid
      ? `<div class="grid">${'<div class="sk tile"></div>'.repeat(3)}</div>`
      : `<div class="sec">${'<div class="sk row"></div>'.repeat(2)}</div>`;
    // Sentinelle : le pied de chargement EST la sentinelle.
    if (libObserver) libObserver.disconnect();
    libObserver = new IntersectionObserver(
      (ents) => {
        if (ents.some((e) => e.isIntersecting)) loadMoreLib();
      },
      { root: port, rootMargin: "220px" },
    );
    libObserver.observe(foot);
  }

  function loadMoreLib() {
    if (S.libLoading || S.libErr || S.libCount >= libFiltered().length) return;
    S.libLoading = true;
    if (libObserver) libObserver.disconnect();
    setTimeout(() => {
      S.libLoading = false;
      // Un échec, une seule fois, pour montrer le chemin d'erreur en vrai.
      if (!S.libFailedOnce && S.libCount >= LIB_PAGE * 3) {
        S.libFailedOnce = true;
        S.libErr = true;
        libFoot();
        return;
      }
      S.libCount = Math.min(libFiltered().length, S.libCount + LIB_PAGE);
      fillLib();
      libFoot();
    }, 620);
  }

  /* ── Découvrir : carte à un seul corps tactile ──────────────────────
     · poster           → la fiche (§11, jamais un lien mort)
     · reste de la carte → panneau du bas, même grammaire que Suivis
     · glissé gauche OU droite → écarté, avec « Annuler » dans la notif
     Le verbe suit la nature : on SUIT une série, on AJOUTE un film (§9). */

  function sugVerb(s) {
    return s.k === "Film" ? "Ajouter" : "Suivre";
  }

  function sugCardHTML(s, i) {
    return `<div class="sugwrap" data-sugwrap="${i}">
      <div class="sugback">
        <span>${svg(I.x)}Pas intéressé</span>
        <span>Pas intéressé${svg(I.x)}</span>
      </div>
      <article class="sug">
        <button class="p" data-fiche="${esc(s.t)}" aria-label="Fiche de ${esc(s.t)}">${posterBox(s.t, s.k === "Film" ? "movie" : "show")}</button>
        <button class="sbody" data-sug="${i}" aria-label="${esc(s.t)} — actions">
          <span class="t">${esc(s.t)}</span>
          <span class="m">${esc(s.y)} · ${esc(s.k)}<span class="sugnote">${esc(String(s.note))}</span></span>
          <p class="why">${s.why}</p>
        </button>
      </article>
    </div>`;
  }

  function fillSug() {
    const box = document.querySelector("#sugitems");
    if (!box) return;
    box.innerHTML = SUGGESTIONS.slice(0, S.sugCount)
      .map((s, i) => (S.sugGone.has(i) ? "" : sugCardHTML(s, i)))
      .join("");
  }

  /* Écarter — réversible. Un geste rapide se trompe, donc « Annuler ». */
  function dismissSug(i) {
    const el = document.querySelector(`[data-sugwrap="${i}"]`);
    if (!el) return;
    S.sugGone.add(i);
    el.style.height = el.getBoundingClientRect().height + "px";
    requestAnimationFrame(() => el.classList.add("gone"));
    setTimeout(() => el.remove(), 320);
    toastUndo(`« ${SUGGESTIONS[i].t} » écarté.`, () => {
      S.sugGone.delete(i);
      fillSug();
      sugFoot();
    });
  }

  function openSugSheet(i) {
    const s = SUGGESTIONS[i];
    openSheet(`
      <h3 class="sheettitle">${esc(s.t)}</h3>
      <p class="sheetmeta">${esc(s.y)} · ${esc(s.k)} · note TMDB ${esc(String(s.note))}</p>
      <p class="rulenote">${s.why}</p>
      <div class="sheetacts">
        <button class="sact primary" data-follow="${esc(s.t)}" data-sugidx="${i}">${svg(I.plus)}${sugVerb(s)}</button>
        <button class="sact" data-fiche="${esc(s.t)}">${svg(I.eye)}Voir la fiche</button>
      </div>
      <div class="sheetacts secondary">
        <button class="sact danger" data-dropsug="${i}">${svg(I.x)}Pas intéressé</button>
      </div>
      ${s.k === "Film" ? `<p class="rulenote">Une fois acquis, ce film quittera automatiquement votre liste (§5).</p>` : ""}
    `);
  }

  function sugFoot() {
    const foot = document.querySelector("#sugload");
    if (!foot) return;
    if (S.sugCount >= SUGGESTIONS.length) {
      foot.innerHTML = `<p class="endmark">Fin de la réserve chargée dans cette maquette — ${SUGGESTIONS.length} des 503 suggestions réellement calculées pour vous. La passe de fond en recalcule après chaque nouvelle note TMDB.</p>`;
      return;
    }
    foot.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${'<div class="sk row" style="height:104px"></div>'.repeat(2)}</div>`;
    if (sugObserver) sugObserver.disconnect();
    sugObserver = new IntersectionObserver(
      (ents) => {
        if (ents.some((e) => e.isIntersecting)) loadMoreSug();
      },
      { root: port, rootMargin: "260px" },
    );
    sugObserver.observe(foot);
  }

  function loadMoreSug() {
    if (S.sugLoading || S.sugCount >= SUGGESTIONS.length) return;
    S.sugLoading = true;
    if (sugObserver) sugObserver.disconnect();
    setTimeout(() => {
      S.sugLoading = false;
      S.sugCount = Math.min(SUGGESTIONS.length, S.sugCount + SUG_BATCH);
      fillSug();
      sugFoot();
    }, 420);
  }

  /* La saisie filtre à la frappe (source LOCALE, donc gratuit) — contrairement
     à la recherche providers de l'écran d'ajout, qui part à la validation. */
  function mountSearch() {
    const l = document.querySelector("#libq");
    if (l)
      l.oninput = () => {
        S.q = l.value;
        S.libCount = LIB_PAGE;
        S.libErr = false;
        const pos = l.selectionStart;
        render();
        const n = document.querySelector("#libq");
        if (n) {
          n.focus();
          n.setSelectionRange(pos, pos);
        }
      };
    const f = document.querySelector("#follq");
    if (f)
      f.oninput = () => {
        S.filtre = f.value;
        const pos = f.selectionStart;
        render();
        const n = document.querySelector("#follq");
        if (n) {
          n.focus();
          n.setSelectionRange(pos, pos);
        }
      };
  }

  function mountLoaders() {
    if (libObserver) {
      libObserver.disconnect();
      libObserver = null;
    }
    if (sugObserver) {
      sugObserver.disconnect();
      sugObserver = null;
    }
    if (document.querySelector("#libitems")) {
      fillLib();
      libFoot();
    }
    if (document.querySelector("#sugitems")) {
      fillSug();
      sugFoot();
    }
  }

  /* ── Interactions ────────────────────────────────────────────── */
  function toast(msg) {
    $("#toastmsg").textContent = msg;
    $("#toast").classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => $("#toast").classList.remove("show"), 5000);
  }
  $("#toastx").onclick = () => $("#toast").classList.remove("show");

  /* Une action déclenchée par un GESTE doit pouvoir être défaite : un pouce
     qui glisse se trompe plus souvent qu'un doigt qui appuie. */
  function toastUndo(msg, undo) {
    const host = $("#toast");
    $("#toastmsg").innerHTML =
      `${esc(msg)} <button id="toastundo" style="border:0;background:transparent;color:var(--primary);font-weight:700;padding:0 0 0 10px">Annuler</button>`;
    host.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => host.classList.remove("show"), 6000);
    const u = $("#toastundo");
    if (u)
      u.onclick = (ev) => {
        ev.stopPropagation();
        host.classList.remove("show");
        undo();
      };
  }

  function openSheet(html) {
    $("#sheetin").innerHTML = html;
    $("#sheet").classList.add("open");
    $("#scrim").classList.add("open");
    try {
      history.pushState({ layer: "sheet" }, "");
    } catch (e) {}
  }
  /* Fermeture SANS toucher à l'historique — le pilote du harnais s'en sert
     pour repartir d'une surface propre. Appeler les fermetures « normales »
     à la chaîne faisait remonter `history.back()` au-delà de nos entrées et
     quittait carrément la page. */
  function hideLayers() {
    $("#screen").classList.remove("open");
    $("#sheet").classList.remove("open");
    $("#scrim").classList.remove("open");
    $("#dlg").classList.remove("open");
    closeHarness();
  }

  function closeSheet(pop) {
    // Gardée sur SA couche : sans ça, fermer une feuille déjà fermée consomme
    // une entrée d'historique qui appartenait à quelqu'un d'autre.

    $("#dlg").classList.remove("open");
    $("#scrim").classList.remove("open");

    $("#screen").classList.add("open");

      history.pushState({ layer: "screen" }, "");

  /* ═══ ÉNUMÉRATION DES ÉTATS — HARNAIS ═════════════════════════════════
     Chaque état mesurable porte un identifiant stable et sait s'atteindre.
     `window.__go(id)` conduit à l'état sans passer par des clics : c'est ce
     qui rend la sonde de parité DÉTERMINISTE — sans ça, mesurer « la carte
     bloquée » suppose de savoir la faire apparaître, et cette connaissance
     se perd entre deux sessions.
     Ces identifiants sont ceux que `regions.json` référence.
     ═══════════════════════════════════════════════════════════════════════ */
  const STATES = [
    ["acq-encours-repos", "Acquisition · En cours — état réel (repos)", () => set({ page: "acq", acqTab: "maintenant", scen: "reel", phase: "prete" })],
    ["acq-encours-charge", "Acquisition · En cours — chargé", () => set({ page: "acq", acqTab: "maintenant", scen: "charge", phase: "prete" })],
    ["acq-encours-chargement", "Acquisition · En cours — chargement", () => set({ page: "acq", acqTab: "maintenant", phase: "chargement" })],
    ["acq-encours-erreur", "Acquisition · En cours — erreur", () => set({ page: "acq", acqTab: "maintenant", phase: "erreur" })],
    ["acq-suivis-liste", "Acquisition · Suivis — liste", () => set({ page: "acq", acqTab: "suivis", followMode: "list", pill: "tout", filtre: "", phase: "prete" })],
    ["acq-suivis-groupe", "Acquisition · Suivis — groupé", () => set({ page: "acq", acqTab: "suivis", followMode: "group", pill: "tout", filtre: "", phase: "prete" })],
    ["acq-suivis-grille", "Acquisition · Suivis — grille", () => set({ page: "acq", acqTab: "suivis", followMode: "grid", pill: "tout", filtre: "", phase: "prete" })],
    ["acq-suivis-filtre-vide", "Acquisition · Suivis — filtre sans résultat", () => set({ page: "acq", acqTab: "suivis", followMode: "list", filtre: "zzz", phase: "prete" })],
    ["acq-suivis-pause-vide", "Acquisition · Suivis — « En pause » vide", () => set({ page: "acq", acqTab: "suivis", followMode: "list", pill: "pause", filtre: "", phase: "prete" })],

    ["acq-ajout-vide", "Écran d'ajout — au repos", () => { set({ page: "acq", phase: "prete" }); S.addQ = ""; openAddScreen(""); }],
    ["acq-ajout-resultats", "Écran d'ajout — résultats réels", () => { set({ page: "acq", phase: "prete" }); openAddScreen("star wars"); }],
    ["feuille-suivi-complet", "Feuille de suivi — gros catalogue complet", () => { set({ page: "acq", acqTab: "suivis", phase: "prete" }); openFollowSheet("American Dad!"); }],
    ["feuille-suivi-trous", "Feuille de suivi — matrice à trous", () => { set({ page: "lib", libLens: "inc", phase: "prete" }); openFollowSheet("Les aventures de Tintin"); }],
    ["feuille-parcours", "Feuille de parcours", () => { set({ page: "acq", phase: "prete" }); openJourneySheet("Furious"); }],
    ["feuille-plus", "Feuille « ⋮ » — veille et obligations", () => { set({ page: "acq", phase: "prete" }); openPlusSheet(); }],
    ["lib-grille", "Médiathèque · Médias — grille", () => set({ page: "lib", libLens: "cat", libMode: "grid", q: "", phase: "prete", selMode: false })],
    ["lib-liste", "Médiathèque · Médias — liste", () => set({ page: "lib", libLens: "cat", libMode: "list", q: "", phase: "prete", selMode: false })],
    ["lib-recherche-vide", "Médiathèque — recherche sans résultat", () => set({ page: "lib", libLens: "cat", q: "zzzz", phase: "prete" })],

    ["lib-selection", "Médiathèque — mode sélection", () => { set({ page: "lib", libLens: "cat", libMode: "grid", phase: "prete", selMode: true }); S.selected = new Set([0, 2, 5]); render(); }],
    ["lib-suppression", "Médiathèque — dialogue de suppression", () => { set({ page: "lib", phase: "prete" }); openDeleteDialog("Les Animaniacs"); }],
    ["lib-suppression-multiple", "Médiathèque — suppression multiple", () => { set({ page: "lib", phase: "prete" }); openDeleteDialog(null, ["Les Animaniacs", "La cour de récré", "Earl"]); }],
    ["lib-chargement", "Médiathèque — chargement", () => set({ page: "lib", libLens: "cat", phase: "chargement" })],
    ["lib-erreur", "Médiathèque — erreur", () => set({ page: "lib", libLens: "cat", phase: "erreur" })],
    ["arr-repos", "Arrivées — état réel (2 blocages)", () => set({ page: "arr", scen: "reel", phase: "prete" })],
    ["arr-charge", "Arrivées — chargé", () => set({ page: "arr", scen: "charge", phase: "prete" })],
    ["arr-chargement", "Arrivées — chargement", () => set({ page: "arr", phase: "chargement" })],
    ["arr-erreur", "Arrivées — erreur", () => set({ page: "arr", phase: "erreur" })],
    ["arr-resolution", "Arrivées — écran de résolution", () => { set({ page: "arr", phase: "prete" }); openResolve(); }],

  ];

  function set(patch) {
    hideLayers();
    Object.assign(S, patch);
    if (patch.page || patch.libLens || patch.q !== undefined) S.libCount = LIB_PAGE;
    port.scrollTop = 0;
    render();
  }

  window.__go = (id) => {
    const s = STATES.find((x) => x[0] === id);
    if (!s) throw new Error("état inconnu : " + id);
    closeHarness();
    s[2]();
    return id;
  };
  window.__states = () => STATES.map((s) => s[0]);

  function closeHarness() {
    const el = document.querySelector(".hpanel");
    if (el) el.remove();
  }

  function openHarness() {
    closeHarness();
    const el = document.createElement("div");
    el.className = "hpanel";
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px">
        <h4 style="flex:1">Harnais — hors application</h4>
        <button class="iconbtn" data-hclose="1" aria-label="Fermer">${svg(I.x)}</button>
      </div>
      <p>Ce panneau ne fait pas partie de l'interface. Il pilote les données et les états pour qu'on puisse tous les regarder — et pour que la sonde de parité les atteigne sans deviner. <code>window.__go("id")</code> fait la même chose sans clic.</p>
      <h4>Données</h4>
      <div class="row">
        <button data-hscen="reel" aria-pressed="${S.scen === "reel"}">État réel du 10 août</button>
        <button data-hscen="charge" aria-pressed="${S.scen === "charge"}">Scénario de charge</button>
      </div>
      <h4>Phase de la surface</h4>
      <div class="row">
        ${["prete", "chargement", "erreur"].map((f) => `<button data-hphase="${f}" aria-pressed="${S.phase === f}">${f === "prete" ? "Prête" : f === "chargement" ? "Chargement" : "Erreur"}</button>`).join("")}
      </div>
      <h4>Compte TMDB</h4>
      <div class="row">
        <button data-htmdb="1" aria-pressed="${S.tmdb}">Connecté</button>
        <button data-htmdb="0" aria-pressed="${!S.tmdb}">Non connecté</button>
      </div>
      <h4>${STATES.length} états mesurables</h4>
      <div class="row states">
        ${STATES.map(([id, lab]) => `<button data-hgo="${id}">${esc(lab)}<code>${id}</code></button>`).join("")}
      </div>`;
    document.querySelector("#device").appendChild(el);
  }

  $("#fab").onclick = () => {
    openAddScreen();
  };
    $("#scenBtn").onclick = () => {
    openHarness();
  };
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute(
      "data-theme",
      cur === "light" ? "dark" : "light",
    );
  };

  /* Délégation globale */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;

    if (b.dataset.page) {
      S.page = b.dataset.page;
      port.scrollTop = 0;
      render();
      return;
    }
    if (b.dataset.go) {
      S.page = b.dataset.go;
      if (b.dataset.go === "acq") S.acqTab = "maintenant";
      port.scrollTop = 0;
      render();
      return;
    }
    if (b.dataset.acqtab) {
      S.acqTab = b.dataset.acqtab;
      port.scrollTop = 0;
      render();
      return;
    }
    if (b.dataset.lens) {
      S.libLens = b.dataset.lens;
      // Changer de lentille change la liste : on repart de la première page.
      S.libCount = LIB_PAGE;
      S.libErr = false;
      port.scrollTop = 0;
      render();
      return;
    }
    if (b.dataset.cat) {
      S.libCat = b.dataset.cat;
      S.libCount = LIB_PAGE;
      S.libErr = false;
      port.scrollTop = 0;
      render();
      return;
    }
    if (b.dataset.lmode) {
      S.libMode = b.dataset.lmode;
      render();
      return;
    }
    if (b.dataset.pill) {
      S.pill = b.dataset.pill;
      render();
      return;
    }
    if (b.dataset.fmode) {
      S.followMode = b.dataset.fmode;
      render();
      return;
    }
    if (b.dataset.toast) {
      toast(b.dataset.toast);
      return;
    }

    if (b.dataset.sug) {
      openSugSheet(Number(b.dataset.sug));
      return;
    }
    if (b.dataset.dropsug) {
      const i = Number(b.dataset.dropsug);
      closeSheet();
      dismissSug(i);
      return;
    }
    if (b.dataset.follow) {
      const idx = b.dataset.sugidx;
      const s = idx != null ? SUGGESTIONS[Number(idx)] : null;
      const verb =
        s && s.k === "Film" ? "ajouté à votre liste" : "ajouté à vos suivis";
      closeSheet();
      if (idx != null) {
        S.sugGone.add(Number(idx));
        const el = document.querySelector(`[data-sugwrap="${idx}"]`);
        if (el) {
          el.style.height = el.getBoundingClientRect().height + "px";
          requestAnimationFrame(() => el.classList.add("gone"));
          setTimeout(() => el.remove(), 320);
        }
      }
      toast(`« ${b.dataset.follow} » ${verb} — la recherche commence maintenant.`);
      return;
    }

    if (b.dataset.hclose) {
      closeHarness();
      return;
    }
    if (b.dataset.hgo) {
      window.__go(b.dataset.hgo);
      return;
    }
    if (b.dataset.hscen) {
      S.scen = b.dataset.hscen;
      render();
      openHarness();
      return;
    }
    if (b.dataset.hphase) {
      S.phase = b.dataset.hphase;
      render();
      openHarness();
      return;
    }
    if (b.dataset.htmdb) {
      S.tmdb = b.dataset.htmdb === "1";
      render();
      openHarness();
      return;
    }
    if (b.dataset.phase) {
      S.phase = b.dataset.phase;
      render();
      return;
    }
    if (b.dataset.tmdb) {
      S.tmdb = true;
      render();
      toast("Compte TMDB connecté — la réserve se remplit, vos notes sont lues.");
      return;
    }
    if (b.dataset.clearq) {
      if (b.dataset.clearq === "lib") {
        S.q = "";
        S.libCount = LIB_PAGE;
      } else S.filtre = "";
      render();
      return;
    }
    if (b.dataset.selmode) {
      S.selMode = b.dataset.selmode === "1";
      S.selected.clear();
      render();
      return;
    }
    if (b.dataset.delsel) {
      openDeleteDialog(null, [...S.selected].map((i) => LIB[i].t));
      return;
    }
    if (b.dataset.tile != null && S.selMode) {
      const i = Number(b.dataset.tile);
      if (S.selected.has(i)) S.selected.delete(i);
      else S.selected.add(i);
      b.setAttribute("aria-selected", String(S.selected.has(i)));
      paintSelBar();
      return;
    }
    if (b.dataset.del) {
      closeSheet();
      openDeleteDialog(b.dataset.del);
      return;
    }
    if (b.dataset.fiche) {
      openFiche(b.dataset.fiche);
      return;
    }
    if (b.dataset.act === "resolve") {
      openResolve();
      return;
    }
    if (b.dataset.sheet === "plus") {
      openPlusSheet();
      return;
    }
    if (b.dataset.add) {
      const i = Number(b.dataset.add);
      const r = SEARCH.results[i];
      if (r.owned) {
        openDlg(`<h3>Remplacer « ${esc(r.t)} » ?</h3>
          <p>Ce ${r.k === "Film" ? "film est déjà" : "média est déjà"} en médiathèque. L'acquisition <b>remplacera</b> la version en place par celle qui sera récupérée.</p>
          <div class="dlgacts">
            <button class="dlgbtn danger" data-confirmadd="${i}">Remplacer</button>
            <button class="dlgbtn ghost" id="dlgcancel">Annuler</button>
          </div>`);
        document.querySelector("#dlgcancel").onclick = closeDlg;
        return;
      }
      S.added.add(i);
      openAddScreen();
      toast(`« ${r.t} » ${r.k === "Film" ? "ajouté à votre liste" : "ajouté à vos suivis"} — la recherche commence maintenant.`);
      return;
    }
    if (b.dataset.confirmadd) {
      S.added.add(Number(b.dataset.confirmadd));
      closeDlg();
      openAddScreen();
      toast("Ajouté — la version en place sera remplacée une fois la nouvelle récupérée.");
      return;
    }
    if (b.dataset.search) {
      openAddScreen(b.dataset.search === "1" ? (document.querySelector("#addq")?.value ?? "") : b.dataset.search);
      return;
    }
    if (b.dataset.journey) {
      closeSheet();
      setTimeout(() => openJourneySheet(b.dataset.journey), 260);
      return;
    }
    if (b.dataset.sheet) {
      openDetailSheet(b.dataset.sheet);
      return;
    }
    if (b.classList.contains("cfoot")) {
      toast("Action lancée — le résultat s'affichera ici.");
      return;
    }
    if (b.classList.contains("act")) {
      const t = b.closest(".swipe").querySelector(".ctitle").textContent;
      if (b.classList.contains("remove") && S.page === "lib")
        return openDeleteDialog(t);
      toast(`${b.textContent.trim()} — ${t}`);
      b.closest(".swipe").querySelector(".card").style.transform = "";
      return;
    }
  });

  /* ── Suppression ─────────────────────────────────────────────── */
  function openDeleteDialog(title, many) {
    const titles = many && many.length > 0 ? many : [title];
    const multi = titles.length > 1;
    const inc = (t) => INCOMPLETE.find((x) => x.t === t);
    const followed = titles.filter((t) => FOLLOWS.some((f) => f.t === t) || !!inc(t));
    const files = titles.reduce((n, t) => n + (inc(t) ? inc(t).o : 1), 0);
    const size = (files * 0.41).toFixed(1).replace(".", ",") + " Go";
    const head = multi
      ? `Supprimer ${titles.length} médias ?`
      : `Supprimer « ${esc(titles[0])} » ?`;
    openDlg(`
    <h3>${head}</h3>
    <div class="dryrun">${svg(I.eye)}Simulation — rien ne sera supprimé tant que vous n'aurez pas validé que cette liste dit vrai.</div>
    ${
      multi
        ? `<ul class="manifest">${titles
            .slice(0, 4)
            .map((t) => `<li>${esc(t)}<b>${inc(t) ? inc(t).o : 1} fichier${(inc(t) ? inc(t).o : 1) > 1 ? "s" : ""}</b></li>`)
            .join("")}${titles.length > 4 ? `<li>et ${titles.length - 4} autre${titles.length - 4 > 1 ? "s" : ""}<b></b></li>` : ""}</ul>`
        : ""
    }
    <p>Voici exactement ce qui serait supprimé :</p>
    <ul class="manifest">
      <li>Fichiers vidéo <b>${files} · ${size}</b></li>
      <li>Métadonnées (NFO, affiches, fanart) <b>${files * 3} fichiers</b></li>
      <li>Lignes de la médiathèque <b>${titles.length} item${multi ? "s" : ""}</b></li>
      <li>Entrée Plex <b>${titles.length} · à vérifier</b></li>
    </ul>
    ${
      followed.length > 0
        ? `<div class="warnbox"><b>${followed.length === 1 ? `« ${esc(followed[0])} » est suivi.` : `${followed.length} de ces médias sont suivis.`}</b> Sans action de votre part, ces épisodes seront re-téléchargés à la prochaine recherche.</div>`
        : ""
    }
    <div class="dlgacts">
      ${
        followed.length > 0
          ? `<button class="dlgbtn danger" data-toast="Simulation terminée — 0 fichier touché. Le suivi aurait été arrêté.">Supprimer et arrêter le suivi</button>
      <button class="dlgbtn" data-toast="Simulation terminée — 0 fichier touché. Le suivi aurait été conservé.">Supprimer, garder le suivi</button>`
          : `<button class="dlgbtn danger" data-toast="Simulation terminée — 0 fichier touché.">Supprimer</button>`
      }
      <button class="dlgbtn ghost" id="dlgcancel">Annuler</button>
    </div>`);
    $("#dlgcancel").onclick = closeDlg;
    $("#dlg")
      .querySelectorAll("[data-toast]")
      .forEach((x) =>
        x.addEventListener("click", () => {
          closeDlg();
          if (S.selMode) {
            S.selMode = false;
            S.selected.clear();
            render();
          }
        }),
      );
  }

  /* ── Écrans et feuilles ──────────────────────────────────────── */
  /* ── Fiche média (§11, DOIT-11) ───────────────────────────────────────
     Une DESTINATION, pas une feuille : URL stable /media/:provider/:id, sa
     propre barre « ‹ Retour ». Elle dit ce QU'EST le média et où il en est
     CHEZ NOUS. Une donnée absente s'écrit « inconnu » — jamais un tiret muet
     (§14.3 : une étape inconnue se dit inconnue, jamais « pas faite »). */
  const FICHES = {
    Silo: {
      y: "2023", kind: "Série", prov: "TVDB 400458 · TMDB 125988", note: "8,2",
      g: "Science-Fiction & Fantastique · Drame",
      cr: "Graham Yost",
      ov: "Dans un monde futur dévasté et toxique, des milliers de survivants habitent un gigantesque silo souterrain. Après la transgression d'une règle d'or par leur shérif et la mort mystérieuse de plusieurs résidents, Juliette, une mécanicienne, perce peu à peu les terribles secrets du Silo.",
      saisons: [[3, 6, 6], [2, 10, 10], [1, 10, 10]],
    },
  };

  function openFiche(title) {
    const f = FICHES[title] ?? null;
    const ss = f ? f.saisons : (SEASONS[title] ?? []).slice().sort((a, b) => b[0] - a[0]);
    const own = ss.reduce((n, x) => n + x[2], 0);
    const aired = ss.reduce((n, x) => n + x[1], 0);
    const pct = aired ? Math.round((own / aired) * 100) : null;
    openScreen(`<div class="fichebar">
      <button class="fback" onclick="__close('screen')">${svg(I.left)}Retour</button>
      <span style="margin-left:auto;font-size:11px;color:var(--muted-foreground)">/media/tvdb/400458</span>
    </div>
    <div class="port"><div class="body">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span class="sheetposter" style="width:96px;font-size:30px">${posterBox(title, "show")}</span>
        <div style="min-width:0;flex:1">
          <h2 style="margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em">${esc(title)}</h2>
          <p style="margin:5px 0 0;font-size:12px;color:var(--muted-foreground);line-height:1.5">
            ${f ? `${f.y} · ${f.kind} · note ${f.note}<br>${esc(f.g)}<br><span style="font-size:11px">${esc(f.prov)}</span>` : "Métadonnées inconnues"}
          </p>
        </div>
      </div>

      <div>
        <h2 class="h2" style="margin-bottom:6px">Synopsis</h2>
        <p style="margin:0;font-size:12.5px;line-height:1.55;color:var(--muted-foreground)">${f ? esc(f.ov) : "Synopsis inconnu — le provider n'en fournit pas."}</p>

  /* ── Feuille de détail d'un suivi, avec sa matrice de saisons ──────────
     Règles des GROS catalogues, mesurées sur American Dad! (22 saisons,
     403 épisodes) : saison la plus récente en premier ; une saison complète
     est REPLIÉE (son en-tête suffit à dire qu'il n'y a rien) ; une saison
     incomplète est OUVERTE et porte « N manquant(s) » ; la légende est
     AU-DESSUS de la matrice — sous 403 épisodes elle serait invisible
     exactement quand on en a besoin. */

  function epState(o, sn, num, owned) {
    if (num <= owned) return "en_mediatheque";
    if (o && o.st === "en_attente") return "en_attente";
    if (o && o.st === "en_acquisition") return "en_acquisition";

  function seasonHTML(o, s) {
    const [num, aired, owned] = s;
    const complete = owned >= aired;
    const manque = aired - owned;
    const cells = Array.from({ length: aired }, (_, i) => {
      const n = i + 1, st = epState(o, num, n, owned);
      return `<button class="ep ${st}" title="S${String(num).padStart(2, "0")}E${String(n).padStart(2, "0")} — ${EP_LABEL[st]}">${String(n).padStart(2, "0")}</button>`;
    }).join("");
    return `<details class="season"${complete ? "" : " open"}>
      <summary>Saison ${num}
        <span class="sfr">${owned}/${aired}</span>
        ${complete ? "" : `<span class="miss">${manque} manquant${manque > 1 ? "s" : ""}</span>`}
      </summary>
      <div class="eps">${cells}</div>
    </details>`;
  }

  function openFollowSheet(title) {

    /* §5.4 — une seule dérivation : la fraction de la carte, celle de l'en-tête

    const frac = isFilm ? null : seasons.length ? `${own}/${aired}` : (stFraction(o) ?? "—");
    const etats = seasons.length
      ? [...new Set(seasons.flatMap((s) => [

            : `<p class="rulenote">Aucune donnée de saison connue pour cette série — le catalogue n'a pas encore été récupéré. La fraction affiche « — », jamais « 0/0 » qui se lirait comme une série vide.</p>`
      }
      <div class="sheetacts secondary">
        <button class="sact" data-fiche="${esc(o.t)}">${svg(I.eye)}Voir la fiche</button>
        <button class="sact" data-journey="${esc(o.t)}">${svg(I.refresh)}Voir le parcours</button>

             <div style="padding:14px">${emptyHTML("Cherchez un titre.", "Vos recherches récentes sont au-dessus. La recherche part à la validation, jamais à chaque frappe — sinon chaque lettre coûte un appel aux providers.")}</div>`

          <p class="whyoff">Identifiant refusé : « 12e34 » n'est pas un nombre — <code>Number()</code> le lirait comme une notation scientifique. Un id TMDB ne contient que des chiffres ; IMDB attend <code>tt1234567</code>.</p>

  function openPlusSheet() {
    openSheet(`
    <h3 class="sheettitle">Veille et obligations</h3>
    <p class="sheetmeta">Second rang — consulté, pas surveillé.</p>
    <div class="panel" style="margin-bottom:14px">
      <div class="kv"><span>Dernier passage</span><span>il y a 22 min</span></div>
      <div class="kv"><span>Prochain passage</span><span>dans 38 min</span></div>
      <div class="kv"><span>Ratio global</span><span><span class="pip success"></span>2,41</span></div>
      <div class="kv"><span>Obligations en cours</span><span>3 torrents</span></div>
    </div>
    <div class="sheetacts">
      <button class="sact primary">${svg(I.refresh)}Lancer la veille maintenant</button>
    </div>`);
  }

  window.__close = (k) => (k === "screen" ? closeScreen() : closeSheet());

  /* ── Gestes ──────────────────────────────────────────────────── */
  /* 1) Swipe de carte — un glissé né sur une carte appartient à la carte. */
  let cardDrag = null;
  port.addEventListener(
    "touchstart",
    (e) => {
      const sw = e.target.closest(".swipe");
      if (!sw || e.touches.length !== 1) return;
      const t = e.touches[0];
      cardDrag = {
        sw,
        card: sw.querySelector(".card"),
        x: t.clientX,
        y: t.clientY,
        axis: null,
        dx: 0,
        max: sw.querySelectorAll(".act").length * 84,
      };
    },
    { passive: true },
  );
  port.addEventListener(
    "touchmove",
    (e) => {
      if (!cardDrag || e.touches.length !== 1) return;
      const t = e.touches[0],
        dx = t.clientX - cardDrag.x,
        dy = t.clientY - cardDrag.y;
      if (cardDrag.axis === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        cardDrag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
        if (cardDrag.axis === "x") cardDrag.card.classList.add("dragging");
      }
      if (cardDrag.axis !== "x") return;
      cardDrag.dx = Math.max(-cardDrag.max, Math.min(0, dx));
      cardDrag.card.style.transform = `translateX(${cardDrag.dx}px)`;
    },
    { passive: true },
  );
  function endCardDrag() {
    if (!cardDrag) return;
    const d = cardDrag;
    cardDrag = null;
    if (d.axis !== "x") return;
    d.card.classList.remove("dragging");
    d.card.style.transform =
      d.dx < -d.max / 2.4 ? `translateX(${-d.max}px)` : "";
  }
  port.addEventListener("touchend", endCardDrag);
  port.addEventListener("touchcancel", endCardDrag);

  /* 1 bis) Carte de suggestion : glissée dans un sens OU l'autre = écarter.
     Même raison que `.swipe` : la rangée réclame l'axe horizontal, sinon le
     navigateur s'attribue le geste et l'annule au premier pixel. */
  let sugDrag = null;
  port.addEventListener(
    "touchstart",
    (e) => {
      const w = e.target.closest(".sugwrap");
      if (!w || e.touches.length !== 1) return;
      const t = e.touches[0];
      sugDrag = { w, card: w.querySelector(".sug"), x: t.clientX, y: t.clientY, axis: null, dx: 0 };
    },
    { passive: true },
  );
  port.addEventListener(
    "touchmove",
    (e) => {
      if (!sugDrag || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - sugDrag.x, dy = t.clientY - sugDrag.y;
      if (sugDrag.axis === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        sugDrag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
        if (sugDrag.axis === "x") sugDrag.card.classList.add("dragging");
      }
      if (sugDrag.axis !== "x") return;
      sugDrag.dx = dx;
      sugDrag.card.style.transform = `translateX(${dx}px)`;
      sugDrag.card.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 260));
    },
    { passive: true },
  );
  function endSugDrag() {
    if (!sugDrag) return;
    const d = sugDrag;
    sugDrag = null;
    if (d.axis !== "x") return;
    d.card.classList.remove("dragging");
    if (Math.abs(d.dx) > 92) {
      d.card.style.transform = `translateX(${d.dx > 0 ? 420 : -420}px)`;
      dismissSug(Number(d.w.dataset.sugwrap));
    } else {
      d.card.style.transform = "";
      d.card.style.opacity = "";
    }
  }
  port.addEventListener("touchend", endSugDrag);
  port.addEventListener("touchcancel", endSugDrag);

  /* 2) Swipe entre vues + 3) Pull-to-refresh — sur le reste de la surface.
      TOUS les écouteurs sont passifs : un seul touchmove non-passif sort iOS
      du compositeur et fait trembler le chrome collant. */
  let pageDrag = null,
    refreshing = false;
  const ptr = $("#ptr");
  port.addEventListener(
    "touchstart",
    (e) => {
      if (
        e.touches.length !== 1 ||
        e.target.closest(".swipe") ||
        e.target.closest(".sugwrap") ||
        e.target.closest(".pillscroll")
      ) {
        pageDrag = null;
        return;
      }
      const t = e.touches[0];
      if (t.clientX - port.getBoundingClientRect().left < 30) {
        pageDrag = null;
        return;
      } /* zone morte iOS */
      pageDrag = {
        x: t.clientX,
        y: t.clientY,
        axis: null,
        dx: 0,
        dy: 0,
        atTop: port.scrollTop <= 0,
      };
    },
    { passive: true },
  );
  port.addEventListener(
    "touchmove",
    (e) => {
      if (!pageDrag || e.touches.length !== 1) return;
      const t = e.touches[0],
        dx = t.clientX - pageDrag.x,
        dy = t.clientY - pageDrag.y;
      if (pageDrag.axis === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        pageDrag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      }
      pageDrag.dx = dx;
      pageDrag.dy = dy;
      if (pageDrag.axis === "y" && pageDrag.atTop && dy > 0 && !refreshing) {
        const h = Math.min(72, dy * 0.45);
        ptr.style.height = h + "px";
        ptr.style.transition = "none";
        ptr.classList.toggle("armed", h >= 44);
      }
    },
    { passive: true },
  );
  function endPageDrag() {
    if (!pageDrag) return;
    const d = pageDrag;
    pageDrag = null;
    ptr.style.transition = "";
    if (d.axis === "y") {
      if (
        d.atTop &&
        d.dy > 0 &&
        ptr.classList.contains("armed") &&
        !refreshing
      ) {
        refreshing = true;
        ptr.classList.add("loading");
        ptr.style.height = "44px";
        setTimeout(() => {
          refreshing = false;
          ptr.classList.remove("loading", "armed");
          ptr.style.height = "0px";
          toast("Actualisé.");
        }, 1100);
      } else {
        ptr.style.height = "0px";
        ptr.classList.remove("armed");
      }
      return;
    }
    if (d.axis === "x" && Math.abs(d.dx) > 60) {
      if (S.page === "acq") {
        const order = ["maintenant", "suivis", "decouvrir"],
          i = order.indexOf(S.acqTab);
        const n =
          d.dx < 0 ? Math.min(order.length - 1, i + 1) : Math.max(0, i - 1);
        if (n !== i) {
          S.acqTab = order[n];
          port.scrollTop = 0;
          render();
        }
      } else if (S.page === "lib") {
        const order = ["cat", "inc", "rec"],
          i = order.indexOf(S.libLens);
        const n =
          d.dx < 0 ? Math.min(order.length - 1, i + 1) : Math.max(0, i - 1);
        if (n !== i) {
          S.libLens = order[n];
          port.scrollTop = 0;
          render();
        }
      }
    }
  }
  port.addEventListener("touchend", endPageDrag);
  port.addEventListener("touchcancel", endPageDrag);

  /* 4) Feuille : glisser la poignée pour fermer */
  let sheetDrag = null;
  $("#sheetgrab").addEventListener(
    "touchstart",
    (e) => {
      sheetDrag = { y: e.touches[0].clientY, dy: 0 };
      $("#sheet").classList.add("dragging");
    },
    { passive: true },
  );
  $("#sheetgrab").addEventListener(
    "touchmove",
    (e) => {
      if (!sheetDrag) return;
      sheetDrag.dy = Math.max(0, e.touches[0].clientY - sheetDrag.y);
      $("#sheet").style.transform = `translateY(${sheetDrag.dy}px)`;
    },
    { passive: true },
  );
  $("#sheetgrab").addEventListener("touchend", () => {
    if (!sheetDrag) return;
    const d = sheetDrag;
    sheetDrag = null;
    $("#sheet").classList.remove("dragging");
    $("#sheet").style.transform = "";
    if (d.dy > 70) closeSheet();
  });

  render();
  /* L'aide d'accueil s'efface à la première interaction : une bulle qui
     revient par-dessus une feuille ouverte est une gêne, pas une aide. */
  let hintShown = false;
  setTimeout(() => {
    if (hintShown) return;
    hintShown = true;
    toast("Touchez le ⓘ en haut pour afficher les notes de conception.");
  }, 900);
  document.addEventListener(
    "pointerdown",
    () => {
      hintShown = true;
      const t = $("#toast");
      if (t.textContent.includes("notes de conception")) t.classList.remove("show");
    },
    { capture: true },
  );
</script>
